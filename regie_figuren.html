<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figuren am Tisch — Spielleitung</title>
<style>
:root{
  --bg:#12232a;--surface:rgba(255,255,255,.05);--border:rgba(201,168,76,.22);
  --dark:#1a2e35;--teal:#2A9D8F;--gold:#c9a84c;--lgold:rgba(201,168,76,.12);
  --ink:#fefcf8;--gray:#9a9080;--red:#8b2626;--green:#2D6A4F;--amber:#ca6702;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Libre Baskerville',Georgia,serif;background:var(--bg);color:var(--ink);min-height:100vh}

.topbar{position:sticky;top:0;z-index:100;background:rgba(18,35,42,.97);border-bottom:1px solid var(--border);backdrop-filter:blur(10px);display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;flex-wrap:wrap}
.brand{font-family:'Cinzel',serif;color:var(--gold);font-size:.95rem;letter-spacing:.13em}
/* Die Werkstatt: ein Gegenstand, den es im Regelwerk nicht gibt. */
.wst{background:var(--card);border:1px solid var(--gold);border-radius:6px;
  padding:.8rem .9rem;margin-bottom:1rem}
.wst h3{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.1em;color:var(--gold);
  margin:0 0 .2rem;text-transform:uppercase}
.wst .wh{font-size:.72rem;color:var(--gray);font-style:italic;line-height:1.5;margin-bottom:.6rem}
.wst-f{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.wst-f label{font-size:.68rem;color:var(--gray);display:flex;flex-direction:column;gap:.15rem}
.wst-f input,.wst-f select{font-family:inherit;font-size:.76rem;padding:.25rem .4rem;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.wst-f input.lang{min-width:15rem}
.wst-liste{margin-top:.7rem;display:flex;flex-wrap:wrap;gap:.35rem}
.wst-w{display:flex;align-items:center;gap:.35rem;border:1px solid var(--line);
  border-radius:11px;padding:.1rem .3rem .1rem .6rem;font-size:.74rem}
.wst-w b{font-weight:400;color:var(--gold)}
.wst-w .x{cursor:pointer;color:var(--gray);padding:0 .2rem}
.wst-w .x:hover{color:#e05555}
.wst-meld{font-size:.72rem;margin-top:.5rem;min-height:1rem}
/* Getragenes: Der Chip selbst erklaert den Gegenstand, das Kreuz zieht ihn
   ein. Vorher loeste JEDER Klick auf den Chip das Einziehen aus - ein
   Fehlgriff kostete der Figur ihre Waffe, ohne Rueckfrage. */
.tag.ausr{display:inline-flex;align-items:center;gap:.3rem;padding-right:.25rem}
.tag.ausr .wert{color:var(--gray);font-size:.64rem}
.tag.ausr .zu{cursor:pointer;color:var(--gray);padding:0 .15rem;border-radius:3px}
.tag.ausr .zu:hover{color:#e05555;background:rgba(224,85,85,.12)}
.last{font-size:.66rem;color:var(--gray);margin:.15rem 0 .35rem}
/* Das Charakterbild des Spielers. Klein - es geht hier nur darum, zu
   sehen, WELCHES Bild an der Karte steht, nicht es zu betrachten. */
.pcbild{display:flex;gap:.5rem;align-items:center}
.pcbild img{width:42px;height:56px;object-fit:cover;object-position:top;
  border:1px solid rgba(201,168,76,.3);border-radius:4px;background:#000;display:block}
.pcbild.aus img{opacity:.35;filter:grayscale(1)}
.pcbild-t{display:flex;flex-direction:column;gap:.25rem;font-size:.66rem;color:var(--gray)}
.last b{color:var(--ink);font-weight:400}
.last .voll{color:var(--amber)}

/* ── Warenliste ── */
.wk{display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;margin-bottom:.8rem;
  padding-bottom:.7rem;border-bottom:1px solid var(--border)}
.wk label{font-size:.66rem;color:var(--gray);display:flex;flex-direction:column;gap:.15rem}
.wk input,.wk select{font-family:inherit;font-size:.8rem;padding:.3rem .45rem;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.wk input{min-width:16rem}
.wk .zahl{font-size:.7rem;color:var(--gray);padding-bottom:.35rem}
.wart{margin-bottom:1rem}
.wart>h3{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.12em;color:var(--gold);
  text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:.2rem;
  margin-bottom:.3rem}
.wz{display:flex;gap:.6rem;align-items:baseline;padding:.3rem .2rem;flex-wrap:wrap;
  border-bottom:1px solid rgba(255,255,255,.05)}
.wz:hover{background:rgba(201,168,76,.05)}
.wz .wn{flex:1;min-width:11rem;font-size:.82rem}
.wz .wn small{display:block;font-size:.68rem;color:var(--gray);font-style:italic;line-height:1.5}
.wz .wv{font-size:.72rem;font-family:'Cinzel',serif;color:var(--gray);white-space:nowrap}
.wz .wv b{color:var(--ink);font-weight:400}
.wz mark{background:rgba(201,168,76,.3);color:var(--ink);border-radius:2px}
.wz .sl-ware{font-size:.6rem;color:var(--teal);border:1px solid var(--teal);
  border-radius:9px;padding:0 .35rem}
.wleer{color:var(--gray);font-style:italic;font-size:.8rem;padding:1rem 0}

/* ── Kampf ── */
.kk{display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;margin-bottom:.8rem;
  padding-bottom:.7rem;border-bottom:1px solid var(--border)}
.kk label{font-size:.66rem;color:var(--gray);display:flex;flex-direction:column;gap:.15rem}
.kk input,.kk select{font-family:inherit;font-size:.8rem;padding:.3rem .45rem;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.kk .runde{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold);padding-bottom:.3rem}
.ki{display:flex;align-items:center;gap:.6rem;padding:.35rem .4rem;flex-wrap:wrap;
  border-bottom:1px solid rgba(255,255,255,.05)}
.ki.dran{background:rgba(201,168,76,.1);border-left:2px solid var(--gold)}
.ki.raus{opacity:.4}
.ki .kt{font-family:'Cinzel',serif;font-size:.86rem;color:var(--gold);min-width:3.2rem}
.ki .kt.joker{color:#e0a060}
.ki .kn{flex:1;min-width:9rem;font-size:.84rem}
.ki .kn small{color:var(--gray);font-size:.68rem}
.ki .kz{font-size:.7rem;color:var(--gray);display:flex;gap:.3rem;align-items:center}
.ki .zst{border:1px solid var(--amber);color:var(--amber);border-radius:9px;padding:0 .35rem;font-size:.64rem}
.ki .zst.wnd{border-color:#c05555;color:#e08080}
.kansage{border:1px solid var(--gold);border-radius:6px;padding:.6rem .8rem;margin-bottom:.8rem;
  background:rgba(201,168,76,.06);font-size:.82rem;line-height:1.6}
.kansage b{color:var(--gold);font-weight:400}
.kansage .wirk{margin-top:.4rem;font-size:.9rem;color:var(--ink)}
.kleer{color:var(--gray);font-style:italic;font-size:.8rem;padding:1rem 0;line-height:1.6}
/* Die Aufstellung: drei Baender fuer die Gegner, darunter die eigene
   Seite. Wo einer steht, IST die Entfernung. */
.kfeld{margin:.6rem 0 1rem}
.kband{display:flex;align-items:center;gap:.6rem;min-height:3.2rem;padding:.35rem .5rem;
  border:1px dashed rgba(201,168,76,.22);border-radius:6px;margin-bottom:.35rem;flex-wrap:wrap}
.kband.ziel{border-color:var(--gold);background:rgba(201,168,76,.08)}
.kband>.bl{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.1em;color:var(--gray);
  text-transform:uppercase;min-width:5.5rem}
.kband>.bl small{display:block;font-size:.58rem;opacity:.8}
.kmitte{border-top:1px solid var(--border);margin:.6rem 0}
.ktok{display:flex;flex-direction:column;gap:.1rem;border:1px solid var(--line);
  border-radius:6px;padding:.3rem .5rem;background:var(--card);cursor:grab;min-width:7rem}
.ktok:active{cursor:grabbing}
.ktok .tn{font-size:.8rem}
.ktok .tw{font-size:.62rem;color:var(--gray);font-family:'Cinzel',serif}
.ktok .tz{display:flex;gap:.2rem;flex-wrap:wrap;margin-top:.1rem}
.ktok.gewaehlt{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.ktok.ziel{border-color:#4caf7d}
.ktok.raus{opacity:.35;cursor:default}
.ktok.feind{border-left:3px solid #c05555}
.ktok.freund{border-left:3px solid var(--teal)}
.khinw{font-size:.68rem;color:var(--gray);font-style:italic;margin-bottom:.4rem;line-height:1.5}
.klog{margin-top:1rem;border-top:1px solid var(--border);padding-top:.6rem}
.klog>h3{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.12em;color:var(--gray);
  text-transform:uppercase;margin-bottom:.35rem;display:flex;gap:.6rem;align-items:baseline}
.klz{display:flex;gap:.5rem;align-items:baseline;font-size:.76rem;padding:.16rem 0;
  border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5}
.klz .kr{font-family:'Cinzel',serif;font-size:.62rem;color:var(--gray);min-width:3.2rem}
.klz .kx{flex:1}
.klz b{color:var(--ink);font-weight:400}
.klz.treffer b.w{color:#e08080}
.klz.daneben{opacity:.6}
.klz.runde{color:var(--gold);font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.08em;
  border-bottom-color:rgba(201,168,76,.25);margin-top:.3rem}
.wst .mini{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.06em;background:transparent;
  border:1px solid var(--border);color:var(--gray);border-radius:4px;padding:.24rem .6rem;cursor:pointer}
.wst .mini:hover{border-color:var(--gold);color:var(--ink)}
.badge{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.08em;border:1px solid var(--border);color:var(--gray);border-radius:10px;padding:.1rem .55rem}
.btn{padding:.34rem .8rem;border-radius:5px;font-family:'Cinzel',serif;font-size:.66rem;letter-spacing:.08em;border:1px solid rgba(201,168,76,.4);cursor:pointer;font-weight:600;background:transparent;color:var(--gold);transition:all .18s}
.btn:hover{background:var(--lgold)}
.btn.on{background:var(--gold);color:var(--dark);border-color:var(--gold)}

.wrap{max-width:1400px;margin:0 auto;padding:1rem}
.fbnote{font-size:.74rem;padding:.5rem .8rem;border-radius:5px;margin-bottom:.9rem;display:none;line-height:1.6}
.fbnote.warn{display:block;background:rgba(202,103,2,.14);border:1px solid rgba(202,103,2,.5);color:#f0c48a}
.leer{color:var(--gray);font-style:italic;padding:2rem 1rem;text-align:center;line-height:1.7}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:.9rem;align-items:start}
.fig{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.fig-h{background:var(--lgold);border-bottom:1px solid var(--border);padding:.55rem .8rem}
.fig-n{font-family:'Cinzel',serif;color:var(--gold);font-size:1rem;letter-spacing:.04em}
.fig-s{font-size:.68rem;color:var(--gray);font-style:italic;display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-top:.1rem}
.fig-code{font-family:'Cinzel',serif;letter-spacing:.12em;color:var(--gold)}
.fig-b{padding:.6rem .8rem}

.dv-row{display:flex;gap:.35rem;margin-bottom:.6rem}
.dv{flex:1;border:1px solid var(--border);border-radius:5px;text-align:center;padding:.25rem .2rem}
.dv-l{font-family:'Cinzel',serif;font-size:.46rem;letter-spacing:.09em;color:var(--gray);text-transform:uppercase}
.dv-v{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;color:var(--gold)}

.sl{font-family:'Cinzel',serif;font-size:.53rem;letter-spacing:.12em;color:var(--gray);text-transform:uppercase;margin:.6rem 0 .2rem;border-bottom:1px solid rgba(201,168,76,.14);padding-bottom:.1rem}
.werte{display:flex;flex-wrap:wrap;gap:.25rem}
.w{display:flex;align-items:baseline;gap:.3rem;border:1px solid var(--border);border-radius:5px;padding:.12rem .45rem;font-size:.74rem;background:rgba(255,255,255,.03)}
.w b{font-family:'Cinzel',serif;font-weight:700;font-size:.76rem}
.w.d1 b{color:#b7b0a4}.w.d2 b{color:#e8f5f4}.w.d3 b{color:var(--teal)}.w.d4 b{color:var(--gold)}.w.d5 b{color:#e0c060}
.tags{display:flex;flex-wrap:wrap;gap:.2rem}
.tag{font-size:.66rem;border:1px solid var(--border);border-radius:10px;padding:.05rem .45rem;cursor:help}
.tag.pos{border-color:rgba(42,157,143,.55);color:#8fe0d6}
.tag.neg{border-color:rgba(202,103,2,.55);color:#e0a86a}
.zst{font-size:.66rem;border-radius:10px;padding:.05rem .45rem;border:1px solid}
.zst.ang{border-color:rgba(202,103,2,.7);color:#e0a86a}
.zst.wnd{border-color:rgba(139,38,38,.9);color:#e08080}
.zst.aus{border-color:#e05555;color:#fff;background:rgba(139,38,38,.7)}
.brief b{display:block;font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-top:.45rem}
.brief span{font-size:.75rem;color:#cfc8ba;line-height:1.55}
.brief .fehlt{color:var(--gray);font-style:italic}
.alt{font-size:.62rem;color:var(--gray);font-style:italic;margin-top:.5rem;text-align:right}

/* ---- Anfordern ---- */
.w.kl{cursor:pointer;transition:border-color .15s}
.w.kl:hover{border-color:var(--gold)}
.w.kl.gewaehlt{border-color:var(--gold);background:var(--lgold)}
.ersch{display:flex;gap:.2rem;align-items:center}
.ersch .e{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.06em;border:1px solid var(--border);
  background:transparent;color:var(--gray);border-radius:4px;padding:.2rem .45rem;cursor:pointer;line-height:1.3}
.ersch .e b{display:block;font-size:.52rem;color:var(--gray);font-weight:400}
.ersch .e.on{border-color:var(--gold);background:var(--lgold);color:var(--gold)}
.ersch .e.on b{color:var(--gold)}
.anf{margin-top:.5rem;border:1px solid rgba(201,168,76,.45);background:var(--lgold);border-radius:5px;
  padding:.45rem .6rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.anf .t{font-size:.74rem;flex:1;min-width:8rem}
.anf .t b{font-family:'Cinzel',serif;color:var(--gold)}
.wartet{margin-top:.5rem;border:1px dashed rgba(42,157,143,.6);border-radius:5px;padding:.35rem .6rem;
  font-size:.72rem;color:#8fe0d6;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.wartet .t{flex:1;min-width:8rem}
.wartet button{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.06em;background:transparent;
  border:1px solid rgba(255,255,255,.2);color:var(--gray);border-radius:4px;padding:.16rem .5rem;cursor:pointer}
.wartet button:hover{border-color:var(--gold);color:var(--ink)}

/* ---- Protokoll ---- */
/* ---- Ausruestung uebergeben ---- */
.geb{margin-top:.5rem;border:1px solid var(--border);border-radius:5px;padding:.45rem .55rem}
.geb-h{font-family:'Cinzel',serif;font-size:.53rem;letter-spacing:.12em;color:var(--gray);
  text-transform:uppercase;margin-bottom:.35rem}
.geb-r{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
.geb select{flex:1;min-width:8rem;font-family:'Libre Baskerville',Georgia,serif;font-size:.72rem;
  background:#0d1b21;color:var(--ink);border:1px solid var(--border);border-radius:4px;padding:.22rem .3rem}
.geb input{width:4.5rem;font-family:'Libre Baskerville',Georgia,serif;font-size:.72rem;
  background:#0d1b21;color:var(--ink);border:1px solid var(--border);border-radius:4px;padding:.22rem .35rem}
.geb .mini{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.06em;background:transparent;
  border:1px solid var(--border);color:var(--gray);border-radius:4px;padding:.24rem .6rem;cursor:pointer}
.geb .mini:hover{border-color:var(--gold);color:var(--ink)}
.geb .warte{font-size:.64rem;color:#8fe0d6;margin-top:.35rem}
.geb .hinw{font-size:.62rem;color:var(--gray);font-style:italic;margin-top:.3rem;line-height:1.5}
.tag.weg{cursor:pointer}
.tag.weg:hover{border-color:#e05555;color:#e08080}

.pszene{margin-bottom:1.1rem}
.pszene>h3{font-family:'Cinzel',serif;color:var(--gold);font-size:.84rem;letter-spacing:.08em;
  border-bottom:1px solid var(--border);padding-bottom:.25rem;margin-bottom:.45rem}
.port{margin:0 0 .7rem .2rem}
.port>h4{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.12em;color:var(--gray);
  text-transform:uppercase;margin-bottom:.25rem}
.pz{display:flex;gap:.5rem;align-items:baseline;padding:.2rem 0;border-bottom:1px solid rgba(255,255,255,.05);
  flex-wrap:wrap}
.pz .l{flex:1;min-width:10rem;font-size:.78rem}
.pz .l b{font-family:'Cinzel',serif;font-size:.78rem}
.pz .r{font-size:.72rem;font-family:'Cinzel',serif;letter-spacing:.04em}
.pz .r.b-steigerung{color:#8fe0d6}.pz .r.b-erfolg{color:var(--teal)}
.pz .r.b-miss{color:var(--gray)}.pz .r.b-patzer{color:#e08080}
.pz .k{background:transparent;border:1px solid var(--border);color:var(--gray);border-radius:4px;
  font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.06em;padding:.12rem .45rem;cursor:pointer}
.pz .k:hover{border-color:var(--gold);color:var(--ink)}
.pz .k.hat{border-color:rgba(42,157,143,.6);color:#8fe0d6}
.pnotiz{padding:.1rem 0 .35rem 1rem;font-size:.78rem;color:#8fe0d6;font-style:italic;line-height:1.55}
.pedit{padding:.25rem 0 .45rem 1rem;display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.pedit input{flex:1;min-width:11rem;font-family:'Libre Baskerville',Georgia,serif;font-size:.78rem;
  background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--border);border-radius:4px;padding:.3rem .5rem}
.pedit input:focus{outline:none;border-color:var(--gold)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">⚓ FIGUREN AM TISCH</div>
  <!-- Welche Sitzung? Ohne das sieht die Spielleitung die Figuren einer
       ruhenden Runde und merkt es nicht. -->
  <span class="badge" id="sitzungBadge" title="Sitzung dieser Ansicht">—</span>
  <span class="badge" id="anzahl">—</span>
  <div class="ersch" id="erschLeiste"></div>
  <span style="flex:1"></span>
  <button class="btn on" id="btnFiguren" onclick="setzeAnsicht('figuren')">Figuren</button>
  <button class="btn" id="btnProtokoll" onclick="setzeAnsicht('protokoll')">Würfe</button>
  <button class="btn" id="btnWaren" onclick="setzeAnsicht('waren')"
    title="Alle Gegenstände durchsuchen">Gegenstände</button>
  <button class="btn" id="btnKampf" onclick="setzeAnsicht('kampf')"
    title="Gegner führen, Angriffe ansagen — sieht nur die Spielleitung">Kampf</button>
  <button class="btn" id="btnWerkstatt" onclick="toggleWerkstatt()"
    title="Einen Gegenstand erfinden, den es im Regelwerk nicht gibt">+ Gegenstand</button>
  <button class="btn on" id="btnBrief" onclick="toggleBrief()">Steckbrief</button>
  <button class="btn" id="btnAlle" onclick="toggleAlle()">alle Fertigkeiten</button>
</div>

<div class="wrap">
  <div class="fbnote" id="fbNote"></div>
  <div id="werkstatt"></div>
  <div id="inhalt"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sitzung.js"></script>
<script src="js/identitaet.js"></script>
<script src="js/regelwerk.js"></script>
<script src="js/marken.js"></script>
<script src="js/npcs.js"></script>
<script src="js/kampf.js"></script>
<!-- Nur fuer die Klartext-Namen im Protokoll: ein Wurf traegt "4.1" und
     "schiffswrack", vorlesbar ist aber erst "Schatzinsel - Die gestrandete
     Golden Lion". -->
<script src="js/scenes.js"></script>
<script src="js/golden_lion_scenes.js"></script>
<script src="js/schatzinsel_scenes.js"></script>
<script src="js/spanischer_hafen_scenes.js"></script>
<script src="js/schmugglernest_scenes.js"></script>
<script src="js/artefakthandel_scenes.js"></script>
<script src="js/riffinsel_scenes.js"></script>
<script src="js/grabesinsel_scenes.js"></script>
<script src="js/abspann_scenes.js"></script>
<script src="js/arena_scenes.js"></script>
<script>
/* ==========================================================
   FIGUREN AM TISCH — Uebersicht fuer die Spielleitung
   ----------------------------------------------------------
   Zeigt alle Figuren, die Spieler ueber charaktererstellung.html
   angelegt haben (Firebase-Pfad "figuren"). Loest das Problem,
   das seit August dokumentiert ist: die Boegen lagen nur im
   localStorage des jeweiligen Spielers, die SL musste jeden
   Wert von Hand abtippen (siehe Arena, CLAUDE.md 2026-08-23).

   NICHT VERLINKT, wie die uebrigen Seiten der Spielleitung -
   der Schutz besteht allein darin, dass die Adresse nicht
   bekannt ist. Diese Seite zeigt Geheimnisse der Figuren; sie
   gehoert nicht in die Haende der Spieler.

   Die Werte sind nur lesend. Geaendert wird eine Figur
   ausschliesslich von ihrem Spieler im Assistenten - sonst gaebe
   es zwei Quellen fuer denselben Wert.
   SEIT 10/2026 schreibt die Seite trotzdem an zwei Stellen, und
   beide fassen die Figur selbst nicht an:
     figuren/{schluessel}/anfrage          - eine Bitte zu wuerfeln
     sitzungen/{sid}/protokoll/{id}/notiz  - der Kommentar der SL
   Eine Anforderung ist eine Nachricht an den Spieler, keine
   Aenderung an seiner Figur; gewuerfelt wird weiterhin bei ihm.
   ========================================================== */

let figuren = {};
let zeigeBrief = true, zeigeAlle = false;
/* Name und Bild der Spielerfiguren fuer die linke Leiste auf der Karte.
   Liegt neben der Figur (pcLeiste), nicht darin - siehe heldenbrief.html.
   Von hier wird AUSSCHLIESSLICH das Feld "aus" geschrieben: Der Bogen
   des Spielers bleibt der einzige Schreiber auf seinen Werten. */
let pcLeiste = {};

let db = null;
let ansicht = 'figuren';   // 'figuren' | 'protokoll'
let erschwernis = 0;       // gilt fuer die naechste Anforderung
let menu = null;           // {pid, wert} - offenes Anforderungs-Menue
let protokoll = {};        // Firebase-Schluessel -> Wurfzeile
let kommentiert = null;    // Schluessel der Zeile, die gerade kommentiert wird

/* Die vier Stufen, die am Tisch wirklich vorkommen. Savage Worlds
   erschwert ueber flache Modifikatoren, nicht ueber hoehere Zielzahlen -
   "du brauchst eine 8" IST -4, weil das Ziel immer 4 ist. Deshalb steht
   beides am Knopf: der Modifikator, mit dem gerechnet wird, und die Zahl,
   die die Spielleitung vorliest. */
const ERSCHWERNISSE = [
  { mod:  2, n: 'leicht' },
  { mod:  0, n: 'normal' },
  { mod: -2, n: 'schwer' },
  { mod: -4, n: 'sehr schwer' }
];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
  });
}

/* ---------- Klartext-Namen fuer das Protokoll ----------
   Dieselbe Sammlung wie in karte.html, nur fuer Namen: Szenen-Label und
   Marker-Titel. Einmal beim Laden aufgebaut, danach ein reiner Lookup. */
const SZENEN_LABEL = {};
const ORT_TITEL = {};
(function sammleNamen() {
  const quellen = [
    typeof SCENES !== 'undefined' ? SCENES : null,
    typeof GOLDEN_LION_SCENES !== 'undefined' ? GOLDEN_LION_SCENES : null,
    typeof SCHATZINSEL_SCENES !== 'undefined' ? SCHATZINSEL_SCENES : null,
    typeof SPANISCHER_HAFEN_SCENES !== 'undefined' ? SPANISCHER_HAFEN_SCENES : null,
    typeof SCHMUGGLERNEST_SCENES !== 'undefined' ? SCHMUGGLERNEST_SCENES : null,
    typeof ARTEFAKTHANDEL_SCENES !== 'undefined' ? ARTEFAKTHANDEL_SCENES : null,
    typeof RIFFINSEL_SCENES !== 'undefined' ? RIFFINSEL_SCENES : null,
    typeof GRABESINSEL_SCENES !== 'undefined' ? GRABESINSEL_SCENES : null,
    typeof ABSPANN_SCENES !== 'undefined' ? ABSPANN_SCENES : null,
    typeof ARENA_SCENES !== 'undefined' ? ARENA_SCENES : null
  ];
  const basen = [typeof GOLDEN_LION_MARKERS_BASE !== 'undefined' ? GOLDEN_LION_MARKERS_BASE : null];
  basen.forEach(function (b) {
    if (!b) return;
    Object.keys(b).forEach(function (id) { if (b[id] && b[id].title) ORT_TITEL[id] = b[id].title; });
  });
  quellen.forEach(function (q) {
    if (!q) return;
    Object.keys(q).forEach(function (sid) {
      const sz = q[sid] || {};
      if (sz.label) SZENEN_LABEL[sid] = sz.label;
      (sz.markers || []).forEach(function (m) {
        if (m && m.id && m.title) ORT_TITEL[m.id] = m.title;
      });
    });
  });
})();

function szenenLabel(id) {
  if (!id) return 'Ohne Szene';
  return SZENEN_LABEL[id] ? SZENEN_LABEL[id] + ' (' + id + ')' : id;
}
function ortTitel(id) {
  if (!id) return 'Nicht an einem Ort';
  return ORT_TITEL[id] || id;
}

function initFirebase() {
  try {
    firebase.initializeApp(firebaseConfig);
    db = sitzungsDbJetzt(firebase.database());
    sitzungBadge(db, 'sitzungBadge');
    if (db.sitzung) {
      /* Das Protokoll liegt NICHT unter dem Spielstand, sondern direkt an der
         Sitzung - es ist das Gedaechtnis des Abends und soll einen
         Szenenwechsel oder ein Zuruecksetzen des Spielstands ueberleben. */
      db.ref('sitzungen/' + db.sitzung + '/protokoll').on('value', function (s) {
        protokoll = s.val() || {};
        /* Auch der Kampf haengt daran: Der Wurf des Spielers kommt ueber
           das Protokoll zurueck, dort steht er mit Figur, Wert und Band.
           Erst festhalten und ins Log schreiben, dann zeichnen. */
        kampfPruefeWuerfe();
        if (ansicht === 'protokoll' || ansicht === 'kampf') render();
      }, function () { protokoll = {}; });
    }
    /* Die erfundenen Waren ZUERST: Eine Figur traegt nur IDs, und ein
       Gegenstand ohne Beschreibung verschwindet in der Anzeige
       stillschweigend. Also erst eintragen, dann zeichnen. */
    /* Der Kampfstand. Er liegt in der Datenbank und nicht nur hier, damit
       ein versehentliches Neuladen mitten im Gefecht nicht das Gefecht ist. */
    db.ref('kampf').on('value', function (s) {
      kampf = s.val() || {};
      /* Auch hier: Ein Wurf kann VOR der Ansage angekommen sein, wenn die
         Spielleitung langsamer klickt als der Spieler wuerfelt. */
      kampfPruefeWuerfe();
      if (ansicht === 'kampf') render();
    }, function () { kampf = {}; });

    db.ref('eigeneWaren').on('value', function (s) {
      eigeneWarenSetzen(s.val() || {});
      zeichneWerkstatt();
      render();
    });

    db.ref('pcLeiste').on('value', function (s) {
      pcLeiste = s.val() || {};
      render();
    }, function () { pcLeiste = {}; });

    db.ref('figuren').on('value', function (s) {
      figuren = s.val() || {};
      render();
    }, function (err) {
      warnung('Die Datenbank verweigert den Zugriff auf „figuren". Wahrscheinlich fehlt der Pfad ' +
        'in den Firebase-Regeln — siehe firebase-rules.json, dort ergänzt, aber in der Konsole noch ' +
        'zu veröffentlichen. (' + (err && err.code ? err.code : 'Fehler') + ')');
    });
  } catch (e) {
    warnung('Keine Verbindung zur Datenbank: ' + e.message);
  }
}
function warnung(t) {
  const n = document.getElementById('fbNote');
  n.className = 'fbnote warn';
  n.textContent = '⚠ ' + t;
}

/* alsFigur() stand hier frueher als eigene Kopie. Sie ist nach
   js/regelwerk.js gewandert, weil der Heldenbrief dieselbe
   Normalisierung braucht - zwei Kopien waeren zwei Wahrheiten. */

/* Jeder Wert ist anklickbar - ein Klick fordert ihn an. Die Seite war
   bisher bewusst rein lesend, und das bleibt sie fuer die FIGUR: Eine
   Anforderung aendert keinen einzigen Wert, sie legt eine Bitte daneben.
   Gewuerfelt wird weiterhin ausschliesslich beim Spieler. */
function wertChip(name, stufe, pid) {
  const offen = menu && menu.pid === pid && menu.wert === name;
  return '<span class="w kl d' + stufe + (offen ? ' gewaehlt' : '') +
    '" data-pid="' + esc(pid) + '" data-wert="' + esc(name) +
    '" title="anfordern">' + esc(name) + ' <b>' + DLBL[stufe] + '</b></span>';
}

function zeichneErschwernis() {
  document.getElementById('erschLeiste').innerHTML =
    ERSCHWERNISSE.map(function (e) {
      return '<button class="e' + (e.mod === erschwernis ? ' on' : '') +
        '" data-ersch="' + e.mod + '">' + (e.mod > 0 ? '+' : '') + e.mod +
        '<b>nötig ' + (ZIELZAHL - e.mod) + '</b></button>';
    }).join('');
}

/* ---------- Anfordern ----------
   Geschrieben wird nach figuren/{schluessel}/anfrage. Die Wuerfelleiste des
   Spielers horcht dort und zeigt den Wert gross an; sie raeumt die Bitte
   selbst weg, sobald gewuerfelt wurde. */
function anfordern(pids, wertName) {
  if (!db) return;
  const paket = {};
  pids.forEach(function (pid) {
    paket['figuren/' + pid + '/anfrage'] =
      { wert: wertName, mod: erschwernis, von: 'Spielleitung', ts: Date.now() };
  });
  menu = null;
  db.ref().update(paket).catch(function (e) {
    warnung('Die Anforderung ging nicht durch: ' + (e && e.message ? e.message : 'unbekannt'));
  });
  render();
}

function anfrageWeg(pid) {
  if (!db) return;
  menu = null;
  db.ref('figuren/' + pid + '/anfrage').remove().catch(function () {});
  render();
}

/* Wer kann diesen Wert ueberhaupt? Eine Gruppenprobe geht an jede Figur,
   auch an die ungelernte - genau das ist der Sinn: Alle versuchen es, und
   wer es nicht kann, wuerfelt d4-2. Ausser Gefecht wird uebersprungen. */
function gruppe() {
  return Object.keys(figuren).filter(function (pid) {
    const f = alsFigur(figuren[pid] || {});
    return !ausserGefecht(f);
  });
}

function anfrageBlock(pid, roh) {
  const a = roh.anfrage;
  if (!a) return '';
  return '<div class="wartet"><span class="t">Wartet auf <b>' + esc(a.wert) + '</b> — nötig ' +
    (ZIELZAHL - (a.mod || 0)) + (a.mod ? ' (' + (a.mod > 0 ? '+' : '') + a.mod + ')' : '') +
    '</span><button data-weg="' + esc(pid) + '">zurücknehmen</button></div>';
}

/* ---------- Ausrüstung übergeben ----------
   Geschrieben wird NICHT in die Figur, sondern in ihr Postfach
   figuren/{pid}/zuteilung. Der Bogen des Spielers liest seine Figur genau
   einmal und schreibt danach seine eigene Fassung hoch - samt ausr und
   muenzen. Ein direkter Zugriff von hier waere beim naechsten Klick des
   Spielers lautlos weg. So bleibt es bei genau EINEM Schreiber auf der
   Figur; der Bogen nimmt die Uebergabe an und raeumt das Postfach selbst.
   Dasselbe Muster wie bei der Wuerfel-Anfrage. */
function uebergeben(pid, eintrag) {
  if (!db) return;
  db.ref('figuren/' + pid + '/zuteilung').push(
    Object.assign({ von: 'Spielleitung', ts: Date.now() }, eintrag)
  ).catch(function (e) {
    warnung('Die Übergabe ging nicht durch: ' + (e && e.message ? e.message : 'unbekannt'));
  });
}

/* ==========================================================
   WERKSTATT - EIGENE GEGENSTAENDE
   ----------------------------------------------------------
   Nicht alles, was eine Figur traegt, steht im Regelwerk: der
   Jaguar-Saebel, ein Brief, die Kiste aus der Grotte. Bis jetzt
   konnte die Spielleitung nur vergeben, was js/regelwerk.js
   kennt - alles andere musste der Spieler sich selbst eintippen.

   Ein erfundener Gegenstand liegt JE SITZUNG in der Datenbank
   (eigeneWaren) und wird von allen Seiten beim Laden ins
   Regelwerk nachgetragen. Damit ist er ganz normale Ware:
   Traglast, Robustheit und Verkauf rechnen ohne Sonderweg mit
   ihm.

   WICHTIG: Angelegt wird die BESCHREIBUNG - vergeben wird
   danach wie bisher ueber das Postfach. Das sind zwei Schritte,
   und das ist Absicht: Derselbe Gegenstand kann mehreren Figuren
   gegeben werden, und die Beschreibung gehoert der Sitzung,
   nicht einer Figur. */
let werkstattAuf = false;

function toggleWerkstatt() {
  werkstattAuf = !werkstattAuf;
  document.getElementById('btnWerkstatt').classList.toggle('on', werkstattAuf);
  zeichneWerkstatt();
}

function eigeneListe() {
  return AUSRUESTUNG.filter(function (a) { return a.vonSl; })
                    .sort(function (a, b) { return a.n.localeCompare(b.n, 'de'); });
}

function zeichneWerkstatt() {
  const el = document.getElementById('werkstatt');
  if (!el) return;
  if (!werkstattAuf) { el.innerHTML = ''; return; }

  const arten = AUSR_ARTEN.map(function (a) {
    return '<option value="' + esc(a) + '">' + esc(a) + '</option>';
  }).join('');
  /* Schaden ist eine Wuerfelstufe, kein Bonus - in diesem System wird
     nichts addiert (Bibel 4.1). "keiner" ist der Normalfall. */
  const stufen = '<option value="0">keiner</option>' +
    [1, 2, 3, 4, 5].map(function (i) {
      return '<option value="' + i + '">' + DLBL[i] + '</option>';
    }).join('');

  const liste = eigeneListe();
  el.innerHTML = '<div class="wst"><h3>Gegenstand erfinden</h3>' +
    '<div class="wh">Was es im Regelwerk nicht gibt. Er gilt in dieser Sitzung und lässt ' +
    'sich danach jeder Figur übergeben — unten bei „Übergeben“, ganz oben in der Liste.</div>' +
    '<div class="wst-f">' +
      '<label>Name<input id="wstName" class="lang" maxlength="60" placeholder="Jaguar-Säbel"></label>' +
      '<label>Art<select id="wstArt">' + arten + '</select></label>' +
      '<label>Schaden<select id="wstSchaden">' + stufen + '</select></label>' +
      '<label>Robustheit<input id="wstRuest" type="number" min="0" max="6" value="0" style="width:4rem"></label>' +
      '<label>Gewicht<input id="wstGew" type="number" min="0" max="99" value="1" style="width:4rem"></label>' +
      '<label>Wert (M.)<input id="wstPreis" type="number" min="0" step="10" value="0" style="width:5.5rem"></label>' +
    '</div>' +
    '<div class="wst-f" style="margin-top:.4rem">' +
      '<label style="flex:1">Beschreibung<input id="wstText" class="lang" style="width:100%" ' +
      'maxlength="400" placeholder="Ein Jaguar ist in die Klinge geschnitten."></label>' +
      '<button class="mini" onclick="wareAnlegen()" style="align-self:flex-end">anlegen</button>' +
    '</div>' +
    '<div class="wst-meld" id="wstMeld"></div>' +
    (liste.length
      ? '<div class="wst-liste">' + liste.map(function (a) {
          return '<span class="wst-w"><b>' + esc(a.n) + '</b>' +
            '<span style="color:var(--gray)">' + esc(a.art) +
            (a.schaden ? ' · ' + DLBL[a.schaden] : '') +
            (a.ruest ? ' · Rob. +' + a.ruest : '') + '</span>' +
            '<span class="x" data-wareweg="' + esc(a.id) + '" ' +
            'title="Beschreibung löschen">×</span></span>';
        }).join('') + '</div>'
      : '<div class="wh" style="margin:.6rem 0 0">Noch nichts erfunden.</div>') +
    '</div>';
}

function wstMeld(text, gut) {
  const m = document.getElementById('wstMeld');
  if (m) { m.textContent = text; m.style.color = gut ? '#4caf7d' : 'var(--amber)'; }
}

function wareAnlegen() {
  if (!db) { wstMeld('Keine Verbindung — ohne Datenbank gibt es den Gegenstand nirgends.', false); return; }
  const v = function (id) { const e = document.getElementById(id); return e ? e.value : ''; };
  const name = String(v('wstName')).trim();
  if (!name) { wstMeld('Ohne Namen geht es nicht.', false); return; }
  const roh = {
    id: eigeneWareId(name), n: name, d: v('wstText'), art: v('wstArt'),
    schaden: Number(v('wstSchaden')) || 0,
    ruest: Number(v('wstRuest')) || 0,
    gew: Number(v('wstGew')) || 0,
    preis: Number(v('wstPreis')) || 0
  };
  /* Erst pruefen, dann schreiben: Ein halber Gegenstand in der Datenbank
     waere schlimmer als gar keiner - er taucht ueberall auf und wiegt. */
  const w = eigeneWarePruefen(roh);
  if (!w) { wstMeld('Das ergibt keinen brauchbaren Gegenstand.', false); return; }
  db.ref('eigeneWaren/' + w.id).set(w).then(function () {
    wstMeld('„' + w.n + '" angelegt — jetzt unten bei einer Figur übergeben.', true);
    const n = document.getElementById('wstName'); if (n) n.value = '';
    const t = document.getElementById('wstText'); if (t) t.value = '';
  }).catch(function (e) {
    wstMeld('Ging nicht: ' + (e && e.message ? e.message : 'unbekannt'), false);
  });
}

/* Die Beschreibung loeschen nimmt niemandem etwas aus der Hand: Die Figur
   traegt die ID weiter. Sie zeigt den Gegenstand dann nicht mehr an - das
   ist der Preis dafuer, dass Waren nicht in jeder Figur doppelt liegen.
   Deshalb wird gefragt und gesagt, wer ihn traegt. */
function wareWeg(id) {
  if (!db) return;
  const a = AUSR_BY_ID[id];
  const traeger = Object.keys(figuren).filter(function (pid) {
    return ((figuren[pid] && figuren[pid].ausr) || []).indexOf(id) >= 0;
  }).length;
  if (!confirm('„' + ((a && a.n) || id) + '" löschen?' +
      (traeger ? '\n\nAchtung: ' + traeger + ' Figur(en) tragen ihn. Bei ihnen verschwindet er ' +
                 'aus der Anzeige.' : ''))) return;
  db.ref('eigeneWaren/' + id).remove();
}

/* Der Vertrag aus js/marken.js an genau einer Stelle: class="tag" plus
   die fuenf data-tip*-Felder. Drei Aufrufer - Talent, Schwaeche, Gegenstand. */
/* ==========================================================
   WARENLISTE - ALLES, WAS ES GIBT
   ----------------------------------------------------------
   Hendriks Vorgabe vom 15.10.2026: eine Liste aller Gegenstaende
   mit Textsuche. "Vollumfaenglich, Buchstabenfolge muss im Wort
   vorkommen" - also KEINE Wortanfangs-Suche: "ulver" findet das
   Pulverhorn, "aebel" den Saebel.

   Gesucht wird ueber alles, was an einer Ware steht: Name,
   Beschreibung, Art und die Kennung. Letztere, weil die
   erfundenen Waren der Spielleitung ihr Praefix "sl_" tragen -
   damit findet "sl_" sie alle auf einmal.
   ========================================================== */
let warenText = '';
let warenZiel = '';     // an wen vergeben werden soll

/* Kleinschreibung UND Umlaute vereinheitlichen: Wer "saebel" tippt, meint
   den Saebel. Ohne das findet eine deutsche Suche die halbe Liste nicht. */
function suchForm(x) {
  return String(x == null ? '' : x).toLowerCase()
    .replace(/[äÄ]/g, 'ae').replace(/[öÖ]/g, 'oe').replace(/[üÜ]/g, 'ue')
    .replace(/ß/g, 'ss');
}

function warenTreffer(a, text) {
  if (!text) return true;
  const heu = suchForm([a.n, a.d, a.art, a.id].join(' '));
  return heu.indexOf(suchForm(text)) >= 0;
}

/* Die gefundene Stelle wird markiert - sonst sucht man im Treffer noch
   einmal mit den Augen. Markiert wird auf der NORMALISIERTEN Fassung,
   ausgegeben aber das Original: gleiche Laenge, also passen die Stellen. */
function hervor(roh, text) {
  const t = suchForm(text);
  if (!t) return esc(roh);
  const h = suchForm(roh);
  let aus = '', i = 0;
  while (true) {
    const k = h.indexOf(t, i);
    if (k < 0) break;
    aus += esc(roh.slice(i, k)) + '<mark>' + esc(roh.slice(k, k + t.length)) + '</mark>';
    i = k + t.length;
  }
  return aus + esc(roh.slice(i));
}

/* warnung() faerbt rot und ist fuer Fehler da. Eine gelungene Uebergabe
   ist keine Warnung - sie braucht trotzdem eine Rueckmeldung, sonst klickt
   man und nichts geschieht sichtbar. */
function gutMeldung(t) {
  const n = document.getElementById('fbNote');
  if (!n) return;
  n.className = 'fbnote';
  n.textContent = '✓ ' + t;
  clearTimeout(gutMeldung._t);
  gutMeldung._t = setTimeout(function () {
    if (n.textContent.indexOf('✓') === 0) { n.textContent = ''; }
  }, 6000);
}

function warenSuchen(v) {
  warenText = String(v || '');
  warenListeZeichnen();
}
function warenZielSetzen(v) { warenZiel = String(v || ''); warenListeZeichnen(); }

function warenWerte(a) {
  const w = [];
  if (a.schaden) w.push('Schaden <b>' + DLBL[a.schaden] + '</b>');
  if (a.reichweite) w.push('Reichw. <b>' + a.reichweite + '</b>');
  if (a.schuss) w.push('<b>' + a.schuss + '</b> Schuss');
  if (a.ruest) w.push('Rob. <b>+' + a.ruest + '</b>');
  if (a.ladungen) w.push('<b>' + a.ladungen + '</b> Ladungen');
  w.push('<b>' + (a.gew || 0) + '</b> Gew.');
  w.push('<b>' + (a.preis || 0) + '</b> M.');
  return w.join(' · ');
}

function warenListeZeichnen() {
  const el = document.getElementById('warenListe');
  if (!el) return;
  const treffer = AUSRUESTUNG.filter(function (a) { return warenTreffer(a, warenText); });

  const z = document.getElementById('warenZahl');
  if (z) {
    z.textContent = warenText
      ? treffer.length + ' von ' + AUSRUESTUNG.length + ' gefunden'
      : AUSRUESTUNG.length + ' Gegenstände';
  }

  if (!treffer.length) {
    el.innerHTML = '<div class="wleer">Nichts gefunden. Gesucht wird in Name, ' +
      'Beschreibung und Art — die Buchstabenfolge darf überall im Wort stehen.</div>';
    return;
  }

  /* Nach Art gruppiert: 53 Gegenstaende am Stueck liest niemand. Leere
     Faecher fallen bei einer Suche weg. */
  el.innerHTML = AUSR_ARTEN.map(function (art) {
    const drin = treffer.filter(function (a) { return a.art === art; });
    if (!drin.length) return '';
    return '<div class="wart"><h3>' + esc(art) + ' <span style="color:var(--gray)">(' +
      drin.length + ')</span></h3>' +
      drin.map(function (a) {
        return '<div class="wz"><div class="wn">' + hervor(a.n, warenText) +
          (a.vonSl ? ' <span class="sl-ware">erfunden</span>' : '') +
          (a.d ? '<small>' + hervor(a.d, warenText) + '</small>' : '') + '</div>' +
          '<div class="wv">' + warenWerte(a) + '</div>' +
          (warenZiel
            ? '<button class="mini" data-wgeben="' + esc(a.id) + '">geben</button>'
            : '') +
          '</div>';
      }).join('') + '</div>';
  }).join('');
}

function renderWaren() {
  document.getElementById('anzahl').textContent = AUSRUESTUNG.length + ' Gegenstände';
  const figOpt = Object.keys(figuren).map(function (pid) {
    const n = (figuren[pid] && figuren[pid].name) || pid;
    return '<option value="' + esc(pid) + '"' + (pid === warenZiel ? ' selected' : '') +
      '>' + esc(n) + '</option>';
  }).join('');
  /* Der Kopf wird EINMAL gezeichnet, die Liste danach fuer sich. Sonst
     verlaere das Suchfeld bei jedem Tastendruck den Fokus. */
  document.getElementById('inhalt').innerHTML =
    '<div class="wk">' +
      '<label>Suchen<input id="warenFeld" type="search" placeholder="Buchstabenfolge, z. B. „ulver“" ' +
        'value="' + esc(warenText) + '" oninput="warenSuchen(this.value)"></label>' +
      '<label>Übergeben an<select onchange="warenZielSetzen(this.value)">' +
        '<option value="">— niemanden —</option>' + figOpt + '</select></label>' +
      '<span class="zahl" id="warenZahl"></span>' +
    '</div><div id="warenListe"></div>';
  warenListeZeichnen();
  const feld = document.getElementById('warenFeld');
  if (feld && warenText) { feld.focus(); feld.selectionStart = feld.selectionEnd = warenText.length; }
}

/* ==========================================================
   KAMPFMODUS - sieht nur die Spielleitung
   ----------------------------------------------------------
   Hendriks Vorgabe vom 15.10.2026: Gegner anlegen, "Spieler A
   greift Gegner 3 an" sagen, der Spieler wird zum Wuerfeln
   gefordert. Das Interface bleibt hier; die Spieler bekommen
   NICHTS Neues zu sehen - nur die Bitte in ihrer Wuerfelleiste,
   die es seit dem 14.10. gibt.

   NICHT die Arena: kein Brett, keine Bewegung, keine Felder.
   Die bleibt das Werkzeug fuer den Endkampf und rechnet weiter
   nach W100 (Bibel 4.7).

   DREI REGELN, die den Zuschnitt bestimmen:

   1. Das Werkzeug RECHNET, die Spielleitung ENTSCHEIDET. Keine
      Wirkung wird von selbst eingetragen - sie wird vorgeschlagen
      und mit einem Klick bestaetigt. Dieselbe Linie wie in
      ARENA-ENDKAMPF.md.
   2. Gegner gehoeren uns, Spieler nicht. Der Zustand der Gegner
      liegt unter sitzungen/{sid}/stand/kampf. Eine Wunde beim
      SPIELER geht ueber das Postfach (figuren/{pid}/zuteilung) -
      sein Bogen ist der einzige Schreiber auf seiner Figur.
   3. Der Kampfstand liegt in der Datenbank, nicht nur in diesem
      Browser: Ein versehentliches Neuladen mitten im Gefecht
      waere sonst das Gefecht. Verborgen ist er damit nicht -
      dasselbe Schutzniveau wie beim Protokoll.
   ========================================================== */
let kampf = {};            // Spiegel von sitzungen/{sid}/stand/kampf
let kampfAngreifer = '';
let kampfZiel = '';
let kampfSchaden = '';
let kampfGewaehlt = '';    // angeklickter Angreifer, fuer den Fernkampf
let kampfZieht = '';       // was gerade gezogen wird

function kampfRef(teil) {
  return db.ref('kampf' + (teil ? '/' + teil : ''));
}

/* ---------- Teilnehmer ----------
   Spieler kommen aus den Figuren, Gegner aus dem Kampfstand. Beide
   bekommen dieselbe Form, damit Reihenfolge und Angriff nicht zwei
   Faelle unterscheiden muessen. */
function kampfSpieler() {
  return Object.keys(figuren).map(function (pid) {
    const f = alsFigur(figuren[pid] || {});
    return {
      id: 'p:' + pid, pid: pid, typ: 'spieler',
      name: (figuren[pid] || {}).name || pid,
      parade: parade(f), robustheit: robustheit(f),
      angeschlagen: !!f.angeschlagen, wunden: f.wunden || 0,
      raus: ausserGefecht(f), extra: false, figur: f,
      /* Normalerweise steht eine Spielerfigur bei den Spielern - aber nicht
         zwingend: Eine bezauberte, besessene oder uebergelaufene Figur
         gehoert auf die andere Seite, und im Finale ist genau das denkbar.
         Die Abweichung liegt beim KAMPF, nicht an der Figur: Sie ist mit
         dem Gefecht vorbei und fasst den Bogen des Spielers nicht an. */
      seite: ((kampf.seiten || {})[pid] === 'feind') ? 'feind' : 'held',
      band: Math.max(0, Math.min(2, (kampf.baender || {})[pid] || 0))
    };
  });
}

function kampfGegner() {
  const g = kampf.gegner || {};
  return Object.keys(g).map(function (id) {
    const x = g[id] || {};
    return {
      id: 'g:' + id, gid: id, typ: 'gegner', name: x.name || id,
      parade: x.parade || 4, robustheit: x.robustheit || 4,
      angeschlagen: !!x.angeschlagen, wunden: x.wunden || 0,
      raus: !!x.raus, extra: x.extra !== false, vorlage: x.vorlage || '',
      kaempfen: x.kaempfen || 0, schiessen: x.schiessen || 0,
      band: Math.max(0, Math.min(2, x.band || 0)),
      staerke: x.staerke || 1, schaden: x.schaden || 2,
      waffe: x.waffe || '', fernwaffe: x.fernwaffe || '',
      /* Ein angelegter NSC ist zunaechst Feind. Umstellen macht ihn zum
         Verbuendeten - damit braucht es keinen dritten Typ, und Cormac
         kann im Finale mitkaempfen, ohne eine Spielerfigur zu sein. */
      seite: x.seite === 'held' ? 'held' : 'feind'
    };
  });
}

function kampfAlle() { return kampfSpieler().concat(kampfGegner()); }
function kampfFinde(id) {
  return kampfAlle().filter(function (t) { return t.id === id; })[0] || null;
}

/* ---------- Gegner anlegen ----------
   Aus den Blaettern in js/npcs.js - sie tragen seit dem 15.10. echte
   Parade und Robustheit, also muss hier nichts erfunden werden. */
function kampfVorlagen() {
  const aus = [];
  if (typeof NSC !== 'undefined') {
    Object.keys(NSC).forEach(function (id) {
      aus.push({ id: id, name: NSC[id].name, extra: false, quelle: 'Kernfiguren' });
    });
  }
  if (typeof NSC_MANNSCHAFT !== 'undefined') {
    Object.keys(NSC_MANNSCHAFT).forEach(function (id) {
      aus.push({ id: id, name: NSC_MANNSCHAFT[id].name, extra: true, quelle: 'Mannschaft' });
    });
  }
  return aus;
}

function gegnerAnlegen() {
  if (!db) return;
  const sel = document.getElementById('kVorlage');
  const anz = document.getElementById('kAnzahl');
  const id = sel ? sel.value : '';
  const n = Math.max(1, Math.min(12, Math.round(Number(anz && anz.value) || 1)));
  const v = kampfVorlagen().filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  const roh = (typeof NSC !== 'undefined' && NSC[id]) ||
              (typeof NSC_MANNSCHAFT !== 'undefined' && NSC_MANNSCHAFT[id]);
  if (!roh) return;
  const blatt = nscAlsFigur(roh);
  const paket = {};
  for (let i = 0; i < n; i++) {
    const key = 'g' + Date.now().toString(36) + i;
    paket['gegner/' + key] = {
      name: v.name + (n > 1 ? ' ' + (i + 1) : ''),
      vorlage: id,
      parade: parade(blatt),
      robustheit: robustheit(blatt),
      kaempfen: blatt.fert['Kämpfen'] || 0,
      /* Statist oder Wild Card: Das entscheidet, wie viele Wunden er
         traegt. In js/npcs.js steht es NICHT an den Daten - nur die
         Herkunft aus der Mannschaft sagt es. */
      extra: v.extra,
      /* Wo er steht, ist die Entfernung. Neue Gegner stehen im Nahband:
         In dieser Kampagne faengt fast jeder Kampf als Enterkampf an,
         und wer Abstand will, zieht sie zurueck. */
      band: 0,
      schiessen: blatt.fert['Schießen'] || 0,
      /* Die Waffe kommt aus dem Blatt: Seit dem 15.10.2026 tragen die
         bekannten Leute Ausruestung, und damit schlaegt Wat mit seiner
         Enteraxt zu statt mit einem Allerweltswuerfel. */
      staerke: blatt.attr['Stärke'] || 1,
      waffe: (nahWaffeVon(blatt) || {}).id || '',
      schaden: (nahWaffeVon(blatt) || {}).schaden || 2,
      fernwaffe: (fernWaffeVon(blatt) || {}).id || '',
      angeschlagen: false, wunden: 0, raus: false
    };
  }
  kampfRef().update(paket).catch(function (e) { warnung('Gegner anlegen ging nicht: ' + e); });
  kampfLog(n > 1 ? n + ' × ' + v.name + ' treten auf.' : v.name + ' tritt auf.', 'auf');
}

/* Einen Gegner erfinden: Name, Stufe, Waffe. Mehr braucht es nicht -
   und mehr waere auch nicht ehrlicher, denn ein Hafenschlaeger hat kein
   Innenleben, das in Zahlen gehoert. */
function eigenenGegnerAnlegen() {
  if (!db) return;
  const v = function (id) { const e = document.getElementById(id); return e ? e.value : ''; };
  const name = String(v('egName')).trim() || 'Gegner';
  const stufe = gegnerStufe(v('egStufe'));
  const waffe = AUSR_BY_ID[v('egWaffe')] || null;
  const n = Math.max(1, Math.min(12, Math.round(Number(v('egAnzahl')) || 1)));
  const blatt = alsFigur({ attr: stufe.attr, fert: stufe.fert });
  const fern = waffe && waffe.art === 'Fernkampf';
  const paket = {};
  for (let i = 0; i < n; i++) {
    paket['gegner/' + 'e' + Date.now().toString(36) + i] = {
      name: name + (n > 1 ? ' ' + (i + 1) : ''),
      vorlage: stufe.id,
      parade: parade(blatt), robustheit: robustheit(blatt),
      kaempfen: blatt.fert['Kämpfen'] || 0,
      schiessen: blatt.fert['Schießen'] || 0,
      staerke: blatt.attr['Stärke'] || 1,
      waffe: (waffe && !fern) ? waffe.id : '',
      fernwaffe: fern ? waffe.id : '',
      schaden: (waffe && waffe.schaden) || 2,
      extra: stufe.extra, band: 0,
      angeschlagen: false, wunden: 0, raus: false
    };
  }
  kampfRef().update(paket).catch(function (e) { warnung('Ging nicht: ' + e); });
  kampfLog((n > 1 ? n + ' × ' : '') + name + ' tritt auf' +
    (waffe ? ' — ' + waffe.n : '') + ' (' + stufe.n.toLowerCase() + ').', 'auf');
}

/* Ein Bild von der Karte nehmen - und wieder hinstellen. Geschrieben
   wird GENAU EIN Feld per update(): "bild" und "name" gehoeren dem
   Spieler, und ein set() von hier wuerde sie mitloeschen. */
function pcBildUmschalten(pid) {
  const v = pcLeiste[pid] || {};
  if (!v.bild || !db) return;
  db.ref('pcLeiste/' + pid + '/aus').set(!v.aus)
    .catch(function (e) { warnung('Ging nicht: ' + e); });
}

/* Der Block an der Figurenkarte. Ohne hochgeladenes Bild steht dort
   nichts - eine Ueberschrift ohne Inhalt waere Zierde. */
function pcBildBlock(pid) {
  const v = pcLeiste[pid] || {};
  if (!v.bild) return '';
  const aus = !!v.aus;
  return '<div class="sl">Bild auf der Karte</div>' +
    '<div class="pcbild' + (aus ? ' aus' : '') + '">' +
      '<img src="' + esc(v.bild) + '" alt="' + esc(v.name || pid) + '">' +
      '<div class="pcbild-t">' +
        '<div>' + (aus ? 'ausgeblendet' : 'steht am linken Rand') + '</div>' +
        '<button class="mini" data-pcbild="' + esc(pid) + '">' +
          (aus ? 'einblenden' : 'ausblenden') + '</button>' +
      '</div>' +
    '</div>';
}

function gegnerWeg(gid) {
  if (!db) return;
  kampfRef('gegner/' + gid).remove();
}

function gegnerZustand(gid, feld, wert) {
  if (!db) return;
  const g = (kampf.gegner || {})[gid];
  if (!g) return;
  const paket = {};
  if (feld === 'wunden') {
    const max = KAMPF_REGELN.wundenStatist;
    const grenze = (g.extra === false) ? KAMPF_REGELN.wundenWildCard : max;
    const n = Math.max(0, (g.wunden || 0) + wert);
    paket['gegner/' + gid + '/wunden'] = Math.min(grenze + 1, n);
    paket['gegner/' + gid + '/raus'] = n > grenze;
  } else {
    paket['gegner/' + gid + '/' + feld] = wert;
  }
  kampfRef().update(paket);
}

/* ---------- Initiative ----------
   Karten statt Zahlen (Hendriks Wahl): neue Reihenfolge jede Runde,
   und der Joker kommt mit. Das Restdeck wird mitgefuehrt - ein Deck,
   das nie kleiner wird, waere keins. */
function kampfAusteilen() {
  if (!db) return;
  const leute = kampfAlle().filter(function (t) { return !t.raus; })
    .map(function (t) { return { id: t.id, name: t.name }; });
  if (!leute.length) return;
  const erg = austeilen(leute, (kampf.mischen === false && kampf.deck) ? kampf.deck : null);
  kampfRef().update({
    runde: (kampf.runde || 0) + 1,
    reihe: erg.reihe.map(function (t) { return { id: t.id, name: t.name, karte: t.karte }; }),
    deck: erg.mischenNoetig ? null : erg.deck,
    mischen: !erg.mischenNoetig,
    dran: 0,
    ansage: null
  });
  kampfLog('Runde ' + ((kampf.runde || 0) + 1) + ' — Karten ausgeteilt.' +
    (erg.mischenNoetig ? ' Ein Joker ist gefallen, das Deck wird neu gemischt.' : ''), 'runde');
}

function kampfDran(i) {
  if (!db) return;
  kampfRef('dran').set(Math.max(0, i));
}

function kampfBeenden() {
  if (!db) return;
  if (!confirm('Kampf beenden? Gegner und Reihenfolge werden gelöscht.')) return;
  kampfRef().remove();
}

/* ---------- Der Angriff ----------
   Der Zielwert ist die PARADE des Ziels. Unser Probensystem rechnet
   gegen 4, also wird die Differenz zum Modifikator - auch wenn sie
   ungerade ist. Genau das ging mit den Erschwernis-Knoepfen nicht. */
function angriffAnsagen(art, vonId, zielId) {
  if (!db) return;
  const a = kampfFinde(vonId || kampfAngreifer), z = kampfFinde(zielId || kampfZiel);
  if (!a || !z) { warnung('Erst Angreifer und Ziel wählen.'); return; }
  if (a.id === z.id) { warnung('Niemand greift sich selbst an.'); return; }
  if (a.raus || z.raus) { warnung('Wer außer Gefecht liegt, kämpft nicht mehr.'); return; }
  if (a.seite === z.seite) { warnung('Die beiden stehen auf derselben Seite.'); return; }

  /* Die Distanz kommt aus der Aufstellung: Nahkampf nur im ersten Band,
     und der Fernkampf-Abzug ist der des Bandes. Seit auch Spielerfiguren
     in einem Band stehen koennen, zaehlt der ABSTAND zwischen beiden -
     also das weiter entfernte der zwei. Zwei, die beide zurueckstehen,
     sind nicht automatisch nebeneinander, aber das waere Feinmechanik
     ohne Brett. */
  const dist = Math.max(a.band || 0, z.band || 0);
  const fern = (art === 'fern');
  if (!fern && !nahkampfMoeglich(dist)) {
    warnung(z.name + ' steht zu weit weg für einen Nahkampfangriff — erst heranziehen.');
    return;
  }
  const kann = fern ? fernMoeglich(a) : { ok: true, wert: 'Kämpfen' };
  if (!kann.ok) { warnung(kann.grund + '.'); return; }
  const mod = angriffsMod(z.parade, fern ? bandMod(dist) : 0);
  const ansage = {
    wer: a.id, werName: a.name, ziel: z.id, zielName: z.name,
    parade: z.parade, robustheit: z.robustheit, mod: mod,
    wert: kann.wert, art: fern ? 'fern' : 'nah',
    /* "dist" ist das DISTANZBAND (0/1/2), "band" das Ergebnisband des
       Wurfs ('erfolg', 'steigerung'). Die beiden hiessen einen Tag lang
       gleich - danach blieb die Anzeige auf "wartet auf den Wurf" stehen,
       weil ein Distanzband von 0 wie "noch kein Ergebnis" aussah. */
    dist: dist,
    ts: Date.now(), stand: 'wartet'
  };

  if (a.typ === 'spieler') {
    /* Die Bitte geht an den Spieler. Seine Leiste zeigt sie gross an und
       raeumt sie selbst weg, sobald er gewuerfelt hat. */
    const paket = {};
    paket['figuren/' + a.pid + '/anfrage'] =
      { wert: kann.wert, mod: mod, von: 'Spielleitung',
        grund: (fern ? 'Schuss auf ' : 'Angriff auf ') + z.name +
          (fern ? ' · ' + band(dist).n : ''), ts: Date.now() };
    db.ref().update(paket).catch(function (e) { warnung('Die Bitte ging nicht durch: ' + e); });
    kampfRef('ansage').set(ansage);
    kampfLog(a.name + (fern ? ' schießt auf ' : ' greift ') + z.name +
      (fern ? '' : ' an') + ' — ' + kann.wert + ', nötig ' + (ZIELZAHL - mod) +
      (fern ? ' (' + band(dist).n + ')' : '') + '.', 'ansage');
  } else {
    /* Gegner wuerfeln wir selbst - und zwar sofort. Ein NSC wartet auf
       niemanden. */
    const r = wurf(fern ? (a.schiessen || 0) : (a.kaempfen || 0),
      { mod: mod, wild: !a.extra });
    ansage.stand = 'gewuerfelt';
    ansage.band = r.band;
    ansage.roh = r.roh;
    kampfRef('ansage').set(ansage);
    const traf = (r.band === 'erfolg' || r.band === 'steigerung');
    kampfLog(a.name + ' greift ' + z.name + ' an (nötig ' + z.parade + '): ' + r.roh +
      ' — ' + (traf ? (r.band === 'steigerung' ? 'Treffer mit Steigerung' : 'Treffer') : 'daneben') + '.',
      traf ? 'treffer' : 'daneben');
  }
}

/* Einen Wurf im Protokoll finden: der erste passende NACH einem Zeitpunkt.
   Vorher Gewuerfeltes gehoert nicht dazu - sonst beantwortet ein Wurf von
   vorhin die Frage von jetzt. */
function protokollWurf(t, wert, abTs) {
  return Object.keys(protokoll).map(function (k) { return protokoll[k]; })
    .filter(function (z) {
      return z && z.wert === wert && (z.ts || 0) >= abTs &&
        (z.figur === t.name || z.spieler === (figuren[t.pid] || {}).spieler);
    })
    .sort(function (x, y) { return (x.ts || 0) - (y.ts || 0); })[0] || null;
}

/* Sobald ein Wurf des Spielers hereinkommt, wird er FESTGEHALTEN und ins
   Log geschrieben - einmal. Das passiert hier und nicht beim Zeichnen:
   Eine Anzeige, die schreibt, schreibt bei jedem Neuzeichnen wieder.
   Erkannt wird "schon erledigt" am Stand der Ansage, nicht an einer
   Merkliste im Speicher - die waere nach einem Neuladen weg. */
function kampfPruefeWuerfe() {
  const an = kampf.ansage;
  if (!an || !db) return;
  const a = kampfFinde(an.wer);
  if (!a || a.typ !== 'spieler') return;

  if (an.stand === 'wartet') {
    const z = protokollWurf(a, an.wert, an.ts);
    if (!z) return;
    kampfRef('ansage').update({ stand: 'gewuerfelt', band: z.band, roh: z.roh });
    const traf = (z.band === 'erfolg' || z.band === 'steigerung');
    kampfLog(a.name + ' würfelt ' + an.wert + ' gegen ' + an.zielName +
      ' (nötig ' + (ZIELZAHL - an.mod) + '): ' + z.roh + ' — ' +
      (traf ? (z.band === 'steigerung' ? 'Treffer mit Steigerung' : 'Treffer') : 'daneben') + '.',
      traf ? 'treffer' : 'daneben');
    return;
  }
  if (an.stand === 'schaden' && !an.schadenGelogt) {
    const z = protokollWurf(a, 'Schaden', an.schadenTs || an.ts);
    if (!z) return;
    kampfRef('ansage').update({ schadenWert: z.roh, schadenGelogt: true });
    kampfLog(a.name + ' würfelt Schaden: ' + z.roh + '.', 'treffer');
  }
}

/* Der Wurf des Spielers kommt ueber das Protokoll zurueck: Dort steht er
   mit Figur, Wert und Band. Gesucht wird der erste passende Wurf NACH der
   Ansage - vorher Gewuerfeltes gehoert nicht dazu. */
function ansageErgebnis() {
  const an = kampf.ansage;
  if (!an || an.stand !== 'wartet') return an && an.band ? an : null;
  const a = kampfFinde(an.wer);
  if (!a || a.typ !== 'spieler') return null;
  const treffer = protokollWurf(a, an.wert, an.ts);
  if (!treffer) return null;
  return Object.assign({}, an, { stand: 'gewuerfelt', band: treffer.band, roh: treffer.roh });
}

/* Die Wirkung wird VORGESCHLAGEN, nicht eingetragen. Der Klick darauf ist
   die Entscheidung der Spielleitung. */
function schadenEintragen(v) { kampfSchaden = v; zeichneKampf(); }

function wirkungGilt() {
  const an = ansageErgebnis();
  if (!an || !db) return;
  const z = kampfFinde(an.ziel);
  if (!z) return;
  const ausProtokoll = schadenErgebnis();
  const zahl = (ausProtokoll !== null) ? ausProtokoll : Number(kampfSchaden) || 0;
  const w = wirkung(zahl, z.robustheit,
    { angeschlagen: z.angeschlagen, wunden: z.wunden, extra: z.extra });
  if (w.text === 'keine Wirkung') {
    kampfLog(zahl + ' Schaden gegen Robustheit ' + z.robustheit + ' — ' + z.name +
      ' steckt es weg.', 'daneben');
    kampfSchaden = ''; kampfRef('ansage').remove(); return;
  }
  kampfLog(zahl + ' Schaden gegen Robustheit ' + z.robustheit + ' — ' +
    z.name + ': ' + w.text + '.', 'treffer');

  if (z.typ === 'gegner') {
    kampfRef().update({
      ['gegner/' + z.gid + '/angeschlagen']: w.angeschlagen,
      ['gegner/' + z.gid + '/wunden']: w.wunden,
      ['gegner/' + z.gid + '/raus']: w.ausserGefecht,
      ansage: null
    });
  } else {
    /* Beim Spieler geht es ins Postfach - sein Bogen traegt es ein und
       zeigt ihm, woher es kam. */
    uebergeben(z.pid, w.neueWunden
      ? { art: 'wunde', wert: w.neueWunden }
      : { art: 'angeschlagen' });
    kampfRef('ansage').remove();
    gutMeldung(z.name + ': ' + w.text + ' — kommt an, sobald sein Bogen offen ist.');
  }
  kampfSchaden = '';
}

function ansageWeg() { if (db) kampfRef('ansage').remove(); kampfSchaden = ''; }

/* ---------- Das Kampflog ----------
   Was passiert ist, in der Reihenfolge, in der es passiert ist. Es liegt
   beim Kampfstand und verschwindet mit ihm: Ein Gefecht ist zu Ende, wenn
   es zu Ende ist. Was den Abend überdauern soll, steht ohnehin schon im
   PROTOKOLL - dort landet jeder Wurf samt Szene und Ort, und dorthin
   gehört auch der Kommentar. Zwei Gedächtnisse für dieselbe Sache wären
   eins zu viel; dieses hier ist das kurze für den laufenden Kampf. */
function kampfLog(text, art) {
  if (!db) return;
  kampfRef('log').push({
    t: text, art: art || '', runde: kampf.runde || 0, ts: Date.now()
  }).catch(function () { /* das Log ist Beiwerk - ein Treffer gilt auch ohne */ });
}

function kampfLogZeilen() {
  const l = kampf.log || {};
  return Object.keys(l).map(function (k) { return l[k]; })
    .filter(function (z) { return z && z.t; })
    .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
}

/* Die beste getragene Waffe einer Art. "Beste" heisst hier schlicht:
   der hoechste Schadenswuerfel - wer zwei Klingen traegt, nimmt im Zweifel
   die groessere. */
function besteWaffe(blatt, art) {
  return ((blatt && blatt.ausr) || []).map(function (id) { return AUSR_BY_ID[id]; })
    .filter(function (a) { return a && a.art === art; })
    .sort(function (a, b) { return (b.schaden || 0) - (a.schaden || 0); })[0] || null;
}
function nahWaffeVon(blatt) { return besteWaffe(blatt, 'Nahkampf'); }
function fernWaffeVon(blatt) { return besteWaffe(blatt, 'Fernkampf'); }

/* Kann der Angreifer ueberhaupt schiessen? "Wenn moeglich" heisst hier
   konkret: eine Fernkampfwaffe in der Hand UND Pulver dafuer - das ist die
   Munitionsregel aus Bibel 4.5, die bisher nur im Bogen stand. Geht es
   nicht, sagt die Oberflaeche WARUM, statt stumm zu bleiben. */
function fernMoeglich(t) {
  if (!t) return { ok: false, grund: 'niemand gewählt' };
  if (t.typ === 'gegner') {
    /* Eine Schusswaffe in der Hand UND die Fertigkeit dafuer. Ladungen
       zaehlt bei NSC niemand mit - das erzaehlt die Spielleitung. */
    if (!t.fernwaffe) return { ok: false, grund: t.name + ' trägt keine Schusswaffe' };
    return t.schiessen > 0
      ? { ok: true, wert: 'Schießen', stufe: t.schiessen }
      : { ok: false, grund: t.name + ' kann nicht schießen' };
  }
  const waffen = ((t.figur && t.figur.ausr) || []).map(function (id) { return AUSR_BY_ID[id]; })
    .filter(function (a) { return a && a.art === 'Fernkampf'; });
  if (!waffen.length) return { ok: false, grund: t.name + ' trägt keine Schusswaffe' };
  if (waffen.some(function (a) { return a.schuss; }) && !((t.figur && t.figur.ladungen) || 0)) {
    return { ok: false, grund: t.name + ' hat kein Pulver mehr' };
  }
  return { ok: true, wert: 'Schießen', stufe: (t.figur && t.figur.fert['Schießen']) || 0,
           waffe: waffen[0] };
}

/* Womit schlägt er zu? Die beste getragene Nahkampfwaffe - und wenn er
   keine hat, die bloßen Fäuste. Die Spielleitung kann es überstimmen,
   aber in neun von zehn Fällen ist es genau das. */
function waffeVon(t) {
  if (!t || t.typ !== 'spieler' || !t.figur) return null;
  const waffen = (t.figur.ausr || []).map(function (id) { return AUSR_BY_ID[id]; })
    .filter(function (a) { return a && a.art === 'Nahkampf'; })
    .sort(function (a, b) { return (b.schaden || 0) - (a.schaden || 0); });
  return waffen[0] || AUSR_BY_ID['faust'] || null;
}

/* Die Bitte um den Schadenswurf. Sie geht denselben Weg wie die Probe -
   und der Bogen würfelt sie als das, was sie ist: kein Zielwert, kein
   Wild Die, und die Wunden ziehen nichts ab. */
function schadenAnfordern() {
  const an = ansageErgebnis();
  if (!an || !db) return;
  const a = kampfFinde(an.wer);
  if (!a || a.typ !== 'spieler') return;
  const waffe = waffeVon(a);
  const wuerfel = schadensWuerfel(a.figur, waffe, { steigerung: an.band === 'steigerung' });
  const paket = {};
  paket['figuren/' + a.pid + '/anfrage'] = {
    art: 'schaden', wuerfel: wuerfel, von: 'Spielleitung',
    grund: 'Schaden an ' + an.zielName + (waffe ? ' · ' + waffe.n : ''),
    ts: Date.now()
  };
  db.ref().update(paket).catch(function (e) { warnung('Die Bitte ging nicht durch: ' + e); });
  /* Das Ergebnis mitschreiben: Es entstand bisher nur beim Zeichnen aus
     dem Protokoll. Sobald die Ansage auf "schaden" steht, sucht niemand
     mehr danach - ohne diese Zeile waere der Treffer vergessen. */
  kampfRef('ansage').update({ stand: 'schaden', schadenTs: Date.now(),
    band: an.band, roh: an.roh });
  kampfLog(a.name + ' trifft ' + an.zielName +
    (an.band === 'steigerung' ? ' mit Steigerung' : '') + ' — Schadenswurf angefordert.', 'treffer');
}

/* Greift ein GEGNER an, wuerfelt die Spielleitung seinen Schaden - er
   wartet auf niemanden, und es gibt keinen Bogen, den man fragen koennte.
   Gerechnet wird nach derselben Regel wie beim Spieler: Waffe + Staerke,
   bei einer Steigerung +1W6, explodierend, ohne Wild Die. */
function gegnerSchadenWuerfeln() {
  const an = ansageErgebnis();
  if (!an) return;
  const a = kampfFinde(an.wer);
  if (!a || a.typ !== 'gegner') return;
  const wuerfel = schadensWuerfel(
    { attr: { 'Stärke': a.staerke || 1 } },
    { n: 'Waffe', art: an.art === 'fern' ? 'Fernkampf' : 'Nahkampf', schaden: a.schaden || 2 },
    { steigerung: an.band === 'steigerung' });
  const teile = wuerfel.map(function (w) {
    return { was: w.was, stufe: w.stufe, summe: wurf(w.stufe, { wild: false }).roh };
  });
  let summe = 0;
  teile.forEach(function (t) { summe += t.summe; });
  kampfSchaden = String(summe);
  kampfLog(a.name + ' würfelt Schaden: ' + summe + ' (' +
    teile.map(function (t) { return t.was + ' ' + DLBL[t.stufe] + ': ' + t.summe; }).join(' + ') +
    ')', 'treffer');
  zeichneKampf();
}

/* Und zurück kommt er über das Protokoll - genau wie die Probe. Ein
   angeforderter Schadenswurf steht dort drin; freie Würfel nicht. */
function schadenErgebnis() {
  const an = kampf.ansage;
  if (!an || an.stand !== 'schaden') return null;
  /* Der festgehaltene Wert gilt: Er ueberlebt ein Neuladen, das Protokoll
     wird irgendwann abgeraeumt. */
  if (an.schadenWert !== undefined && an.schadenWert !== null) return an.schadenWert;
  const a = kampfFinde(an.wer);
  if (!a || a.typ !== 'spieler') return null;
  const z = protokollWurf(a, 'Schaden', an.schadenTs || an.ts);
  return z ? z.roh : null;
}


/* ---------- Zeichnen ---------- */
function kampfZustandChips(t) {
  const c = [];
  if (t.raus) c.push('<span class="zst wnd">außer Gefecht</span>');
  if (t.angeschlagen && !t.raus) c.push('<span class="zst">angeschlagen</span>');
  if (t.wunden > 0) c.push('<span class="zst wnd">' + t.wunden +
    (t.wunden > 1 ? ' Wunden' : ' Wunde') + '</span>');
  return c.join('');
}

function kampfReiheHtml() {
  const reihe = kampf.reihe || [];
  if (!reihe.length) {
    return '<div class="kleer">Noch keine Reihenfolge. „Karten austeilen" verteilt sie — ' +
      'jede Runde neu, wie es das Regelwerk vorsieht.</div>';
  }
  const dran = kampf.dran || 0;
  return reihe.map(function (r, i) {
    const t = kampfFinde(r.id);
    if (!t) return '';
    const k = r.karte || null;
    return '<div class="ki' + (i === dran ? ' dran' : '') + (t.raus ? ' raus' : '') +
      '" data-dran="' + i + '">' +
      '<span class="kt' + (k && k.joker ? ' joker' : '') + '">' + esc(kartenText(k)) + '</span>' +
      '<span class="kn">' + esc(t.name) +
        '<small> · ' + (t.typ === 'spieler' ? 'Spieler' : (t.extra ? 'Statist' : 'Wild Card')) +
        ' · Parade ' + t.parade + ' · Rob. ' + t.robustheit + '</small></span>' +
      '<span class="kz">' + kampfZustandChips(t) +
        /* Die Seite laesst sich bei JEDER Figur umstellen - auch bei einer
           Spielerfigur. Wunden und Entfernen bleiben den Gegnern
           vorbehalten: Die Werte eines Spielers gehoeren seinem Bogen. */
        '<button class="mini" data-gseite="' + esc(t.id) + '" title="' +
          (t.seite === 'held' ? 'kämpft auf eurer Seite — klicken stellt um'
                              : 'kämpft gegen euch — klicken stellt um') +
          '">' + (t.seite === 'held' ? '⚓' : '⚔') + '</button>' +
        (t.typ === 'gegner'
          ? '<button class="mini" data-gwunde="' + esc(t.gid) + '|1">+ Wunde</button>' +
            '<button class="mini" data-gwunde="' + esc(t.gid) + '|-1">−</button>' +
            '<button class="mini" data-gang="' + esc(t.gid) + '">angeschlagen</button>' +
            '<button class="mini" data-gweg="' + esc(t.gid) + '">✕</button>'
          : '') +
      '</span></div>';
  }).join('');
}

function kampfAnsageHtml() {
  const an = ansageErgebnis() || kampf.ansage;
  if (!an) return '';
  let h = '<div class="kansage"><b>' + esc(an.werName) + '</b> greift <b>' +
    esc(an.zielName) + '</b> an — Kämpfen, nötig ' + an.parade +
    ' (' + (an.mod > 0 ? '+' : '') + an.mod + ')';
  if (an.stand === 'wartet' || !an.band) {
    h += '<div class="wirk">wartet auf den Wurf …</div>';
  } else {
    const getroffen = (an.band === 'erfolg' || an.band === 'steigerung');
    const stg = an.band === 'steigerung';
    h += '<div class="wirk"><b>' + (getroffen ? (stg ? 'Treffer mit Steigerung' : 'Treffer')
                                              : 'Daneben') + '</b>' +
      ' (Wurf ' + an.roh + ')';
    if (getroffen) {
      const a = kampfFinde(an.wer);
      const ausProtokoll = schadenErgebnis();
      const zahl = (ausProtokoll !== null) ? String(ausProtokoll) : kampfSchaden;
      h += '<br>Robustheit ' + an.robustheit + ' — Schaden' +
        (stg ? ' <b>plus 1W6 für die Steigerung</b>' : '') + ': ';
      /* Bei einem Spieler fragen wir ihn; einen Gegner würfeln wir selbst,
         und wer am Tisch laut vorliest, trägt die Zahl weiterhin ein. */
      if (a && a.typ === 'spieler' && an.stand !== 'schaden') {
        h += '<button class="mini" data-kschaden="1">Schaden anfordern</button> oder ';
      } else if (a && a.typ === 'gegner') {
        /* Einen Gegner fragt niemand - den würfelt die Spielleitung. */
        h += '<button class="mini" data-gschaden="1">Schaden würfeln</button>' +
          ' <span style="color:var(--gray);font-size:.68rem">(' +
          esc(DLBL[a.schaden || 2]) + ' + Stärke ' + esc(DLBL[a.staerke || 1]) + ')</span> oder ';
      } else if (an.stand === 'schaden' && ausProtokoll === null) {
        h += '<i>wartet auf den Schadenswurf …</i> ';
      }
      h += '<input id="kSchaden" type="number" style="width:4.5rem" value="' + esc(zahl) +
        '" oninput="schadenEintragen(this.value)">';
      if (zahl !== '' && zahl !== undefined) {
        const z = kampfFinde(an.ziel);
        const w = z ? wirkung(Number(zahl) || 0, z.robustheit,
          { angeschlagen: z.angeschlagen, wunden: z.wunden, extra: z.extra }) : null;
        if (w) h += ' → <b>' + esc(w.text) + '</b> ' +
          (w.text === 'keine Wirkung' ? '' : '<button class="mini" data-kgilt="1">gilt</button>');
      }
    }
    h += ' <button class="mini" data-kweg="1">abräumen</button></div>';
  }
  return h + '</div>';
}

function renderKampf() {
  document.getElementById('anzahl').textContent = kampf.runde
    ? 'Runde ' + kampf.runde : 'kein Kampf';
  const vorlagen = kampfVorlagen();
  const grp = {};
  vorlagen.forEach(function (v) { (grp[v.quelle] = grp[v.quelle] || []).push(v); });
  const opt = Object.keys(grp).map(function (q) {
    return '<optgroup label="' + esc(q) + '">' + grp[q].map(function (v) {
      return '<option value="' + esc(v.id) + '">' + esc(v.name) + '</option>';
    }).join('') + '</optgroup>';
  }).join('');

  const alle = kampfAlle().filter(function (t) { return !t.raus; });
  const wahl = function (id, gewaehlt) {
    return '<select id="' + id + '" onchange="kampfWahl(' + String.fromCharCode(39) + id + String.fromCharCode(39) + ', this.value)">' +
      '<option value="">— wählen —</option>' +
      alle.map(function (t) {
        return '<option value="' + esc(t.id) + '"' + (t.id === gewaehlt ? ' selected' : '') +
          '>' + esc(t.name) + '</option>';
      }).join('') + '</select>';
  };

  document.getElementById('inhalt').innerHTML =
    '<div class="kk">' +
      '<span class="runde">' + (kampf.runde ? 'Runde ' + kampf.runde : 'kein Kampf') + '</span>' +
      '<button class="mini" data-kausteilen="1">Karten austeilen</button>' +
      '<span style="flex:1"></span>' +
      '<label>Gegner<select id="kVorlage">' + opt + '</select></label>' +
      '<label>Anzahl<input id="kAnzahl" type="number" min="1" max="12" value="1" style="width:3.5rem"></label>' +
      '<button class="mini" data-kneu="1">anlegen</button>' +
      '<button class="mini" data-kende="1">Kampf beenden</button>' +
    '</div>' +
    /* Daneben der selbstgebaute: Name, stark oder schwach, eine Waffe. */
    '<div class="kk">' +
      '<label>Eigener Gegner<input id="egName" placeholder="Hafenschläger" ' +
        'style="min-width:9rem"></label>' +
      '<label>Stufe<select id="egStufe">' +
        GEGNER_STUFEN.map(function (st) {
          return '<option value="' + esc(st.id) + '" title="' + esc(st.d) + '">' +
            esc(st.n) + '</option>';
        }).join('') + '</select></label>' +
      '<label>Waffe<select id="egWaffe">' +
        '<option value="">bloße Fäuste</option>' +
        ['Nahkampf', 'Fernkampf'].map(function (art) {
          return '<optgroup label="' + art + '">' +
            AUSRUESTUNG.filter(function (a) { return a.art === art && a.id !== 'faust'; })
              .map(function (a) {
                return '<option value="' + esc(a.id) + '">' + esc(a.n) +
                  ' (' + DLBL[a.schaden] + ')</option>';
              }).join('') + '</optgroup>';
        }).join('') + '</select></label>' +
      '<label>Anzahl<input id="egAnzahl" type="number" min="1" max="12" value="1" ' +
        'style="width:3.5rem"></label>' +
      '<button class="mini" data-kegneu="1">anlegen</button>' +
    '</div>' +
    '<div class="kk">' +
      '<label>Angreifer' + wahl('kAngreifer', kampfAngreifer) + '</label>' +
      '<label>Ziel' + wahl('kZiel', kampfZiel) + '</label>' +
      '<button class="mini" data-kangriff="1">Angriff ansagen</button>' +
    '</div>' +
    kampfAnsageHtml() +
    kampfFeldHtml() +
    kampfReiheHtml() +
    kampfLogHtml() +
    (alle.length ? '' : '<div class="kleer">Niemand im Kampf. Leg oben Gegner an — ' +
      'die Spieler kommen von selbst dazu, sobald sie eine Figur haben.</div>');
}


/* ---------- Die Aufstellung ----------
   Zwei Seiten, drei Distanzen. Die Geste IST die Ansage:
     ziehen  - Angreifer auf das Ziel = Nahkampf (nur im Nahband)
     klicken - Angreifer, dann Ziel  = Fernkampf, wenn moeglich
   Einen Gegner auf ein anderes Band zu ziehen stellt ihn um; das ist
   die einzige "Bewegung", die es hier gibt - mehr braucht es ohne Brett
   auch nicht.

   Die Auswahlfelder bleiben daneben stehen: als Rueckfall und weil
   Ziehen auf einem Tablet fummelig ist. */
function kampfToken(t) {
  const gew = (kampfGewaehlt === t.id);
  const kann = gew ? null : fernMoeglich(kampfFinde(kampfGewaehlt));
  const zielbar = !!kampfGewaehlt && !gew && !t.raus &&
    t.seite !== (kampfFinde(kampfGewaehlt) || {}).seite;
  const w = t.typ === 'gegner'
    ? (AUSR_BY_ID[t.waffe] || AUSR_BY_ID[t.fernwaffe] || null)
    : nahWaffeVon(t.figur);
  const werte = 'P' + t.parade + ' · R' + t.robustheit +
    (w ? ' · ' + w.n : '') +
    (t.typ === 'gegner' ? (t.extra ? ' · Statist' : ' · Wild Card') : '');
  return '<div class="ktok ' + (t.seite === 'held' ? 'freund' : 'feind') +
    (gew ? ' gewaehlt' : '') + (zielbar ? ' ziel' : '') + (t.raus ? ' raus' : '') + '"' +
    (t.raus ? '' : ' draggable="true"') +
    ' data-tok="' + esc(t.id) + '" title="' +
    (zielbar ? (kann && kann.ok ? 'Klick: Fernkampf · Ziehen: Nahkampf'
                                : esc(kann ? kann.grund : '') + ' — Ziehen geht trotzdem')
             : 'Klicken wählt ihn als Angreifer, Ziehen greift an') + '">' +
    '<span class="tn">' + esc(t.name) + '</span>' +
    '<span class="tw">' + werte + '</span>' +
    '<span class="tz">' + kampfZustandChips(t) + '</span>' +
    '</div>';
}

function kampfFeldHtml() {
  const alle = kampfAlle();
  if (!alle.length) return '';
  const feinde = alle.filter(function (t) { return t.seite === 'feind'; });
  const helden = alle.filter(function (t) { return t.seite === 'held'; });

  /* Von fern nach nah, damit die Gegner von oben herankommen. */
  const baender = [2, 1, 0].map(function (b) {
    const drin = feinde.filter(function (t) { return (t.band || 0) === b; });
    return '<div class="kband" data-band="' + b + '">' +
      '<span class="bl">' + esc(FERN_BAENDER[b].n) +
        '<small>' + (b === 0 ? 'Nahkampf möglich' :
          (FERN_BAENDER[b].mod + ' auf Schüsse')) + '</small></span>' +
      drin.map(kampfToken).join('') + '</div>';
  }).join('');

  return '<div class="kfeld">' +
    '<div class="khinw">Ziehen = Nahkampf · Klick auf den Angreifer, dann auf das Ziel = ' +
      'Fernkampf. Auf ein Band ziehen stellt die Entfernung um, auf „Deine Seite" ' +
      'die Seite — das gilt für jede Figur.' +
      (kampfGewaehlt ? ' <b>' + esc((kampfFinde(kampfGewaehlt) || {}).name || '') +
        '</b> ist gewählt — Klick auf ein Ziel schießt, nochmal auf ihn hebt die Wahl auf.' : '') +
      '</div>' +
    baender +
    '<div class="kmitte"></div>' +
    '<div class="kband" data-band="held">' +
      '<span class="bl">Deine Seite<small>Spieler und Verbündete</small></span>' +
      helden.map(kampfToken).join('') + '</div>' +
    '</div>';
}

/* ---------- Die beiden Gesten ---------- */
function tokenKlick(id) {
  const t = kampfFinde(id);
  if (!t || t.raus) return;
  if (!kampfGewaehlt || kampfGewaehlt === id) {
    kampfGewaehlt = (kampfGewaehlt === id) ? '' : id;
    zeichneKampf();
    return;
  }
  /* Zweiter Klick auf ein Ziel: Fernkampf, wenn moeglich. */
  angriffAnsagen('fern', kampfGewaehlt, id);
  kampfGewaehlt = '';
  zeichneKampf();
}

function tokenZiehen(id) { kampfZieht = id; }

function tokenFallen(zielId) {
  const von = kampfZieht;
  kampfZieht = '';
  if (!von || von === zielId) return;
  angriffAnsagen('nah', von, zielId);
}

/* Auf ein Band fallen lassen heisst: dort hinstellen - und das Band
   "held" ist die eigene Seite. Damit ist das Umstellen der Seite dieselbe
   Geste wie das Umstellen der Entfernung, und es gilt fuer JEDE Figur:
   Harwick steht meistens bei den Spielern, und eine Spielerfigur kann im
   Finale einmal gegen die Gruppe stehen. */
function bandFallen(b) {
  const von = kampfZieht;
  kampfZieht = '';
  const t = kampfFinde(von);
  if (!t || !db) return;
  const aufEigene = (b === 'held');
  const neu = aufEigene ? 0 : Math.max(0, Math.min(2, parseInt(b, 10) || 0));
  const neueSeite = aufEigene ? 'held' : 'feind';
  if (t.seite === neueSeite && t.band === neu) return;

  const paket = {};
  if (t.typ === 'gegner') {
    paket['gegner/' + t.gid + '/seite'] = neueSeite;
    paket['gegner/' + t.gid + '/band'] = neu;
  } else {
    /* Fuer Spielerfiguren liegt die Abweichung neben der Figur, nicht in
       ihr - der Bogen bleibt der einzige Schreiber auf seinen Werten. */
    paket['seiten/' + t.pid] = neueSeite === 'held' ? null : 'feind';
    paket['baender/' + t.pid] = neu || null;
  }
  kampfRef().update(paket);

  if (t.seite !== neueSeite) {
    kampfLog(t.name + ' kämpft jetzt ' +
      (neueSeite === 'held' ? 'auf eurer Seite' : 'gegen euch') + '.', 'auf');
  } else {
    kampfLog(t.name + ' steht jetzt auf ' + band(neu).n + '.', 'auf');
  }
}

/* Dasselbe ohne Ziehen - fuer das Tablet und fuer alle, die den Knopf
   lieber moegen. */
function seiteWechseln(id) {
  const t = kampfFinde(id) || kampfFinde('g:' + id);
  if (!t || !db) return;
  kampfZieht = t.id;
  bandFallen(t.seite === 'held' ? '0' : 'held');
}

function kampfLogHtml() {
  const z = kampfLogZeilen();
  if (!z.length) return '';
  /* Neueste oben: Im Gefecht interessiert, was gerade passiert ist, nicht
     wie es anfing. Nachlesen kann man trotzdem - die Runde steht dran. */
  return '<div class="klog"><h3>Kampflog ' +
    '<button class="mini" data-klogweg="1">leeren</button></h3>' +
    z.map(function (e) {
      return '<div class="klz ' + esc(e.art || '') + '">' +
