        '<span class="kr">' + (e.runde ? 'Runde ' + e.runde : '—') + '</span>' +
        '<span class="kx">' + esc(e.t) + '</span></div>';
    }).join('') + '</div>';
}

function kampfLogLeeren() {
  if (!db) return;
  if (!confirm('Kampflog leeren? Die Würfe selbst bleiben im Protokoll stehen.')) return;
  kampfRef('log').remove();
}

function kampfWahl(feld, wert) {
  if (feld === 'kAngreifer') kampfAngreifer = wert; else kampfZiel = wert;
  zeichneKampf();
}
function zeichneKampf() { if (ansicht === 'kampf') renderKampf(); }

function markeChip(zusatz, id, art, name, einordnung, text, innen) {
  return '<span class="tag ' + zusatz + '" tabindex="0" role="button"' +
    ' data-tipid="' + esc(id) + '" data-tipart="' + esc(art) + '"' +
    ' data-tipn="' + esc(name) + '"' +
    ' data-tipk="' + esc(einordnung) + '"' +
    ' data-tipt="' + esc(text || '') + '">' + esc(name) + (innen || '') + '</span>';
}

function gebenBlock(pid, roh) {
  const offen = Object.keys(roh.zuteilung || {}).length;
  /* Das Erfundene steht OBEN: Wer es gerade angelegt hat, will es jetzt
     vergeben und nicht erst durch sechs Warenarten scrollen. */
  const eigen = eigeneListe();
  const optEigen = eigen.length
    ? '<optgroup label="Von der Spielleitung">' + eigen.map(function (a) {
        return '<option value="' + esc(a.id) + '">' + esc(a.n) + '</option>';
      }).join('') + '</optgroup>'
    : '';
  const opt = optEigen + AUSR_ARTEN.map(function (art) {
    return '<optgroup label="' + esc(art) + '">' +
      AUSRUESTUNG.filter(function (a) { return a.art === art && !a.vonSl; }).map(function (a) {
        return '<option value="' + esc(a.id) + '">' + esc(a.n) +
          (a.preis ? ' (' + a.preis + ' M.)' : '') + '</option>';
      }).join('') + '</optgroup>';
  }).join('');
  return '<div class="geb"><div class="geb-h">Übergeben</div>' +
    '<div class="geb-r"><select data-sel="' + esc(pid) + '">' + opt + '</select>' +
    '<button class="mini" data-geben="' + esc(pid) + '">geben</button></div>' +
    '<div class="geb-r" style="margin-top:.3rem">' +
    '<input type="number" step="10" value="100" data-muenz="' + esc(pid) + '">' +
    '<button class="mini" data-muenzgeben="' + esc(pid) + '">Münzen</button>' +
    '<span style="flex:1"></span>' +
    '<span style="font-size:.66rem;color:var(--gray)">hat ' +
      (roh.muenzen == null ? '—' : roh.muenzen) + ' M.</span>' +
    '</div>' +
    (offen ? '<div class="warte">' + offen + ' Übergabe' + (offen > 1 ? 'n' : '') +
      ' liegt bereit — kommt an, sobald der Spieler seinen Bogen offen hat.</div>' : '') +
    '<div class="hinw">Getragenes anklicken, um es wieder einzuziehen. ' +
    'Nichts davon kostet Münzen — das hier ist Fund und Geschenk, kein Kauf.</div>' +
    '</div>';
}

function menuBlock(pid) {
  if (!menu || menu.pid !== pid) return '';
  const n = gruppe().length;
  return '<div class="anf"><span class="t"><b>' + esc(menu.wert) + '</b> anfordern — nötig ' +
    (ZIELZAHL - erschwernis) + '</span>' +
    '<button class="btn" data-einzeln="1">nur diese Figur</button>' +
    '<button class="btn" data-alle="1">von allen (' + n + ')</button>' +
    '<button class="btn" data-abbruch="1">✕</button></div>';
}

function alterText(ts) {
  if (!ts) return '';
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return 'gerade eben';
  if (min < 60) return 'vor ' + min + ' min';
  const h = Math.floor(min / 60);
  if (h < 24) return 'vor ' + h + ' h';
  return 'vor ' + Math.floor(h / 24) + ' Tagen';
}

/* ---------- Protokoll ----------
   Nach Szene und Ort gruppiert, damit daraus eine Zusammenfassung des Abends
   wird und nicht eine Liste von Zahlen. Die Reihenfolge innerhalb eines Orts
   bleibt die des Abends. */
function protokollZeilen() {
  return Object.keys(protokoll).map(function (k) {
    const z = protokoll[k] || {};
    return { k: k, szene: z.szene || '', ort: z.ort || '', spieler: z.spieler || '—',
             figur: z.figur || '', wert: z.wert || '', stufe: z.stufe || 0,
             band: z.band || 'miss', roh: z.roh, ziel: z.ziel,
             steigerungen: z.steigerungen || 0, notiz: z.notiz || '', ts: z.ts || 0 };
  }).sort(function (a, b) { return a.ts - b.ts; });
}

function bandKurz(z) {
  let t = BAND_NAMEN[z.band] || z.band;
  if (z.band === 'steigerung' && z.steigerungen > 1) t += ' ×' + z.steigerungen;
  if (z.roh !== undefined && z.roh !== null) t += ' · ' + z.roh + ' gegen ' + z.ziel;
  return t;
}

function notizSichern(k, text) {
  kommentiert = null;
  if (db && db.sitzung) {
    db.ref('sitzungen/' + db.sitzung + '/protokoll/' + k + '/notiz')
      .set(String(text || '').trim()).catch(function () {});
  }
  render();
}

function renderProtokoll() {
  const zeilen = protokollZeilen();
  document.getElementById('anzahl').textContent =
    zeilen.length === 1 ? '1 Wurf' : zeilen.length + ' Würfe';

  if (!zeilen.length) {
    document.getElementById('inhalt').innerHTML =
      '<div class="leer">Noch kein Wurf in dieser Sitzung.<br>' +
      (db && db.sitzung
        ? 'Sobald ein Spieler würfelt, erscheint er hier — mit Szene und Ort.'
        : 'Es ist keine Sitzung gewählt. Das Protokoll hängt an der Sitzung.') +
      '</div>';
    return;
  }

  // Szene -> Ort -> Zeilen, Reihenfolge nach erstem Auftreten.
  const szenen = [];
  const sIdx = {}, oIdx = {};
  zeilen.forEach(function (z) {
    if (sIdx[z.szene] === undefined) { sIdx[z.szene] = szenen.length; szenen.push({ id: z.szene, orte: [] }); }
    const sz = szenen[sIdx[z.szene]];
    const ok = z.szene + '|' + z.ort;
    if (oIdx[ok] === undefined) { oIdx[ok] = sz.orte.length; sz.orte.push({ id: z.ort, zeilen: [] }); }
    sz.orte[oIdx[ok]].zeilen.push(z);
  });

  let h = '';
  szenen.forEach(function (sz) {
    h += '<div class="pszene"><h3>' + esc(szenenLabel(sz.id)) + '</h3>';
    sz.orte.forEach(function (o) {
      h += '<div class="port"><h4>' + esc(ortTitel(o.id)) + '</h4>';
      o.zeilen.forEach(function (z) {
        h += '<div class="pz"><span class="l"><b>' + esc(z.spieler) + '</b>' +
             (z.figur ? ' <span style="color:var(--gray)">(' + esc(z.figur) + ')</span>' : '') +
             ' · ' + esc(z.wert) + ' ' + (DLBL[z.stufe] || '—') + '</span>' +
             '<span class="r b-' + esc(z.band) + '">' + esc(bandKurz(z)) + '</span>' +
             '<button class="k' + (z.notiz ? ' hat' : '') + '" data-komm="' + esc(z.k) + '">' +
             (z.notiz ? 'notiert' : '+ Notiz') + '</button></div>';
        if (kommentiert === z.k) {
          h += '<div class="pedit"><input id="kommFeld" value="' + esc(z.notiz) +
               '" placeholder="Was ist an dieser Stelle passiert?" maxlength="300">' +
               '<button class="btn" data-sichern="' + esc(z.k) + '">sichern</button>' +
               '<button class="btn" data-kabbruch="1">abbrechen</button></div>';
        } else if (z.notiz) {
          h += '<div class="pnotiz">' + esc(z.notiz) + '</div>';
        }
      });
      h += '</div>';
    });
    h += '</div>';
  });
  document.getElementById('inhalt').innerHTML = h;

  if (kommentiert !== null) {
    const feld = document.getElementById('kommFeld');
    if (feld) { feld.focus(); if (feld.select) feld.select(); }
  }
}

function render() {
  zeichneErschwernis();
  if (ansicht === 'protokoll') { renderProtokoll(); return; }
  if (ansicht === 'waren') { renderWaren(); return; }
  if (ansicht === 'kampf') { renderKampf(); return; }

  const ids = Object.keys(figuren);
  document.getElementById('anzahl').textContent =
    ids.length === 1 ? '1 Figur' : ids.length + ' Figuren';

  if (!ids.length) {
    document.getElementById('inhalt').innerHTML =
      '<div class="leer">Noch keine Figur angelegt.<br>' +
      'Sobald ein Spieler die Charaktererschaffung öffnet, erscheint sie hier von selbst.</div>';
    return;
  }

  document.getElementById('inhalt').innerHTML = '<div class="grid">' + ids.map(function (pid) {
    const roh = figuren[pid] || {};
    const f = alsFigur(roh);

    const attr = ATTRIBUTE.map(function (a) { return wertChip(a.name, f.attr[a.name] || 1, pid); }).join('');
    const fert = FERTIGKEITEN
      .filter(function (s) { return zeigeAlle || (f.fert[s.name] || 0) > 0; })
      .map(function (s) { return wertChip(s.name, f.fert[s.name] || 0, pid); }).join('') ||
      '<span class="brief fehlt" style="font-size:.72rem">nichts gelernt</span>';

    /* Dieselbe Mechanik wie im Spielerbogen (js/marken.js): Hovern nennt
       die Wirkung, Klicken oeffnet die ganze Erklaerung.

       Am 14.10.2026 stand hier ausdruecklich das Gegenteil - "bewusst NICHT
       in regie_figuren.html, ein Overlay stuende beim Durchsehen mehrerer
       Figuren im Weg". Die Sorge war unbegruendet: Das Overlay oeffnet auf
       KLICK, nicht beim Hovern, steht also nur im Weg, wenn man es ruft.
       Und der native title, der hier stand, kommt erst nach einer Sekunde
       und bricht lange Texte schlecht um - fuer eine Frage mitten im Kampf
       taugt er nicht. */
    const tal = f.tal.map(function (i) {
      const x = TAL_BY_ID[i];
      if (!x) return '<span class="tag pos">' + esc(i) + '</span>';
      const rang = RAENGE[x.rang] ? RAENGE[x.rang].name : '';
      return markeChip('pos', x.id, 'tal', x.n, x.kat + ' · ab ' + rang +
        (x.nurNsc ? ' · nur für diese Figur' : ''), x.d);
    }).join('');
    const hnd = f.hnd.map(function (i) {
      const x = HND_BY_ID[i];
      if (!x) return '<span class="tag neg">' + esc(i) + '</span>';
      const art = (x.schwer ? 'schwer · 2 Punkte' : 'leicht · 1 Punkt') +
        (x.haken ? ' · verpflichtet, senkt keinen Würfel' : '');
      return markeChip('neg', x.id, 'hnd', x.n, art, x.d);
    }).join('');

    /* Zustand ist fuer die SL am Tisch das Wichtigste ueberhaupt: wer haelt
       noch, wer nicht. Nur zeigen, wenn es etwas zu zeigen gibt - eine
       unversehrte Figur braucht dafuer keine Zeile. */
    const zTeile = [];
    if (f.angeschlagen) zTeile.push('<span class="zst ang">angeschlagen</span>');
    if (f.wunden > 0) zTeile.push('<span class="zst wnd">' + f.wunden + ' Wunde' + (f.wunden > 1 ? 'n' : '') + '</span>');
    if (ueberladen(f)) zTeile.push('<span class="zst ang">überladen</span>');
    if (ausserGefecht(f)) zTeile.push('<span class="zst aus">außer Gefecht</span>');
    const abzug = wundenAbzug(f);
    if (abzug > 0) zTeile.push('<span class="zst wnd">−' + abzug + ' auf jede Probe</span>');
    const zustand = zTeile.length
      ? '<div class="sl">Zustand</div><div class="tags">' + zTeile.join('') + '</div>' : '';

    /* Was ein Gegenstand TUT, nicht nur, dass er da ist (Hendriks Frage vom
       15.10.2026). Die Kurzwerte stehen am Chip, alles Weitere im Overlay -
       dieselbe Mechanik wie bei Talenten, dritte Art "ausr". */
    const traegt = (f.ausr || []).map(function (id) {
      const a = AUSR_BY_ID[id];
      /* Ein Gegenstand, den es nicht (mehr) gibt, wird GENANNT statt
         verschluckt: Sonst traegt die Figur etwas, das niemand sieht. */
      if (!a) return '<span class="tag ausr" title="Diesen Gegenstand gibt es im Regelwerk ' +
        'nicht - vermutlich eine gelöschte Erfindung der Spielleitung.">' + esc(id) +
        ' <span class="wert">unbekannt</span>' +
        '<span class="zu" data-nehmen="' + esc(pid) + '|' + esc(id) + '">×</span></span>';
      const kurz = [];
      if (a.schaden) kurz.push(DLBL[a.schaden]);
      /* Beschriftet, nicht nackt: Zwischen "d6" und "1 Schuss" ist eine
         blanke 5 nicht zu deuten. */
      if (a.reichweite) kurz.push('Reichw. ' + a.reichweite);
      if (a.ruest) kurz.push('+' + a.ruest);
      if (a.schuss) kurz.push(a.schuss + ' Schuss');
      const einordnung = a.art + ' · ' + (a.gew || 0) + ' Gew. · ' + (a.preis || 0) + ' M.' +
        (a.vonSl ? ' · von der Spielleitung' : '');
      return markeChip('ausr', id, 'ausr', a.n, einordnung, a.d,
        (kurz.length ? ' <span class="wert">' + esc(kurz.join(' · ')) + '</span>' : '') +
        '<span class="zu" data-nehmen="' + esc(pid) + '|' + esc(id) +
        '" title="einziehen">×</span>');
    }).join('');

    /* Traglast und Ladungen kamen hier bisher gar nicht vor - beides muss
       die Spielleitung im Kampf wissen. Der Schuetze ohne Pulver ist der
       haeufigere Fall, und niemand sieht es ihm an. */
    const schuesse = (f.ausr || []).filter(function (id) {
      return AUSR_BY_ID[id] && AUSR_BY_ID[id].schuss;
    }).length;
    const lastTeile = ['Gewicht <b>' + getragen(f) + '</b> von ' + traglast(f)];
    if (schuesse) {
      lastTeile.push('Ladungen <b' + ((f.ladungen || 0) ? '' : ' class="voll"') + '>' +
        (f.ladungen || 0) + '</b>' + ((f.ladungen || 0) ? '' : ' — kann nicht schießen'));
    }
    const last = traegt ? '<div class="last">' + lastTeile.join(' · ') + '</div>' : '';

    const brief = zeigeBrief ? '<div class="sl">Steckbrief</div><div class="brief">' +
      STECKBRIEF.map(function (b) {
        const v = (f.brief[b.id] || '').trim();
        return '<b>' + b.n + '</b><span' + (v ? '' : ' class="fehlt"') + '>' +
          (v ? esc(v) : 'noch nicht ausgefüllt') + '</span>';
      }).join('') + '</div>' : '';

    return '<div class="fig">' +
      '<div class="fig-h">' +
        '<div class="fig-n">' + (esc(roh.name) || '<span style="color:var(--gray)">ohne Namen</span>') + '</div>' +
        '<div class="fig-s"><span>' + (esc(roh.spieler) || '—') + '</span>' +
          '<span>' + rangName(f.rang) + '</span>' +
          // Der Schluessel IST der Figurencode. Hier steht er, damit die
          // Spielleitung ihn einem Spieler vorlesen kann, der ihn verlegt hat.
          // Seit Oktober 2026 IST der Schluessel der Spielername - es gibt
          // keinen Code mehr zum Vorlesen. Eine Figur, die noch unter einem
          // Zufallscode liegt, wird als solche gekennzeichnet: Sie gehoert
          // noch niemandem und laesst sich im Regie-Hub zuordnen.
          '<span class="fig-code" title="' +
            (istAltSchluessel(pid)
              ? 'Alte Figur ohne Spieler - im Regie-Hub zuordnen oder loeschen'
              : 'Schluessel dieser Figur: Spielername + Sitzung') + '">' +
            esc(istAltSchluessel(pid) ? figurCodeLesbar(pid) + ' · ohne Spieler' : pid) + '</span>' +
          '</div>' +
      '</div>' +
      '<div class="fig-b">' +
        '<div class="dv-row">' +
          '<div class="dv"><div class="dv-l">Parade</div><div class="dv-v">' + parade(f) + '</div></div>' +
          '<div class="dv"><div class="dv-l">Robust.</div><div class="dv-v">' + robustheit(f) + '</div></div>' +
          '<div class="dv"><div class="dv-l">Bennies</div><div class="dv-v">' + benniesStand(f) +
            '<span style="font-size:.6rem;color:var(--gray)"> / ' + bennies(f) + '</span></div></div>' +
          '<div class="dv"><div class="dv-l">Bewegung</div><div class="dv-v">' + bewegung() + '</div></div>' +
        '</div>' +
        zustand +
        '<div class="sl">Attribute</div><div class="werte">' + attr + '</div>' +
        '<div class="sl">Fertigkeiten</div><div class="werte">' + fert + '</div>' +
        (tal || hnd ? '<div class="sl">Talente &amp; Schwächen</div><div class="tags">' + tal + hnd + '</div>' : '') +
        (traegt ? '<div class="sl">Trägt</div>' + last +
                  '<div class="tags">' + traegt + '</div>' : '') +
        pcBildBlock(pid) +
        gebenBlock(pid, roh) +
        menuBlock(pid) +
        anfrageBlock(pid, roh) +
        brief +
        '<div class="alt">' + alterText(roh.aktualisiert) + '</div>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

/* Einmal je Seite. Die Lauscher arbeiten per Delegation, die Chips duerfen
   also beliebig oft neu gezeichnet werden. */
if (typeof markenAktivieren === 'function') markenAktivieren();

function setzeAnsicht(a) {
  ansicht = a;
  menu = null; kommentiert = null;
  document.getElementById('btnFiguren').classList.toggle('on', a === 'figuren');
  document.getElementById('btnProtokoll').classList.toggle('on', a === 'protokoll');
  document.getElementById('btnWaren').classList.toggle('on', a === 'waren');
  document.getElementById('btnKampf').classList.toggle('on', a === 'kampf');
  render();
}

document.addEventListener('click', function (ev) {
  const t = ev.target.closest('[data-ersch],[data-pid][data-wert],[data-einzeln],[data-alle],' +
    '[data-abbruch],[data-weg],[data-komm],[data-sichern],[data-kabbruch],' +
    '[data-geben],[data-muenzgeben],[data-nehmen],[data-wareweg],[data-wgeben],' +
    '[data-kausteilen],[data-kneu],[data-kegneu],[data-kende],[data-kangriff],[data-kgilt],' +
    '[data-kschaden],[data-gschaden],[data-klogweg],[data-gseite],[data-tok],' +
    '[data-kweg],[data-gwunde],[data-gang],[data-gweg],[data-dran],[data-pcbild]');
  if (!t) return;

  if (t.dataset.pcbild !== undefined) { pcBildUmschalten(t.dataset.pcbild); return; }

  if (t.dataset.ersch !== undefined) {
    erschwernis = parseInt(t.dataset.ersch, 10);
    render(); return;
  }
  if (t.dataset.wert !== undefined && t.dataset.pid !== undefined) {
    // Nochmal derselbe Wert schliesst das Menue wieder.
    menu = (menu && menu.pid === t.dataset.pid && menu.wert === t.dataset.wert)
      ? null : { pid: t.dataset.pid, wert: t.dataset.wert };
    render(); return;
  }
  if (t.dataset.einzeln && menu) { anfordern([menu.pid], menu.wert); return; }
  if (t.dataset.alle && menu)    { anfordern(gruppe(), menu.wert); return; }
  if (t.dataset.abbruch)         { menu = null; render(); return; }
  if (t.dataset.weg !== undefined) { anfrageWeg(t.dataset.weg); return; }
  if (t.dataset.geben !== undefined) {
    const sel = document.querySelector('[data-sel="' + t.dataset.geben + '"]');
    if (sel && sel.value) uebergeben(t.dataset.geben, { art: 'gegenstand', id: sel.value });
    return;
  }
  if (t.dataset.muenzgeben !== undefined) {
    const inp = document.querySelector('[data-muenz="' + t.dataset.muenzgeben + '"]');
    const wert = Math.round(Number(inp && inp.value) || 0);
    if (wert) uebergeben(t.dataset.muenzgeben, { art: 'muenzen', wert: wert });
    return;
  }
  if (t.dataset.wareweg !== undefined) { wareWeg(t.dataset.wareweg); return; }
  /* Aus der Liste heraus vergeben: suchen, finden, geben - ohne vorher zu
     wissen, in welcher Warenart der Gegenstand steckt. */
  if (t.dataset.kausteilen !== undefined) { kampfAusteilen(); return; }
  if (t.dataset.kneu !== undefined)       { gegnerAnlegen(); return; }
  if (t.dataset.kegneu !== undefined)     { eigenenGegnerAnlegen(); return; }
  if (t.dataset.kende !== undefined)      { kampfBeenden(); return; }
  if (t.dataset.kangriff !== undefined)   { angriffAnsagen(); return; }
  if (t.dataset.kschaden !== undefined)   { schadenAnfordern(); return; }
  if (t.dataset.gschaden !== undefined)   { gegnerSchadenWuerfeln(); return; }
  if (t.dataset.kgilt !== undefined)      { wirkungGilt(); return; }
  if (t.dataset.kweg !== undefined)       { ansageWeg(); return; }
  if (t.dataset.klogweg !== undefined)    { kampfLogLeeren(); return; }
  if (t.dataset.gseite !== undefined)     { seiteWechseln(t.dataset.gseite); return; }
  if (t.dataset.tok !== undefined)        { tokenKlick(t.dataset.tok); return; }
  if (t.dataset.gweg !== undefined)       { gegnerWeg(t.dataset.gweg); return; }
  if (t.dataset.gang !== undefined) {
    const g = (kampf.gegner || {})[t.dataset.gang] || {};
    gegnerZustand(t.dataset.gang, 'angeschlagen', !g.angeschlagen); return;
  }
  if (t.dataset.gwunde !== undefined) {
    const teile = t.dataset.gwunde.split('|');
    gegnerZustand(teile[0], 'wunden', parseInt(teile[1], 10)); return;
  }
  if (t.dataset.dran !== undefined) { kampfDran(parseInt(t.dataset.dran, 10)); return; }
  if (t.dataset.wgeben !== undefined) {
    if (!warenZiel) return;
    uebergeben(warenZiel, { art: 'gegenstand', id: t.dataset.wgeben });
    const a = AUSR_BY_ID[t.dataset.wgeben];
    const f = figuren[warenZiel];
    gutMeldung(((a && a.n) || t.dataset.wgeben) + ' geht an ' +
      ((f && f.name) || warenZiel) + ' — kommt an, sobald der Bogen offen ist.');
    return;
  }
  if (t.dataset.nehmen !== undefined) {
    const teile = t.dataset.nehmen.split('|');
    const a = AUSR_BY_ID[teile[1]];
    /* Gefragt wird, seit der Chip selbst die Erklaerung oeffnet: Das Kreuz
       ist klein, und ein Fehlgriff kostete der Figur sonst ihre Waffe. */
    if (!confirm('„' + ((a && a.n) || teile[1]) + '" wieder einziehen?')) return;
    uebergeben(teile[0], { art: 'nehmen', id: teile[1] });
    return;
  }
  if (t.dataset.komm !== undefined) { kommentiert = t.dataset.komm; render(); return; }
  if (t.dataset.sichern !== undefined) {
    const feld = document.getElementById('kommFeld');
    notizSichern(t.dataset.sichern, feld ? feld.value : ''); return;
  }
  if (t.dataset.kabbruch) { kommentiert = null; render(); return; }
});

/* Ziehen und Fallenlassen, ebenfalls per Delegation: Die Chips werden bei
   jeder Aenderung neu gezeichnet, einzelne Lauscher waeren nach dem ersten
   Zug tot. */
document.addEventListener('dragstart', function (ev) {
  const t = ev.target && ev.target.closest ? ev.target.closest('[data-tok]') : null;
  if (!t) return;
  tokenZiehen(t.dataset.tok);
  if (ev.dataTransfer) { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', t.dataset.tok); }
});
document.addEventListener('dragover', function (ev) {
  if (!ev.target || !ev.target.closest) return;
  if (ev.target.closest('[data-tok]') || ev.target.closest('[data-band]')) ev.preventDefault();
});
document.addEventListener('drop', function (ev) {
  if (!ev.target || !ev.target.closest) return;
  const tok = ev.target.closest('[data-tok]');
  const bnd = ev.target.closest('[data-band]');
  /* Erst das Ziel, dann das Band: Wer auf eine Figur faellt, greift sie an,
     auch wenn die Figur in einem Band steht. */
  if (tok) { ev.preventDefault(); tokenFallen(tok.dataset.tok); return; }
  if (bnd) { ev.preventDefault(); bandFallen(bnd.dataset.band); }
});

// Enter sichert, Escape bricht ab - wer am Tisch tippt, greift nicht zur Maus.
document.addEventListener('keydown', function (ev) {
  if (!ev.target || ev.target.id !== 'kommFeld') return;
  if (ev.key === 'Enter') notizSichern(kommentiert, ev.target.value);
  else if (ev.key === 'Escape') { kommentiert = null; render(); }
});

function toggleBrief() {
  zeigeBrief = !zeigeBrief;
  document.getElementById('btnBrief').classList.toggle('on', zeigeBrief);
  render();
}
function toggleAlle() {
  zeigeAlle = !zeigeAlle;
  document.getElementById('btnAlle').classList.toggle('on', zeigeAlle);
  render();
}

render();
initFirebase();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    setFiguren: function (f) { figuren = f; render(); },
    setPcLeiste: function (p) { pcLeiste = p; render(); },
    pcBildUmschalten, pcBildBlock,
    setProtokoll: function (p) { protokoll = p; kampfPruefeWuerfe(); render(); },
    setDb: function (d) { db = d; },
    setzeAnsicht, anfordern, anfrageWeg, notizSichern, gruppe, uebergeben, gebenBlock,
    toggleWerkstatt, zeichneWerkstatt, wareAnlegen, wareWeg, eigeneListe,
    warenSuchen, warenZielSetzen, warenTreffer, hervor, suchForm, warenWerte,
    gegnerAnlegen, gegnerWeg, gegnerZustand, kampfAusteilen, kampfBeenden,
    angriffAnsagen, ansageErgebnis, wirkungGilt, ansageWeg, kampfWahl,
    schadenAnfordern, schadenErgebnis, waffeVon, gegnerSchadenWuerfeln,
    eigenenGegnerAnlegen, besteWaffe, nahWaffeVon, fernWaffeVon,
    kampfLog, kampfLogZeilen, kampfLogLeeren, kampfPruefeWuerfe, protokollWurf,
    kampfFeldHtml, kampfToken, tokenKlick, tokenZiehen, tokenFallen,
    bandFallen, seiteWechseln, fernMoeglich,
    kampfAlle, kampfFinde, schadenEintragen,
    setKampf: function (k) { kampf = k; kampfPruefeWuerfe(); render(); },
    kampfStand: function () { return kampf; },
    protokollZeilen, bandKurz, szenenLabel, ortTitel,
    alsFigur, render,
    zustand: function () { return { ansicht, erschwernis, menu, kommentiert }; }
  };
}
