<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warhammer — Figur erschaffen</title>
<style>
:root{
  --bg:#1b1714;--surface:rgba(255,255,255,.045);--border:rgba(196,160,92,.24);
  --dark:#231d19;--teal:#5f9e8f;--gold:#c4a05c;--lgold:rgba(196,160,92,.12);
  --ink:#f6f0e6;--gray:#9c9080;--red:#a33a2a;--green:#4d8a5b;--amber:#c9792b;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Libre Baskerville',Georgia,serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:5rem}
a{color:var(--gold)}
.topbar{position:sticky;top:0;z-index:50;background:rgba(27,23,20,.97);border-bottom:1px solid var(--border)}
.tbin{max-width:1000px;margin:0 auto;padding:.5rem 1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.imRahmen .tbin{padding-right:3.2rem}
.brand{font-family:'Cinzel',serif;color:var(--gold);font-size:.92rem;letter-spacing:.12em}
.badge{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.08em;border:1px solid var(--border);color:var(--gray);border-radius:10px;padding:.1rem .55rem;white-space:nowrap}
.badge.gold{border-color:var(--gold);color:var(--gold)}
.sp{flex:1}
.schritte{display:flex;gap:.2rem;max-width:1000px;margin:0 auto;padding:0 1rem .45rem;flex-wrap:wrap}
.schritt{flex:1;min-width:84px;text-align:center;font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.07em;color:var(--gray);padding:.3rem .2rem;border-bottom:2px solid rgba(196,160,92,.18);cursor:pointer;text-transform:uppercase}
.schritt:hover{color:var(--gold)}
.schritt.on{color:var(--gold);border-bottom-color:var(--gold)}
.schritt.ok::after{content:' ✓';color:var(--green)}
.wrap{max-width:1000px;margin:0 auto;padding:1rem}
h2{font-family:'Cinzel',serif;color:var(--gold);font-size:1.15rem;letter-spacing:.05em;margin-bottom:.35rem}
.lead{font-size:.84rem;color:#d8cfbf;line-height:1.7;margin-bottom:.9rem}
.lead b{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.9rem;overflow:hidden}
.card-hdr{font-family:'Cinzel',serif;font-size:.66rem;letter-spacing:.14em;color:var(--gold);padding:.45rem .9rem;background:var(--lgold);border-bottom:1px solid var(--border);text-transform:uppercase;display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.card-hdr-sub{font-size:.62rem;color:var(--gray);font-family:'Libre Baskerville',serif;letter-spacing:0;font-style:italic;text-transform:none}
.card-body{padding:.75rem .9rem}
.hint{font-size:.74rem;color:var(--gray);font-style:italic;line-height:1.6;margin-top:.4rem}
.btn{font-family:'Cinzel',serif;font-size:.66rem;letter-spacing:.08em;padding:.42rem .9rem;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--gray);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.35;cursor:default}
.btn-gold{border-color:var(--gold);color:var(--gold)}
.btn-gold:hover:not(:disabled){background:var(--lgold)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.55rem}
.wahl{border:1px solid var(--border);border-radius:7px;padding:.6rem .7rem;cursor:pointer;background:rgba(255,255,255,.025);transition:all .15s}
.wahl:hover{border-color:var(--gold)}
.wahl.on{border-color:var(--teal);background:rgba(95,158,143,.13)}
.wahl.aus{opacity:.45}
.wahl-n{font-family:'Cinzel',serif;color:var(--gold);font-size:.86rem}
.wahl-d{font-size:.7rem;color:#cfc6b6;line-height:1.5;margin-top:.2rem}
.wurf{border:1px solid var(--gold);background:var(--lgold);border-radius:6px;padding:.55rem .8rem;margin:.6rem 0;font-size:.8rem;line-height:1.6}
.wurf b{font-family:'Cinzel',serif;color:var(--gold)}
.meld{font-size:.76rem;margin-top:.5rem;line-height:1.5;min-height:1rem}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.1em;color:var(--gray);text-transform:uppercase;text-align:left;padding:.25rem .35rem;border-bottom:1px solid var(--border)}
td{padding:.3rem .35rem;border-bottom:1px solid rgba(196,160,92,.08);vertical-align:middle}
td.z{font-family:'Cinzel',serif;color:var(--gold);font-weight:700;text-align:right;width:3.2rem}
td.m{text-align:center;color:#cfc6b6}
.tausch{cursor:pointer;border:1px dashed var(--border);border-radius:4px;padding:.05rem .45rem;display:inline-block;min-width:2.3rem;text-align:center}
.tausch:hover{border-color:var(--gold)}
.tausch.on{background:var(--teal);border-style:solid;color:#fff}
.step{display:inline-flex;align-items:center;gap:.25rem}
.step button{width:22px;height:21px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--gold);cursor:pointer;font-family:'Cinzel',serif;line-height:1}
.step button:disabled{opacity:.25;cursor:default}
.step span{min-width:1.6rem;text-align:center;font-family:'Cinzel',serif}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{border:1px solid var(--border);border-radius:12px;padding:.14rem .6rem;font-size:.72rem;color:#cfc6b6;cursor:pointer;background:transparent;font-family:inherit}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.on{border-color:var(--teal);background:rgba(95,158,143,.2);color:#bfe6dc}
.chip:disabled{opacity:.35;cursor:default}
.tag{display:inline-block;font-size:.7rem;border:1px solid rgba(95,158,143,.5);color:#bfe6dc;border-radius:11px;padding:.06rem .5rem;margin:.1rem .15rem .1rem 0}
input[type=text],select,textarea{background:var(--dark);border:1px solid var(--border);border-radius:5px;color:var(--ink);padding:.35rem .5rem;font-family:inherit;font-size:.8rem;outline:none}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{width:100%;min-height:70px;resize:vertical;line-height:1.55}
.feld{margin-bottom:.6rem}
.feld label{display:block;font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:.2rem}
.feld input[type=text]{width:100%}
.offen{border:1px solid rgba(201,121,43,.5);border-radius:6px;padding:.5rem .7rem;margin-bottom:.9rem;font-size:.76rem;color:#e7b383;line-height:1.6}
.offen.alles{border-color:rgba(77,138,91,.6);color:#a5d6ae}
.stufen{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem}
.stufe{border:1px solid var(--border);border-radius:6px;padding:.5rem .6rem;font-size:.72rem;line-height:1.55;color:#cfc6b6}
.stufe b{font-family:'Cinzel',serif;color:var(--gold);font-size:.78rem}
.stufe i{color:var(--gray)}
.klasse-h{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.12em;color:var(--teal);text-transform:uppercase;margin:.8rem 0 .3rem}
.fuss{position:fixed;left:0;right:0;bottom:0;background:rgba(27,23,20,.97);border-top:1px solid var(--border);z-index:40}
.fuss-in{max-width:1000px;margin:0 auto;padding:.55rem 1rem;display:flex;gap:.6rem;align-items:center}
.dv-row{display:flex;gap:.45rem;flex-wrap:wrap}
.dv{flex:1;min-width:90px;border:1px solid var(--border);border-radius:6px;text-align:center;padding:.4rem .3rem}
.dv-l{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.1em;color:var(--gray);text-transform:uppercase}
.dv-v{font-family:'Cinzel',serif;font-size:1.25rem;font-weight:700;color:var(--gold)}
.gesperrt{max-width:34rem;margin:3rem auto;text-align:center;line-height:1.7;font-size:.9rem;color:#d8cfbf}
.gesperrt h2{margin-bottom:.8rem}
</style>
</head>
<body>
<div class="topbar">
  <div class="tbin">
    <a class="badge" href="index.html" target="_top">← Hub</a>
    <span class="brand">Figur erschaffen</span>
    <span class="badge">Warhammer Fantasy</span>
    <span class="sp"></span>
    <span class="badge gold" id="epBadge">0 EP</span>
    <span class="badge" id="syncBadge">—</span>
  </div>
  <div class="schritte" id="schritte"></div>
</div>

<div class="wrap" id="inhalt"></div>

<div class="fuss" id="fuss">
  <div class="fuss-in">
    <button class="btn" id="zurueck" onclick="geheZu(W.schritt - 1)">‹ Zurück</button>
    <span class="sp"></span>
    <span class="hint" id="fussHinweis" style="margin:0"></span>
    <button class="btn btn-gold" id="weiter" onclick="geheZu(W.schritt + 1)">Weiter ›</button>
  </div>
</div>

<datalist id="dl-gott"><option value="Sigmar"><option value="Ulric"><option value="Taal"><option value="Rhya"><option value="Manann"><option value="Morr"><option value="Myrmidia"><option value="Ranald"><option value="Shallya"><option value="Verena"></datalist>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/sitzung.js"></script>
<script src="js/identitaet.js"></script>
<script src="js/wfrp_daten.js"></script>
<script src="js/wfrp_regelwerk.js"></script>
<script src="js/wfrp_erschaffung.js"></script>
<script>
/* ==========================================================
   WFRP — FIGUR ERSCHAFFEN
   ----------------------------------------------------------
   Die Seite zeichnet nur. Was gerechnet wird, steht in
   js/wfrp_erschaffung.js und js/wfrp_regelwerk.js.

   Gespeichert wird unter figuren/{Name}, wie bei Savage Worlds:
   die fertig gerechnete Figur UND der Zustand des Assistenten.
   Der Zustand geht als JSON-Text hinein (erschaffungJson): Seine
   Schluessel ("wissen/*") enthalten Schraegstriche, und die
   liest Firebase als Pfad.

   Ist die Figur abgeschlossen (fertig: true), gehoert sie dem
   Heldenbrief. Diese Seite fasst sie dann nicht mehr an - sonst
   wuerde ein zweites Oeffnen gekaufte Steigerungen ueberschreiben.
   ========================================================== */
let W = wfrpErsLeer();
let db = null, syncBereit = false, ladeBereit = false, syncTimer = null, angefangen = false;
let tauschA = null;      // gewaehltes Attribut beim Tauschen

if (window.top !== window.self) document.documentElement.classList.add('imRahmen');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function el(id) { return document.getElementById(id); }
function schluessel() { return figurSchluessel(spielerName()); }
function cacheKey() { return 'kors_wfrp_ers_' + (sitzungFest() || SITZUNG_VORGABE); }

/* ---------------- Speichern ---------------- */
function speichern() {
  angefangen = angefangen || !!W.spezies;
  try { localStorage.setItem(cacheKey(), JSON.stringify(W)); } catch (e) {}
  if (!db || !syncBereit || !ladeBereit || !angefangen) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(nachFirebase, 700);
}
function figurPaket() {
  const F = wfrpErsFigur(W, { spieler: spielerName() });
  const p = {};
  Object.keys(F).forEach(function (k) { p[k] = F[k]; });
  p.regelwerk = WFRP_REGELWERK;
  p.fertig = false;
  p.erschaffungJson = JSON.stringify(W);
  p.geaendert = Date.now();
  return p;
}
function nachFirebase() {
  if (!db || !syncBereit) return;
  try {
    db.ref('figuren/' + schluessel()).update(figurPaket())
      .then(function () { sync('gespeichert', 'var(--green)'); })
      .catch(function (e) { sync('nur lokal', 'var(--gray)'); console.warn(e); });
  } catch (e) { sync('nur lokal', 'var(--gray)'); }
}
function sync(t, f) { const b = el('syncBadge'); b.textContent = t; b.style.color = f; b.style.borderColor = f; }

function aendern(fn) { fn(); speichern(); zeichne(); }

/* ---------------- Navigation ---------------- */
function geheZu(i) {
  W.schritt = Math.max(0, Math.min(WFRP_ERS_SCHRITTE.length - 1, i));
  speichern(); zeichne(); window.scrollTo(0, 0);
}

function zeichne() {
  const offen = wfrpErsOffen(W);
  el('schritte').innerHTML = WFRP_ERS_SCHRITTE.map(function (s, i) {
    return '<div class="schritt' + (i === W.schritt ? ' on' : '') +
      (s.id !== 'fertig' && !offen[s.id].length ? ' ok' : '') + '" onclick="geheZu(' + i + ')">' +
      (i + 1) + ' ' + s.n + '</div>';
  }).join('');
  const ep = wfrpErsEp(W);
  el('epBadge').textContent = ep.summe + ' EP';
  el('epBadge').title = 'Bonus-Erfahrung aus der Erschaffung: Spezies ' + ep.spezies +
    ', Karriere ' + ep.karriere + ', Attribute ' + ep.attribute + '. Ausgegeben wird sie im Heldenbrief.';
  el('zurueck').disabled = W.schritt === 0;
  el('weiter').style.display = W.schritt === WFRP_ERS_SCHRITTE.length - 1 ? 'none' : '';
  const id = WFRP_ERS_SCHRITTE[W.schritt].id;
  el('fussHinweis').textContent = (offen[id] && offen[id].length) ? offen[id][0] : '';
  const f = { spezies: zSpezies, karriere: zKarriere, attribute: zAttribute, spezies2: zHerkunft,
              karriere2: zAusbildung, ausr: zAusruestung, details: zDetails, fertig: zFertig }[id];
  el('inhalt').innerHTML = f(offen[id] || []);
}

function offenBox(liste) {
  if (!liste.length) return '';
  return '<div class="offen">' + liste.map(esc).join('<br>') + '</div>';
}

/* ---------------- 1 Spezies ---------------- */
function zSpezies(offen) {
  const ep = wfrpErsEp(W);
  let h = '<h2>Spezies</h2><p class="lead">Mensch, Zwerg, Halbling, Hoch- oder Waldelf. ' +
    'Du kannst wählen — oder würfeln: Behältst du das Ergebnis, bekommst du <b>+20 EP</b>. ' +
    'Die Würfel des Chaos lieben den, der sich ihnen fügt.</p>' + offenBox(offen);
  if (W.speziesWurf === null) {
    h += '<div class="row" style="margin-bottom:.8rem"><button class="btn btn-gold" onclick="speziesWuerfeln()">W100 würfeln (+20 EP)</button></div>';
  } else {
    const sid = wfrpSpeziesAusWurf(W.speziesWurf);
    h += '<div class="wurf">Gewürfelt: <b>' + W.speziesWurf + '</b> — ' + esc(WFRP_SPEZIES[sid].n) +
      (ep.spezies ? ' · <b>+20 EP</b>' : ' · gewählt hast du etwas anderes, also kein Bonus') + '</div>';
  }
  h += '<div class="grid">';
  Object.keys(WFRP_SPEZIES).forEach(function (k) {
    const s = WFRP_SPEZIES[k];
    const stark = WFRP_ATTR_IDS.filter(function (a) { return s.attr[a] >= 30; }).map(function (a) { return WFRP_ATTR_BY_ID[a].k; });
    const schwach = WFRP_ATTR_IDS.filter(function (a) { return s.attr[a] <= 10; }).map(function (a) { return WFRP_ATTR_BY_ID[a].k; });
    h += '<div class="wahl' + (W.spezies === k ? ' on' : '') + '" onclick="speziesWaehlen(\'' + k + '\')">' +
      '<div class="wahl-n">' + esc(s.n) + '</div><div class="wahl-d">' +
      'Bewegung ' + s.bewegung + ' · Schicksal ' + s.schicksal + ' · Zähigkeit ' + s.zaehigkeit + ' · +' + s.extra + ' frei' +
      (stark.length ? '<br>stark: ' + stark.join(', ') : '') + (schwach.length ? '<br>schwach: ' + schwach.join(', ') : '') +
      '<br><i>W100: ' + (s.w100[0] === s.w100[1] ? pad(s.w100[0]) : pad(s.w100[0]) + '–' + pad(s.w100[1])) + '</i></div></div>';
  });
  return h + '</div>';
}
function pad(n) { return n >= 100 ? '00' : (n < 10 ? '0' + n : String(n)); }
function speziesWuerfeln() {
  aendern(function () { W.speziesWurf = wfrpW100(); speziesSetzen(wfrpSpeziesAusWurf(W.speziesWurf)); });
}
function speziesWaehlen(k) { aendern(function () { speziesSetzen(k); }); }
/* Was an der Spezies haengt, faellt beim Wechsel weg - sonst traegt
   ein Zwerg die Zufallstalente des Menschen, der er eben noch war. */
function speziesSetzen(k) {
  if (W.spezies === k) return;
  W.spezies = k;
  W.spFert5 = []; W.spFert3 = []; W.spTalWahl = {}; W.zufall = []; W.extraS = null;
}

/* ---------------- 2 Karriere ---------------- */
function zKarriere(offen) {
  if (!W.spezies) return '<h2>Karriere</h2><p class="lead">Wähle zuerst eine Spezies — die Wurftabelle hängt an ihr.</p>';
  const ep = wfrpErsEp(W);
  let h = '<h2>Klasse und Karriere</h2><p class="lead">Deine Karriere ist dein Broterwerb, wenn du nicht gerade ' +
    'in Abenteuer stolperst. Du beginnst immer auf ihrer <b>ersten Stufe</b>. Würfeln: Behältst du den ersten Wurf, ' +
    'gibt es <b>+50 EP</b>. Sonst darfst du zweimal nachwürfeln und aus den dreien wählen (<b>+25 EP</b>). ' +
    'Oder du wählst frei, ohne Bonus.</p>' + offenBox(offen);
  if (!W.karrWuerfe.length) {
    h += '<div class="row"><button class="btn btn-gold" onclick="karriereWuerfeln()">W100 würfeln (+50 EP)</button></div>';
  } else {
    h += '<div class="wurf">' + W.karrWuerfe.map(function (k, i) {
      return (i ? ' · ' : 'Gewürfelt: ') + '<b>' + esc(WFRP_KARR_BY_ID[k].n) + '</b>';
    }).join('') + (ep.karriere ? ' — <b>+' + ep.karriere + ' EP</b>' : ' — frei gewählt, kein Bonus') + '</div>';
    if (W.karrWuerfe.length === 1) {
      h += '<div class="row"><button class="btn" onclick="karriereNachwuerfeln()">Zweimal nachwürfeln (eine der drei: +25 EP)</button></div>';
    } else {
      h += '<div class="row">' + W.karrWuerfe.map(function (k) {
        return '<button class="chip' + (W.karriere === k ? ' on' : '') + '" onclick="karriereWaehlen(\'' + k + '\')">' + esc(WFRP_KARR_BY_ID[k].n) + '</button>';
      }).join('') + '</div>';
    }
  }
  const k = wfrpErsKarriere(W);
  if (k) h += karriereDetail(k);
  WFRP_KLASSEN.forEach(function (kl) {
    h += '<div class="klasse-h">' + esc(kl.n) + '</div><div class="grid">';
    WFRP_KARRIEREN.filter(function (x) { return x.klasse === kl.id; }).forEach(function (x) {
      const darf = x.spezies.indexOf(W.spezies) >= 0;
      const s1 = x.stufen[0];
      h += '<div class="wahl' + (W.karriere === x.id ? ' on' : '') + (darf ? '' : ' aus') + '" onclick="karriereWaehlen(\'' + x.id + '\')"' +
        (darf ? '' : ' title="Steht deiner Spezies normalerweise nicht offen — nur mit der Spielleitung."') + '>' +
        '<div class="wahl-n">' + esc(x.n) + '</div><div class="wahl-d">' + esc(s1.n) + ' · ' + esc(wfrpStatusText(s1)) +
        (x.wurf[W.spezies] ? '<br><i>W100 ' + pad(x.wurf[W.spezies][0]) + (x.wurf[W.spezies][1] !== x.wurf[W.spezies][0] ? '–' + pad(x.wurf[W.spezies][1]) : '') + '</i>' : '') +
        '</div></div>';
    });
    h += '</div>';
  });
  return h;
}
function karriereDetail(k) {
  const schema = WFRP_ATTR_IDS.filter(function (a) { return k.schema[a]; })
    .sort(function (a, b) { return k.schema[a] - k.schema[b]; })
    .map(function (a) { return WFRP_ATTR_BY_ID[a].k + ' ab Stufe ' + k.schema[a]; }).join(' · ');
  let h = '<div class="card"><div class="card-hdr">' + esc(k.n) + ' <span class="card-hdr-sub">' + esc(k.en) + ' · ' +
    esc(WFRP_KLASSE_BY_ID[k.klasse].n) + '</span></div><div class="card-body"><div class="hint" style="margin:0 0 .5rem">' +
    'Steigerbare Attribute: ' + esc(schema) + '</div><div class="stufen">';
  k.stufen.forEach(function (s, i) {
    h += '<div class="stufe"><b>' + (i + 1) + '. ' + esc(s.n) + '</b> <i>' + esc(wfrpStatusText(s)) + '</i><br>' +
      '<i>Fertigkeiten:</i> ' + esc(s.fert.map(wfrpRefText).join(', ')) + '<br>' +
      '<i>Talente:</i> ' + esc(s.tal.map(wfrpRefText).join(', ')) + '<br>' +
      '<i>Ausrüstung:</i> ' + esc(s.ausr.join(', ')) + '</div>';
  });
  return h + '</div></div></div>';
}
function karriereWuerfeln() {
  aendern(function () {
    const k = wfrpKarriereAusWurf(W.spezies, wfrpW100());
    W.karrWuerfe = [k]; W.karrModus = 'erster'; karriereSetzen(k);
  });
}
/* Zwei weitere - doppelte werden neu gewuerfelt, sonst haette man
   keine echte Auswahl aus dreien. */
function karriereNachwuerfeln() {
  aendern(function () {
    let n = 0;
    while (W.karrWuerfe.length < 3 && n++ < 200) {
      const k = wfrpKarriereAusWurf(W.spezies, wfrpW100());
      if (W.karrWuerfe.indexOf(k) < 0) W.karrWuerfe.push(k);
    }

    feld('alter', 'Alter', '', 'alterWuerfeln') + feld('groesse', 'Größe', '', 'groesseWuerfeln') +
    feld('augen', 'Augen', '', 'augenWuerfeln') + feld('haare', 'Haare', '', 'haareWuerfeln') +
    feld('ambKurz', 'Kurzfristige Ambition', 'z. B. den Ruf eines Rivalen ruinieren') +
    feld('ambLang', 'Langfristige Ambition', 'z. B. ein eigenes Gasthaus besitzen') +
    '<div class="feld"><label>Hintergrund</label><textarea onchange="detail(\'hintergrund\',this.value)" placeholder="Woher kommst du, was hat dich geprägt, warum gehst du auf Reisen?">' +
    esc(W.hintergrund) + '</textarea></div></div></div>';
  return h;
}
function detail(k, v) { aendern(function () { W[k] = String(v || '').trim(); }); }
function summeW(anz, seiten) { let s = 0; for (let i = 0; i < anz; i++) s += wfrpW(seiten); return s; }
function alterWuerfeln() {
  const a = wfrpErsSpezies(W).alter;
  detail('alter', (a.basis + summeW(a.anzahl, a.seiten)) + ' Jahre');
}
/* Das Buch rechnet in Fuss und Zoll - hier steht es in Zentimetern. */
function groesseWuerfeln() {
  const g = wfrpErsSpezies(W).groesse;
  const zoll = g.zoll + summeW(g.w10, 10);
  detail('groesse', Math.round(zoll * 2.54) + ' cm');
}
function ausTab(tab) { const w = summeW(2, 10); return wfrpAusTabelle(w, tab); }
function augenWuerfeln() { detail('augen', ausTab(wfrpErsSpezies(W).augen)); }
function haareWuerfeln() { detail('haare', ausTab(wfrpErsSpezies(W).haare)); }

/* ---------------- 8 Fertig ---------------- */
function zFertig() {
  const offen = wfrpErsOffen(W);
  const alle = [];
  WFRP_ERS_SCHRITTE.forEach(function (s, i) {
    (offen[s.id] || []).forEach(function (t) { alle.push('<a href="#" onclick="geheZu(' + i + ');return false">' + esc(s.n) + '</a>: ' + esc(t)); });
  });
  const F = wfrpErsFigur(W, { spieler: spielerName() });
  const k = wfrpErsKarriere(W), sp = wfrpErsSpezies(W);
  let h = '<h2>' + esc(W.name || 'Deine Figur') + '</h2><p class="lead">' +
    (sp ? esc(sp.n) : '') + (k ? ' · ' + esc(k.stufen[0].n) + ' (' + esc(k.n) + ') · ' + esc(wfrpStatusText(k.stufen[0])) : '') + '</p>';
  h += alle.length ? '<div class="offen">Noch offen:<br>' + alle.join('<br>') + '</div>'
                   : '<div class="offen alles">Alles beisammen. Mit „Abschließen“ wird die Figur fertig und gehört ab dann deinem Heldenbrief.</div>';
  if (sp) {
    h += '<div class="card"><table><tr>' + WFRP_ATTR_IDS.map(function (a) { return '<th>' + WFRP_ATTR_BY_ID[a].k + '</th>'; }).join('') + '</tr><tr>' +
      WFRP_ATTR_IDS.map(function (a) { return '<td class="m">' + wfrpAttrWert(F, a) + '</td>'; }).join('') + '</tr></table></div>';
    h += '<div class="dv-row" style="margin-bottom:.9rem">' +
      dv('Lebenspunkte', wfrpWundenMax(F)) + dv('Bewegung', wfrpBewegung(F).bewegung) +
      dv('Schicksal', F.schicksal) + dv('Zähigkeit', F.zaehigkeit) + dv('EP', F.epGesamt) + '</div>';
    const fk = Object.keys(F.fert).filter(function (x) { return F.fert[x] > 0; });
    h += '<div class="card"><div class="card-hdr">Fertigkeiten</div><div class="card-body">' +
      fk.map(function (x) { const w = wfrpFertWert(F, x); return '<span class="tag">' + esc(wfrpKeyText(x)) + ' ' + w.wert + '</span>'; }).join('') + '</div></div>';
    h += '<div class="card"><div class="card-hdr">Talente</div><div class="card-body">' +
      Object.keys(F.tal).map(function (x) { return '<span class="tag">' + esc(wfrpKeyText(x)) + '</span>'; }).join('') + '</div></div>';
    h += '<div class="card"><div class="card-hdr">Ausrüstung · ' + esc(wfrpGeldText(F.geld)) + '</div><div class="card-body">' +
      F.ausr.map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') + '</div></div>';
  }
  h += '<div class="row"><button class="btn btn-gold" onclick="abschliessen()"' + (alle.length ? ' disabled' : '') + '>Abschließen</button>' +
    '<button class="btn" onclick="verwerfen()">Verwerfen und neu anfangen</button></div>' +
    '<p class="hint">Deine ' + F.epGesamt + ' Bonus-EP gibst du im Heldenbrief aus — auf die drei Attribute, acht Fertigkeiten ' +
    'und vier Talente deiner Karrierestufe.</p><div class="meld" id="meld"></div>';
  return h;
}
function dv(l, v) { return '<div class="dv"><div class="dv-l">' + l + '</div><div class="dv-v">' + v + '</div></div>'; }

function abschliessen() {
  if (!wfrpErsFertig(W)) return;
  if (!db || !syncBereit) { el('meld').textContent = 'Ohne Verbindung kann die Figur nicht abgeschlossen werden.'; return; }
  clearTimeout(syncTimer);
  const p = figurPaket();
  p.fertig = true;
  p.erstellt = Date.now();
  el('meld').textContent = 'Wird gespeichert …';
  db.ref('figuren/' + schluessel()).update(p).then(function () {
    try { localStorage.removeItem(cacheKey()); } catch (e) {}
    location.replace(regelwerkSeite(WFRP_REGELWERK, 'bogen') + (location.search || ''));
  }).catch(function (e) {
    el('meld').textContent = 'Ging nicht: ' + (e && e.code ? e.code : e) + ' — versuch es gleich noch einmal.';
  });
}

/* Zwei Schritte, wie in Savage Worlds: An einer Figur haengt Arbeit,
   und es gibt kein Backup. */
function verwerfen() {
  if (!confirm('Die Figur ganz verwerfen und von vorn beginnen?')) return;
  const n = W.name || 'verwerfen';
  if (prompt('Zur Sicherheit: Tippe „' + n + '“ ein.') !== n) { alert('Das stimmt nicht überein — es wurde nichts gelöscht.'); return; }
  clearTimeout(syncTimer);
  try { localStorage.removeItem(cacheKey()); } catch (e) {}
  const fertig = function () { W = wfrpErsLeer(); angefangen = false; zeichne(); };
  if (db) figurLoeschen(db, (db && db.sitzung) || SITZUNG_VORGABE, schluessel(), fertig); else fertig();
}

/* ---------------- Start ---------------- */
function ausLokal() {
  try {
    const d = JSON.parse(localStorage.getItem(cacheKey()) || 'null');
    if (d && typeof d === 'object') W = Object.assign(wfrpErsLeer(), d);
  } catch (e) {}
}

function sperre(titel, text, links) {
  el('fuss').style.display = 'none';
  el('schritte').innerHTML = '';
  el('inhalt').innerHTML = '<div class="gesperrt"><h2>' + esc(titel) + '</h2><p>' + text + '</p><div class="row" style="justify-content:center;margin-top:1rem">' +
    (links || '') + '</div></div>';
}

function start() {
  if (!hatSitzung()) {
    sitzungsSperre('Noch keine Sitzung', 'Um eine Figur zu erschaffen, musst du erst einer Sitzung beitreten. ' +
      'Die Sitzungs-ID bekommst du von deiner Spielleitung.', 'Zum Hub', 'index.html');
    return;
  }
  if (!schluessel()) {
    sitzungsSperre('Noch kein Name', 'Deine Figur hängt an deinem Namen und dieser Sitzung. ' +
      'Melde dich dafür einmal im Hub mit deinem Namen an.', 'Zum Hub', 'index.html');
    return;
  }
  ausLokal();
  angefangen = !!W.spezies;
  zeichne();
  try {
    firebase.initializeApp(firebaseConfig);
    db = sitzungsDbJetzt(firebase.database());
    syncBereit = true;
    sync('verbinde …', 'var(--gray)');
    db.ref('.info/connected').on('value', function (s) {
      if (s.val()) sync('verbunden', 'var(--teal)'); else sync('offline', 'var(--gray)');
    });
    regelwerkPruefen(db, function (rw) {
      if (regelwerkWeiter(WFRP_REGELWERK, rw, 'erschaffung')) { syncBereit = false; return; }
      db.ref('figuren/' + schluessel()).once('value').then(function (s) {
        const roh = s.val();
        if (roh && !wfrpIstWfrp(roh) && istFigurEcht(roh)) {
          syncBereit = false;
          sperre('Hier liegt schon eine Figur', 'Unter deinem Namen liegt in dieser Sitzung eine Figur nach einem anderen Regelwerk. ' +
            'Sprich mit deiner Spielleitung — sie kann sie im Regie-Hub löschen.', '<a class="btn" href="index.html" target="_top">Zum Hub</a>');
          return;
        }
        if (roh && wfrpIstWfrp(roh) && roh.fertig) {
          syncBereit = false;
          sperre('Deine Figur ist fertig', esc(roh.name || 'Deine Figur') + ' ist abgeschlossen und gehört jetzt deinem Heldenbrief. ' +
            'Dort steigerst du sie, würfelst und führst sie durch das Abenteuer.',
            '<a class="btn btn-gold" href="' + regelwerkSeite(WFRP_REGELWERK, 'bogen') + '">Zum Heldenbrief</a>');
          return;
        }
        if (roh && wfrpIstWfrp(roh) && roh.erschaffungJson) {
          try { W = Object.assign(wfrpErsLeer(), JSON.parse(roh.erschaffungJson)); angefangen = true; } catch (e) {}
        }
        ladeBereit = true;
        zeichne();
        if (angefangen) speichern();
      }).catch(function () { ladeBereit = true; });
    });
  } catch (e) {
    syncBereit = false;
    sync('nur lokal', 'var(--gray)');
    console.warn('Firebase nicht erreichbar:', e);
  }
}
start();
</script>

</html>
