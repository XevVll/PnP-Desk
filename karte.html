        const hoehe = zufall(34, 50) * groesse;             // vh
        const breite = zufall(30, 46) * groesse;            // vw
        const spurBreite = 100 / anzahl;
        const links = (slot + 0.5) * spurBreite - breite / 2 + zufall(-spurBreite * 0.35, spurBreite * 0.35);
        // Auch vertikal verteilen: gerade Ebenen oben, ungerade unten. Ohne
        // das landen bei rein zufaelliger Hoehe regelmaessig fast alle Bilder
        // in derselben Bildhaelfte und der Rest bleibt leer. Unten bleibt
        // Platz fuer den festen Schriftzug.
        const untereReihe = slot % 2 === 1;
        const bandStart = untereReihe ? 34 : 3;
        const bandEnde = Math.max(bandStart + 4, (untereReihe ? 78 : 44) - hoehe);
        const oben = zufall(bandStart, bandEnde);
        el.style.width = breite + 'vw';
        el.style.height = hoehe + 'vh';
        el.style.left = Math.max(-6, Math.min(106 - breite, links)) + 'vw';
        el.style.top = oben + 'vh';
        el.style.transform = 'rotate(' + zufall(-2.5, 2.5).toFixed(2) + 'deg)';
        el.style.zIndex = String(1 + Math.floor(Math.random() * 10));

        // Einblenden im naechsten Frame, sonst greift die Transition nicht.
        requestAnimationFrame(function () { el.classList.add('visible'); });

        const standzeit = stand * zufall(0.75, 1.25); // leicht unterschiedlich je Ebene
        abspannTimers.push(setTimeout(function () {
          el.classList.remove('visible');
          abspannTimers.push(setTimeout(zeigen, blend));
        }, blend + standzeit));
      }
      // Versetzter Start: Ebene n beginnt um n * (Standzeit / Ebenenzahl).
      abspannTimers.push(setTimeout(zeigen, slot * (stand / anzahl)));
    }

    // ==========================================================
    // KAMPF-ARENA (js/arena_scenes.js + js/arena.js)
    // Raster statt Marker-Karte. Die SL gibt reihum EINE Figur frei; solange
    // sie frei ist, darf JEDER Spieler sie bewegen und mit ihr angreifen
    // (Hendriks Vorgabe). Gerechnet wird nach dem Probensystem der Bibel,
    // die Regeln stehen in js/arena.js.
    //
    // Anders als beim Erkundungs-Graphen schreiben die Spieler hier
    // tatsaechlich den Zustand (Position, Schaden) - sonst muesste die SL
    // jeden einzelnen Schritt nachklicken, was den Sinn der Arena aufheben
    // wuerde. Die SL behaelt die Kontrolle ueber die Freigabe: ohne
    // freigegebene Figur ist gar nichts anklickbar.
    // ==========================================================
    const arenaEl = document.getElementById('arena');
    const arenaBrettEl = document.getElementById('arenaBrett');
    const arenaKopfEl = document.getElementById('arenaKopf');
    const arenaHinweisEl = document.getElementById('arenaHinweis');
    const arenaLogEl = document.getElementById('arenaLog');
    let arenaRef = null, arenaListener = null, arenaScene = null, arenaSnap = {};

    function arenaSzene(sceneId) {
      return (typeof ARENA_SCENES !== 'undefined' && ARENA_SCENES[sceneId]) ? ARENA_SCENES[sceneId] : null;
    }

    function stopArena() {
      if (arenaRef && arenaListener) arenaRef.off('value', arenaListener);
      arenaRef = null; arenaListener = null; arenaScene = null; arenaSnap = {};
      if (!arenaEl) return;
      arenaEl.classList.remove('on');
      arenaEl.setAttribute('aria-hidden', 'true');
      arenaBrettEl.innerHTML = '';
    }

    function startArena(sceneId) {
      stopArena();
      const sz = arenaSzene(sceneId);
      if (!sz || !arenaEl) return;
      arenaScene = sceneId;
      arenaEl.classList.add('on');
      arenaEl.setAttribute('aria-hidden', 'false');
      if (!db) { arenaSnap = {}; renderArena(); return; }
      arenaRef = db.ref('arenaState/' + fbKey(sceneId));
      arenaListener = arenaRef.on('value', function (snap) {
        arenaSnap = snap.val() || {};
        renderArena();
      });
    }

    function renderArena() {
      const sz = arenaSzene(arenaScene);
      if (!sz || !arenaEl) return;
      const r = sz.regeln;
      const tokens = arenaSnap.tokens || {};
      const freigegebenId = arenaSnap.freigegeben || null;
      const frei = freigegebenId ? tokens[freigegebenId] : null;

      // Brettgroesse an die Fensterhoehe binden, damit immer alles sichtbar
      // bleibt (die Arena liegt bildschirmfuellend ueber der Karte).
      // Bei 16x16 wird jedes Feld klein - deshalb so viel Hoehe wie moeglich
      // ausnutzen und Namensschilder erst ab einer lesbaren Feldgroesse
      // zeigen (sonst ueberlagern sie sich gegenseitig).
      const platz = Math.min(window.innerWidth * 0.96, window.innerHeight * 0.74);
      const feld = Math.max(18, Math.floor(platz / Math.max(r.breite, r.hoehe)));
      const namenZeigen = feld >= 44;
      arenaBrettEl.style.gridTemplateColumns = 'repeat(' + r.breite + ', ' + feld + 'px)';
      arenaBrettEl.style.gridTemplateRows = 'repeat(' + r.hoehe + ', ' + feld + 'px)';
      arenaBrettEl.style.backgroundImage = sz.hintergrund ? 'url("' + sz.hintergrund + '")' : 'none';

      arenaKopfEl.innerHTML = '<span>Runde <b>' + (arenaSnap.runde || 1) + '</b></span>' +
        '<span>Am Zug: <b>' + (frei ? (frei.name || frei.id) : '—') + '</b></span>';

      // Erreichbare Felder und angreifbare Ziele der freigegebenen Figur.
      // NUR Figuren vom Typ "spieler" sind fuer Spieler steuerbar (Hendriks
      // Vorgabe): Verbuendete und Gegner steuert ausschliesslich die SL ueber
      // arena_admin.html - deren Zuege kommen hier nur als Live-Update an.
      const spielerSteuerbar = frei && frei.typ === 'spieler';
      const erreichbar = {};
      const angreifbar = {};
      if (spielerSteuerbar && !frei.tot) {
        if (!frei.hatGezogen) {
          for (let x = 0; x < r.breite; x++) {
            for (let y = 0; y < r.hoehe; y++) {
              if (arenaBewegungErlaubt(Object.assign({ id: freigegebenId }, frei), { x: x, y: y }, r, tokens).ok) {
                erreichbar[x + ':' + y] = true;
              }
            }
          }
        }
        if (!frei.hatAngegriffen) {
          Object.keys(tokens).forEach(function (id) {
            const t = tokens[id];
            if (!t || t.tot || !arenaIstFeind(frei, t)) return;
            const art = arenaAngriffsart(frei, t, r);
            if (!art) return;
            if (art === 'fern' && !frei.geladen) return;
            angreifbar[id] = art;
          });
        }
      }

      arenaBrettEl.innerHTML = '';
      const belegung = {};
      Object.keys(tokens).forEach(function (id) {
        const t = tokens[id];
        if (t) belegung[t.x + ':' + t.y] = id;
      });

      for (let y = 0; y < r.hoehe; y++) {
        for (let x = 0; x < r.breite; x++) {
          const zelle = document.createElement('div');
          zelle.className = 'arena-feld';
          const key = x + ':' + y;
          const tokenId = belegung[key];

          if (!tokenId && erreichbar[key]) {
            zelle.classList.add('erreichbar');
            zelle.onclick = function () { arenaBewege(freigegebenId, x, y); };
          }
          if (tokenId) zelle.appendChild(arenaTokenEl(tokenId, tokens[tokenId], freigegebenId, angreifbar, namenZeigen));
          arenaBrettEl.appendChild(zelle);
        }
      }

      if (!frei) arenaHinweisEl.textContent = 'Die Spielleitung gibt gleich die nächste Figur frei.';
      else if (!spielerSteuerbar) arenaHinweisEl.textContent = (frei.name || frei.id) + ' handelt …';
      else if (frei.tot) arenaHinweisEl.textContent = (frei.name || frei.id) + ' ist am Boden.';
      else {
        const teile = [];
        if (!frei.hatGezogen) teile.push('Feld anklicken zum Bewegen (' + (frei.bewegung || r.bewegung) + ')');
        if (!frei.hatAngegriffen && Object.keys(angreifbar).length) teile.push('Gegner anklicken zum Angreifen');
        if (!frei.geladen) teile.push('Waffe ist leer — lädt bis zur nächsten Runde');
        arenaHinweisEl.textContent = teile.length ? teile.join(' · ') : 'Nichts mehr zu tun in dieser Runde.';
      }

      const log = arenaSnap.log || {};
      const zeilen = Object.keys(log).map(function (k) { return log[k]; })
        .sort(function (a, b) { return (b.zeit || 0) - (a.zeit || 0); }).slice(0, 6);
      arenaLogEl.innerHTML = zeilen.map(function (z) { return '<div>' + z.text + '</div>'; }).join('');
    }

    function arenaTokenEl(id, t, freigegebenId, angreifbar, namenZeigen) {
      const el = document.createElement('div');
      el.className = 'arena-token' + (id === freigegebenId ? ' frei' : '') + (t.tot ? ' tot' : '');
      el.style.color = t.farbe || '#c9a24b';
      // Hat die Figur ein eigenes Bild (t.bild), fuellt das den Token aus -
      // sonst wie bisher das Symbol. Das Bild wird VOR dem Namensschild
      // eingehaengt, damit der Name weiterhin darueber liegt.
      if (t.bild) {
        const bildEl = document.createElement('img');
        bildEl.className = 'arena-token-bild';
        bildEl.src = t.bild;
        bildEl.alt = '';
        el.appendChild(bildEl);
      } else {
        el.textContent = t.symbol || '?';
      }

      // Beschriftet werden IMMER: die Helden-Seite (Spieler + Verbuendete,
      // Hendriks Vorgabe - man muss sehen, wer wer ist) und die gerade
      // freigegebene Figur. Gegner (austauschbare "Diener") nur bei grossen
      // Feldern, sonst als Tooltip - ihre Schilder wuerden bei 16x16 nur
      // uebereinanderliegen.
      const heldenSeite = (typeof arenaSeite === 'function') && arenaSeite(t) === 'helden';
      if (t.name && (namenZeigen || heldenSeite || id === freigegebenId)) {
        const name = document.createElement('span');
        name.className = 'arena-name';
        name.textContent = t.name;
        el.appendChild(name);
      } else if (t.name) {
        el.title = t.name; // bei kleinen Feldern nur als Tooltip
      }

      if (!t.tot) {
        const bar = document.createElement('div');
        bar.className = 'arena-hp';
        const i = document.createElement('i');
        const anteil = Math.max(0, Math.min(1, (t.hp || 0) / (t.hpMax || 1)));
        i.style.width = (anteil * 100) + '%';
        if (anteil <= 0.34) i.className = 'wenig';
        bar.appendChild(i);
        el.appendChild(bar);
        // Nur bei Figuren mit Fernkampf ist "leer" ueberhaupt eine Aussage.
        if (!t.geladen && (t.fernWert || 0) > 0) {
          const leer = document.createElement('span');
          leer.className = 'arena-leer';
          leer.textContent = 'leer';
          el.appendChild(leer);
        }
      }

      if (angreifbar[id]) {
        el.classList.add('angreifbar');
        el.title = angreifbar[id] === 'nah' ? 'Nahkampf' : 'Fernkampf';
        el.onclick = function (ev) { ev.stopPropagation(); arenaGreifeAn(freigegebenId, id); };
      }
      return el;
    }

    function arenaSchreibe(aenderungen, logText) {
      if (!db || !arenaScene) return;
      const basis = 'arenaState/' + fbKey(arenaScene) + '/';
      const paket = {};
      Object.keys(aenderungen).forEach(function (p) { paket[basis + p] = aenderungen[p]; });
      if (logText) {
        paket[basis + 'log/' + db.ref().push().key] = { text: logText, zeit: Date.now() };
      }
      // Ein einziges update() - sonst feuert der Live-Listener mehrfach auf
      // halben Zwischenstaenden (gleiche Begruendung wie beim Erkundungs-Graphen).
      db.ref().update(paket);
    }

    function arenaBewege(id, x, y) {
      const sz = arenaSzene(arenaScene); if (!sz) return;
      const tokens = arenaSnap.tokens || {};
      const t = tokens[id]; if (!t) return;
      const pruef = arenaBewegungErlaubt(Object.assign({ id: id }, t), { x: x, y: y }, sz.regeln, tokens);
      if (!pruef.ok) return;
      arenaSchreibe({
        ['tokens/' + id + '/x']: x,
        ['tokens/' + id + '/y']: y,
        ['tokens/' + id + '/hatGezogen']: true
      }, (t.name || id) + ' bewegt sich.');
    }

    function arenaGreifeAn(angreiferId, zielId) {
      const sz = arenaSzene(arenaScene); if (!sz) return;
      const tokens = arenaSnap.tokens || {};
      const a = Object.assign({ id: angreiferId }, tokens[angreiferId] || {});
      const z = Object.assign({ id: zielId }, tokens[zielId] || {});
      if (!a.typ || !z.typ) return;
      const erg = arenaAngriff(a, z, tokens, sz.regeln, arenaSnap.saebeltraeger || null);
      if (!erg.ok) return;

      const aenderungen = { ['tokens/' + angreiferId + '/hatAngegriffen']: true };
      if (erg.entlaedt) {
        aenderungen['tokens/' + angreiferId + '/geladen'] = false;
        aenderungen['tokens/' + angreiferId + '/entladenSeitRunde'] = arenaSnap.runde || 1;
      }
      if (erg.endgueltig) {
        aenderungen['tokens/' + zielId] = null; // verschwindet ganz
      } else {
        aenderungen['tokens/' + zielId + '/hp'] = erg.zielHpNeu;
        if (erg.toetet) {
          aenderungen['tokens/' + zielId + '/tot'] = true;
          aenderungen['tokens/' + zielId + '/totSeitRunde'] = arenaSnap.runde || 1;
        }
      }

      // Der Saebel wird im Text bewusst nie erwaehnt - die Spieler sollen
      // nicht am Log ablesen koennen, wer ihn traegt (Hendriks Vorgabe).
      let text = (a.name || angreiferId) + (erg.art === 'nah' ? ' greift an' : ' schießt') +
        ' auf ' + (z.name || zielId) + ': ' + erg.wurf + ' → ' + arenaBandName(erg.band);
      if (erg.bedraengnis > 0) text += ' (bedrängt, −' + erg.bedraengnis + ')';
      text += erg.schaden > 0 ? ', ' + erg.schaden + ' Schaden' : ', kein Schaden';
      if (erg.endgueltig) text += ' — zerfällt zu Staub.';
      else if (erg.toetet) text += ' — geht zu Boden.';
      arenaSchreibe(aenderungen, text);
    }

    function arenaBandName(b) {
      return b === 'gut' ? 'guter Erfolg' : b === 'normal' ? 'Erfolg'
        : b === 'schlecht' ? 'schlechter Erfolg' : 'Misserfolg';
    }

    window.addEventListener('resize', function () { if (arenaScene) renderArena(); });

    function renderScene(sceneId) {
      if (sceneId === currentRenderedScene) return; // nichts geändert, kein Neu-Rendern nötig
      currentRenderedScene = sceneId;

      // Arena-Szene? Wie beim Abspann: keine Karte, keine Marker.
      if (arenaSzene(sceneId)) {
        clearOpenMarker();
        clearMarkers();
        currentSceneRawMarkers = [];
        clearErkundungOverlay();
        stopSlideshow();
        attachGraphStateListener(null);
        startArena(sceneId);
        return;
      }
      stopArena();

      // Abspann-Szene? Dann keine Karte, keine Marker, keine Erkundung -
      // nur die Bildfolge. Beim Verlassen wird sauber aufgeraeumt.
      const sceneMeta = findSceneMeta(sceneId);
      const rohSzene = sceneMeta && sceneMeta.raw ? sceneMeta.raw : null;
      const abspannScene = (rohSzene && (rohSzene.abspann === true || rohSzene.slideshow)) ? rohSzene : null;
      if (abspannScene) {
        clearOpenMarker();
        clearMarkers();          // sonst blieben die Marker der Vorszene im DOM liegen
        currentSceneRawMarkers = [];
        clearErkundungOverlay();
        attachGraphStateListener(null);
        startSlideshow(abspannScene);
        return;
      }
      stopSlideshow();
      // Szene wechselt - ein evtl. offenes Overlay bezieht sich sonst auf
      // einen Ort in der ALTEN Szene, dessen Präsenz-Eintrag sonst dort
      // hängen bliebe, bis die Verbindung getrennt wird.
      clearOpenMarker();
      attachGraphStateListener(sceneId);

      const background = getBackgroundForScene(sceneId);
      const markers = getMarkersForScene(sceneId);
      currentSceneRawMarkers = markers;

      if (!background) {
        // Unbekannte Szene - Kartendaten fehlen (z.B. Tippfehler in
        // Firebase oder eine Karte, deren Datei noch nicht eingebunden ist)
        mapImageEl.classList.remove('loaded');
        clearMarkers();
        showEmptyState('Für diese Szene liegt noch keine Karte vor.');
        return;
      }
      hideEmptyState();

      // Sanftes Überblenden: erst ausblenden, dann neues Bild laden
      mapImageEl.classList.remove('loaded');
      const nextImg = new Image();
      nextImg.onload = function () {
        mapImageEl.src = background;
        mapImageEl.classList.add('loaded');
        attachHiddenMarkersListener(sceneId);
        renderFogOfWar(); // erst jetzt hat #mapWrap seine endgueltige Groesse
      };
      nextImg.onerror = function () {
        showEmptyState('Kartenbild "' + background + '" konnte nicht geladen werden.');
      };
      nextImg.src = background;
    }

    function clearMarkers() {
      mapWrapEl.querySelectorAll('.marker').forEach(function (el) { el.remove(); });
    }

    function renderMarkers(markers) {
      clearMarkers();
      markers
        // Sub-Orte (parentId gesetzt) erscheinen nicht auf der Hauptkarte,
        // sondern nur als Hotspots im Overlay ihres Eltern-Markers (siehe
        // renderSubMarkers) - reduziert auf die Elternebene, kein Nest-Konzept.
        .filter(function (marker) { return !currentHiddenMarkerIds[marker.id] && !marker.parentId; })
        .forEach(function (marker) {
          const el = document.createElement('div');
          el.className = 'marker';
          el.style.top = marker.top + '%';
          el.style.left = marker.left + '%';
          el.innerHTML = '<div class="pin"></div><div class="label">' + marker.title + '</div>';
          el.onclick = function () { openOverlay(marker); };
          mapWrapEl.appendChild(el);
        });
    }

    // ---------- Live-Sichtbarkeit: welche Marker der SL gerade ausgeblendet hat ----------
    // Standardmäßig sind alle Marker einer Szene sichtbar. Setzt der SL im
    // Admin-Panel (regie.html) hiddenMarkersLive/{szene}/{markerId} = true,
    // verschwindet der Marker live bei allen Spielern, ohne Szenenwechsel
    // oder Codedeploy - ermöglicht schrittweises Aufdecken neuer Orte
    // innerhalb derselben Szene (siehe KAMPAGNEN-BIBEL 13.x).
    let currentSceneRawMarkers = [];
    let hiddenMarkersLiveRef = null;
    let hiddenMarkersLiveListener = null;
    let currentHiddenMarkerIds = {};

    function attachHiddenMarkersListener(sceneId) {
      if (hiddenMarkersLiveRef && hiddenMarkersLiveListener) {
        hiddenMarkersLiveRef.off('value', hiddenMarkersLiveListener);
      }
      currentHiddenMarkerIds = {};
      if (!db || !sceneId) { renderMarkers(currentSceneRawMarkers); return; }
      hiddenMarkersLiveRef = db.ref('hiddenMarkersLive/' + fbKey(sceneId));
      hiddenMarkersLiveListener = hiddenMarkersLiveRef.on('value', function (snap) {
        currentHiddenMarkerIds = snap.val() || {};
        renderMarkers(currentSceneRawMarkers);
        if (currentOverlayMarker) { clearSubMarkers(); renderSubMarkers(currentOverlayMarker); }
      }, function () {
        currentHiddenMarkerIds = {};
        renderMarkers(currentSceneRawMarkers);
        if (currentOverlayMarker) { clearSubMarkers(); renderSubMarkers(currentOverlayMarker); }
      });
    }

    // Liefert per Callback die aktive Variante (das ganze Objekt, nicht
    // nur das Bild) für einen Marker: null, falls der Marker keine
    // "variants" definiert, keine Firebase-Verbindung besteht, oder in
    // Firebase noch nichts gesetzt ist (markerVariant/<id>) - in all
    // diesen Fällen greifen die Basiswerte des Markers (img/desc)
    // unverändert wie bisher.
    function resolveActiveVariant(marker, callback) {
      if (!marker.variants || !db) { callback(null); return; }
      db.ref('markerVariant/' + fbKey(marker.id)).once('value').then(function (snap) {
        const activeKey = snap.val();
        callback(activeKey && marker.variants[activeKey] || null);
      }).catch(function () {
        callback(null);
      });
    }

    // ---------- Sub-Orte: Hotspots innerhalb eines Overlay-Bildes ----------
    // Sub-Orte sind normale Marker mit parentId - dieselbe flache Liste wie
    // currentSceneRawMarkers, nur mit Klick-Ziel "im Overlay" statt "auf der
    // Hauptkarte". Ermöglicht z.B. ein Dorfbild mit mehreren anklickbaren
    // Stellen (Dorfplatz/Markt/Heilerin/Tempel), ohne ein neues Nest-Konzept
    // im Datenmodell - ORTE/Vault-Baum/Export funktionieren dadurch bereits
    // unverändert, weil beide ohnehin flach über Marker-IDs iterieren.
    function clearSubMarkers() {
      overlayImgWrap.querySelectorAll('.sub-marker').forEach(function (el) { el.remove(); });
    }
    // Klick auf einen Sub-Ort-Pin öffnet KEIN neues Voll-Overlay (kein
    // Bildwechsel) - stattdessen ein kleiner Text-Callout direkt am Pin,
    // über demselben Bild. Nur ein Callout gleichzeitig offen: ein neuer
    // Klick schließt den vorherigen automatisch.
    function toggleSubMarkerCallout(pinEl) {
      const wasOpen = pinEl.classList.contains('open');
      overlayImgWrap.querySelectorAll('.sub-marker.open').forEach(function (el) { el.classList.remove('open'); });
      if (!wasOpen) pinEl.classList.add('open');
    }
    function renderSubMarkers(marker) {
      const children = currentSceneRawMarkers.filter(function (m) { return m.parentId === marker.id && !currentHiddenMarkerIds[m.id]; });
      children.forEach(function (child) {
        const el = document.createElement('div');
        // Pins nahe am Rand: Callout würde sonst vom umgebenden Bild
        // abgeschnitten - Öffnungsrichtung umkehren statt immer zentriert
        // nach oben (siehe .edge-*-Klassen im CSS).
        let cls = 'sub-marker';
        if (child.top < 45) cls += ' edge-bottom';
        if (child.left < 20) cls += ' edge-left';
        else if (child.left > 80) cls += ' edge-right';
        el.className = cls;
        el.style.top = child.top + '%';
        el.style.left = child.left + '%';
        el.innerHTML = '<div class="pin"></div><div class="label">' + child.title + '</div>' +
          '<div class="sub-marker-callout">' +
          '<button class="smc-close" aria-label="Schließen">✕</button>' +
          '<div class="smc-title">' + child.title + '</div>' +
          '<div class="smc-desc">' + (child.desc || '') + '</div>' +
          '</div>';
        el.querySelector('.pin').onclick = function (e) { e.stopPropagation(); toggleSubMarkerCallout(el); };
        el.querySelector('.smc-close').onclick = function (e) { e.stopPropagation(); el.classList.remove('open'); };
        overlayImgWrap.appendChild(el);
      });
    }

    /* ---------- Der Laden am Ort ----------
       Gekauft wird NICHT direkt in die Figur geschrieben, sondern in ihr
       Postfach figuren/{k}/zuteilung gelegt. Grund: heldenbrief.html liest
       die Figur genau einmal und schreibt danach seine eigene Fassung hoch,
       samt ausr und muenzen - ein Schreibzugriff von hier waere beim
       naechsten Klick des Spielers lautlos weg. Der Bogen verbucht den Kauf,
       prueft dabei das Geld und raeumt das Postfach.
       Dass der Bogen dafuer laufen muss, ist der Grund, warum sein Rahmen
       weiter unten im Voraus geladen wird. */
    /* ---------- Rueckmeldung zum Kauf ----------
       Ein Kauf schreibt NICHT in die Figur, sondern ins Postfach; verbucht
       wird er vom Heldenbrief, der als einziger auf der Figur schreibt.
       Sichtbar war davon nichts: Der Klick tat scheinbar gar nichts, und
       der Bogen mit der Bestaetigung steht zugeklappt hinter der Karte.

       Deshalb drei Zustaende statt keinem - und der mittlere ist ehrlich:
       "wird verbucht" ist genau das, was in dem Moment stimmt. Gemeldet
       wird der Erfolg erst, wenn die Ware wirklich in der Figur steht. */
    let kaufOffen = {};        // Postfach-Schluessel -> was wir erwarten
    let kaufMeld = null;       // { text, art } - wird im Laden gezeichnet

    function zaehleGetragen(id) {
      return ((meineFigur && meineFigur.ausr) || []).filter(function (x) { return x === id; }).length;
    }

    function kaufSagen(text, art) {
      kaufMeld = { text: text, art: art };
      clearTimeout(kaufSagen._t);
      // Die gute Nachricht darf gehen, die Frage nach dem Geld bleibt stehen.
      if (art === 'gut') kaufSagen._t = setTimeout(function () {
        kaufMeld = null;
        if (currentOverlayMarker) zeichneLaden(currentOverlayMarker);
      }, 6000);
      if (currentOverlayMarker) zeichneLaden(currentOverlayMarker);
    }

    /* Laeuft bei jeder Aenderung an der Figur: Steht die erwartete Ware
       jetzt darin, ist der Kauf verbucht. Ueber die GETRAGENE Ware statt
       ueber das Geld, weil eine Uebergabe der Spielleitung im selben
       Moment ebenfalls Muenzen bewegen kann. */
    function kaufPruefen() {
      Object.keys(kaufOffen).forEach(function (key) {
        const o = kaufOffen[key];
        if (zaehleGetragen(o.id) <= o.vorher) return;
        clearTimeout(o.frist);
        delete kaufOffen[key];
        kaufSagen('Gekauft: ' + o.name + ' (−' + o.preis + ' M.)', 'gut');
      });
    }

    function kaufen(id) {
      const k = figurSchluessel();
      if (!k || !db || !meineFigur) return;
      const a = (typeof AUSR_BY_ID !== 'undefined') ? AUSR_BY_ID[id] : null;
      if (!a) return;
      /* Der Laden sieht einen Geldstand, der eine Sekunde alt sein kann -
         massgeblich prueft der Bogen. Hier wird trotzdem geprueft, damit
         es eine Antwort gibt statt eines Klicks, der nichts tut. */
      if ((meineFigur.muenzen || 0) < (a.preis || 0)) {
        kaufSagen('Dafür reicht dein Geld nicht: ' + a.n + ' kostet ' + a.preis +
                  ' M., du hast ' + (meineFigur.muenzen || 0) + '.', 'schlecht');
        return;
      }
      const ref = db.ref('figuren/' + k + '/zuteilung').push({
        art: 'kauf', id: id, von: 'Laden', ts: Date.now()
      });
      kaufOffen[ref.key] = {
        id: id, name: a.n, preis: a.preis || 0, vorher: zaehleGetragen(id),
        /* Bleibt es liegen, muss das jemand sagen. Haeufigster Grund: der
           Bogen ist nicht erreichbar, dann verbucht niemand. */
        frist: setTimeout(function () {
          if (!kaufOffen[ref.key]) return;
          delete kaufOffen[ref.key];
          kaufSagen(a.n + ' wurde nicht verbucht. Schlag deinen Heldenbrief auf — ' +
                    'dort wird gekauft, und er muss dafür offen gewesen sein.', 'schlecht');
        }, 8000)
      };
      kaufSagen(a.n + ' — wird verbucht …', 'warte');
      ref.catch(function () {
        clearTimeout(kaufOffen[ref.key] && kaufOffen[ref.key].frist);
        delete kaufOffen[ref.key];
        kaufSagen('Keine Verbindung — der Kauf ist nicht angekommen.', 'schlecht');
      });
    }

    /* Welche Schublade offen ist, liegt nur im Speicher dieser Seite - das
       ist Ansichtssache dieses Spielers, nicht Spielstand. Beim Wechsel des
       Orts wird zurueckgesetzt: Man kommt an einen neuen Laden und steht
       wieder davor, nicht vor den Schubladen des letzten. */
    let ladenFaecherOffen = {};
    let ladenFuerMarker = null;

    function zeichneLaden(marker) {
      const box = document.getElementById('ladenBox');
      if (!box) return;
      const l = marker && marker.laden;
      if (!l || typeof AUSR_BY_ID === 'undefined') { box.style.display = 'none'; return; }
      box.style.display = '';
      if (ladenFuerMarker !== (marker.id || null)) {
        ladenFaecherOffen = {};
        ladenFuerMarker = marker.id || null;
      }

      if (!meineFigur) {
        box.innerHTML = '<h3>' + escHtml(l.name || 'Laden') + '</h3>' +
          '<div class="was">' + escHtml(l.was || '') + '</div>' +
          '<div class="hinw">Du hast noch keine Figur — erst erschaffen, dann einkaufen.</div>';
        return;
      }

      const geld = meineFigur.muenzen || 0;
      let h = '<h3>' + escHtml(l.name || 'Laden') + '</h3>' +
        '<div class="was">' + escHtml(l.was || '') + '</div>' +
        '<div class="geld">Du hast <b>' + geld + '</b> Münzen.</div>' +
        (kaufMeld ? '<div class="kaufmeld ' + kaufMeld.art + '">' +
                    escHtml(kaufMeld.text) + '</div>' : '');

      function wareZeile(a) {
        const zuTeuer = geld < (a.preis || 0);
        const werte = [];
        if (a.schaden) werte.push('Schaden ' + DLBL[a.schaden]);
        if (a.ruest) werte.push('Rob. +' + a.ruest);
        werte.push(a.gew + ' Gew.');
        werte.push(a.preis + ' M.');
        return '<div class="ware"><div class="n">' + escHtml(a.n) +
          '<small>' + escHtml(a.d) + '</small></div>' +
          '<div class="w">' + werte.join(' · ') + '</div>' +
          '<button data-kauf="' + escHtml(a.id) + '"' +
          (zuTeuer ? ' disabled title="zu teuer"' : '') + '>Kaufen</button></div>';
      }

      h += (l.gruppen || []).map(function (g, i) {
        const waren = (g.waren || []).map(function (id) { return AUSR_BY_ID[id]; })
                                     .filter(function (a) { return !!a; });
        if (!waren.length) return '';
        const offen = !!ladenFaecherOffen[i];
        /* Bezahlbares zaehlen statt nur Stueckzahl: Vor einer zugezogenen
           Schublade will man wissen, ob sich das Aufziehen lohnt. */
        const kannIch = waren.filter(function (a) { return geld >= (a.preis || 0); }).length;
        return '<div class="fach' + (offen ? '' : ' zu') + '">' +
          '<button class="kopf" data-fach="' + i + '" aria-expanded="' + (offen ? 'true' : 'false') + '">' +
          '<span class="pfeil">' + (offen ? '▾' : '▸') + '</span>' +
          '<span class="t">' + escHtml(g.n || 'Fach') +
          (g.d ? '<small>' + escHtml(g.d) + '</small>' : '') + '</span>' +
          '<span class="z">' + waren.length + ' Stück' +
          (kannIch < waren.length ? ' · ' + kannIch + ' bezahlbar' : '') + '</span>' +
          '</button>' +
          '<div class="inhalt">' + waren.map(wareZeile).join('') + '</div></div>';
      }).join('');

      h += '<div class="hinw">Gekauftes landet in deinem Heldenbrief. ' +
        'Ablegen und verkaufen geht dort, nicht hier.</div>';
      box.innerHTML = h;
    }

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    document.addEventListener('click', function (ev) {
      if (!ev.target.closest) return;
      const fach = ev.target.closest('[data-fach]');
      if (fach) {
        const i = fach.dataset.fach;
        ladenFaecherOffen[i] = !ladenFaecherOffen[i];
        if (currentOverlayMarker) zeichneLaden(currentOverlayMarker);
        return;
      }
      const t = ev.target.closest('[data-kauf]');
      if (t && !t.disabled) kaufen(t.dataset.kauf);
    });

    let currentOverlayMarker = null;
    function openOverlay(marker) {
      overlayTitle.textContent = marker.title || '';
      overlayEl.classList.add('open');
      currentOverlayMarker = marker;
      setOpenMarker(currentRenderedScene, marker.id);

      resolveActiveVariant(marker, function (variant) {
        // Eine Variante kann "img" und/oder "desc" überschreiben. Fehlt
        // eines der beiden Felder bei der aktiven Variante (oder gibt es
        // gar keine aktive Variante), wird auf den Basiswert des Markers
        // zurückgefallen - siehe golden_lion_scenes.js für ein Beispiel
        // (Frachtraum: "standard" hat einen Zusatzsatz, "leer" nicht).
        const imgSrc = (variant && variant.img) || marker.img;
        const descText = (variant && variant.desc) || marker.desc || '';

        overlayDesc.textContent = descText;
        zeichneLaden(marker);
        clearSubMarkers();

        if (imgSrc) {
          overlayImgWrap.classList.remove('empty');
          overlayImg.style.display = '';
          overlayImg.src = imgSrc;
          overlayImg.alt = marker.title || '';
          renderSubMarkers(marker);
        } else {
          overlayImgWrap.classList.add('empty');
          overlayImg.style.display = 'none';
          overlayImgWrap.textContent = 'Kein Bild hinterlegt.';
        }
      });
    }

    function closeOverlay() {
      overlayEl.classList.remove('open');
      currentOverlayMarker = null;
      clearOpenMarker();
    }
    document.getElementById('overlayClose').onclick = closeOverlay;
    overlayEl.addEventListener('click', function (e) {
      if (e.target === overlayEl) closeOverlay();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeOverlay();
    });

    let emptyStateEl = null;
    function showEmptyState(text) {
      if (!emptyStateEl) {
        emptyStateEl = document.createElement('div');
        emptyStateEl.className = 'empty-state';
        document.getElementById('stage').appendChild(emptyStateEl);
      }
      emptyStateEl.textContent = text;
      emptyStateEl.style.display = 'block';
    }
    function hideEmptyState() {
      if (emptyStateEl) emptyStateEl.style.display = 'none';
    }

    // ==========================================================
    // AUDIO: eigene Audiodatei pro Szene, per <audio>-Element
    // ==========================================================
    const bgAudio = document.getElementById('bgAudio');
    let currentAudioFile = null; // aktuell geladene Datei (Dateiname)
    let pendingAudioFile = undefined; // Szene kam, bevor das erste Mal reagiert werden konnte

    // Lautstärke/Stumm-Zustand pro Browser merken
    let savedVolume = parseInt(localStorage.getItem('korsaren_volume'), 10);
    if (isNaN(savedVolume)) savedVolume = 50;
    let isMuted = localStorage.getItem('korsaren_muted') !== 'false'; // Default: stumm, bis der Spieler selbst aktiviert

    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    volumeSlider.value = savedVolume;
    updateMuteBtnIcon();

    function updateMuteBtnIcon() {
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    }

    // Sanftes Ueberblenden beim Musikwechsel (statt hartem Schnitt) - die SL
    // wechselt jetzt auch mitten in einer laufenden Szene, siehe
    // attachSceneAudioListener(). Ein laufender Fade steuert die Lautstaerke
    // selbst; applyAudioState() darf ihm dann nicht dazwischenfunken.
    const AUDIO_FADE_MS = 1200;
    let audioFadeTimer = null;
    let audioSwapToken = 0; // siehe syncAudioForScene(): schuetzt vor verspaeteten play()-Promises

    function cancelAudioFade() {
      if (audioFadeTimer) { clearInterval(audioFadeTimer); audioFadeTimer = null; }
    }

    function clampVol(v) { return Math.max(0, Math.min(1, v)); }

    // Bewusst ZEITBASIERT (Date.now()) statt fester Schrittzahl: Browser
    // drosseln setInterval in nicht sichtbaren Tabs auf ca. 1x pro Sekunde.
    // Mit gezaehlten Schritten haette ein Fade dort ein Vielfaches gedauert
    // und der Titelwechsel waere erst viel spaeter angekommen - bei einem
    // Spieler mit der Karte im Hintergrund-Tab also faktisch kaputt. So
    // laeuft der Fade notfalls in wenigen groben Spruengen ab, ist aber nach
    // AUDIO_FADE_MS Wandzeit sicher fertig.
    function runAudioFade(from, to, done) {
      cancelAudioFade();
      const startedAt = Date.now();
      bgAudio.volume = clampVol(from);
      audioFadeTimer = setInterval(function () {
        const t = Math.min(1, (Date.now() - startedAt) / AUDIO_FADE_MS);
        bgAudio.volume = clampVol(from + (to - from) * t);
        if (t >= 1) {
          cancelAudioFade();
          bgAudio.volume = clampVol(to);
          if (done) done();
        }
      }, 40);
    }

    function applyAudioState() {
      if (!audioFadeTimer) bgAudio.volume = savedVolume / 100;
      bgAudio.muted = isMuted;
      // Manche Browser pausieren <audio>, wenn es (noch) stummgeschaltet
      // erstellt wurde - sicherheitshalber erneut abspielen versuchen.
      if (currentAudioFile && bgAudio.paused) {
        bgAudio.play().catch(function () { /* Autoplay evtl. weiterhin blockiert, ignorieren */ });
      }
    }

    muteBtn.addEventListener('click', function () {
      isMuted = !isMuted;
      localStorage.setItem('korsaren_muted', isMuted ? 'true' : 'false');
      updateMuteBtnIcon();
      applyAudioState();
    });
    volumeSlider.addEventListener('input', function (e) {
      savedVolume = parseInt(e.target.value, 10);
      localStorage.setItem('korsaren_volume', String(savedVolume));
      if (savedVolume > 0 && isMuted) {
        isMuted = false;
        localStorage.setItem('korsaren_muted', 'false');
        updateMuteBtnIcon();
      }
      applyAudioState();
    });

    // ---------- Charakter-Drawer ----------
    // Eigenständige Seite im iframe statt inline eingebettet - vermeidet
    // CSS-Konflikte (die Datei definiert eigene :root-Variablen mit
    // denselben Namen wie hier, z.B. --gold/--line, aber anderen Werten).
    // iframe-src wird erst beim ersten Öffnen gesetzt (lazy), damit die
    // Seite nicht bei jedem Kartenaufruf mitgeladen wird.
    //
    // Zeigt den Heldenbrief - das ist das Blatt, das man am Tisch braucht
    // (Wunden, Bennies, Wuerfeln). Die Erschaffung ist von dort aus einen
    // Klick entfernt und gehoert nicht ins Fach neben der Karte.
    (function () {
      const handle = document.getElementById('charSheetHandle');
      const backdrop = document.getElementById('charSheetBackdrop');
      const drawer = document.getElementById('charSheetDrawer');
      const iframe = document.getElementById('charSheetFrame');
      let loaded = false;

      /* Der Bogen wird im Voraus geladen, nicht erst beim Aufklappen.
         Er ist der einzige Schreiber auf der Figur und verbucht damit die
         Kaeufe aus dem Laden am Ort - laege er bis zum ersten Aufklappen
         brach, bliebe ein Kauf einfach liegen, ohne dass jemand sieht warum.
         Kostet eine zusaetzliche Seitenladung je Spieler. */
      function bogenLaden() { if (!loaded) { iframe.src = 'heldenbrief.html'; loaded = true; } }
      setTimeout(bogenLaden, 1200);   // erst die Karte, dann der Bogen

      function openDrawer() {
        bogenLaden();
        drawer.classList.add('open');
        backdrop.classList.add('open');
      }
      function closeDrawer() {
        drawer.classList.remove('open');
        backdrop.classList.remove('open');
      }
      window.toggleCharSheetDrawer = function () {
        if (drawer.classList.contains('open')) closeDrawer(); else openDrawer();
      };
      window.closeCharSheetDrawer = closeDrawer;
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeDrawer();
      });
    })();

    // Browser blockieren Autoplay MIT Ton grundsätzlich - das lässt sich
    // nicht umgehen. Um es so nah wie möglich an "startet direkt mit Ton"
    // heranzubringen: der allererste Klick/Tap irgendwo auf der Seite
    // schaltet automatisch frei, nicht erst ein gezielter Klick auf den
    // Lautsprecher-Button. Da Spieler ohnehin schnell auf einen Marker
    // klicken, fühlt sich das in der Praxis fast nahtlos an.
    // Wurde der Ton beim letzten Besuch bewusst stummgeschaltet
    // (localStorage), respektieren wir das und schalten NICHT automatisch frei.
    const wasExplicitlyMuted = localStorage.getItem('korsaren_muted') === 'true';
    if (!wasExplicitlyMuted) {
      const unlockOnFirstInteraction = function () {
        if (!isMuted) return;
        isMuted = false;
        localStorage.setItem('korsaren_muted', 'false');
        updateMuteBtnIcon();
        applyAudioState();
      };
      document.addEventListener('click', unlockOnFirstInteraction, { once: true });
      document.addEventListener('touchstart', unlockOnFirstInteraction, { once: true });
      document.addEventListener('keydown', unlockOnFirstInteraction, { once: true });
    }

    // Erwartet den Dateinamen der Audiodatei (oder null) - wird vom
    // Live-Listener attachSceneAudioListener() aufgerufen, sowohl beim
    // Szenenwechsel als auch wenn die SL mitten in der Szene einen anderen
    // Ton setzt. Laeuft schon etwas, wird ueberblendet statt hart geschnitten.
    function syncAudioForScene(audioFile) {
      if (audioFile === currentAudioFile) return; // schon richtig, nichts zu tun
      const wasPlaying = !!bgAudio.getAttribute('src') && !bgAudio.paused;
      currentAudioFile = audioFile;

      // Jeder Wechsel bekommt eine Nummer. Grund: bgAudio.play() liefert ein
      // Promise, das oft erst NACH dem naechsten Wechsel aufloest. Ohne diese
      // Pruefung startete der alte Titel dann seinen Einblend-Fade, loeschte
      // damit den laufenden Ausblend-Fade des neuen Wechsels UND dessen
      // Callback - der Titelwechsel fiel still unter den Tisch. Genau der
      // Fall, wenn die SL zuegig hintereinander umschaltet.
      const myToken = ++audioSwapToken;

      function startNewTrack() {
        if (myToken !== audioSwapToken) return; // laengst ueberholt
        if (!audioFile) {
          cancelAudioFade();
          bgAudio.pause();
          bgAudio.removeAttribute('src');
          bgAudio.volume = savedVolume / 100;
          return;
        }
        bgAudio.src = 'audio/' + audioFile;
        bgAudio.muted = isMuted;
        const target = savedVolume / 100;
        const playPromise = bgAudio.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.then(function () {
            if (myToken !== audioSwapToken) return; // inzwischen weitergeschaltet
            runAudioFade(0, target); // sanft einblenden
          }).catch(function () {
            if (myToken !== audioSwapToken) return;
            // Blockiertes Autoplay ist normal, solange isMuted=true nichts
            // Falsches signalisiert - sobald freigeschaltet wird, greift
            // applyAudioState() erneut und startet die Wiedergabe.
            cancelAudioFade();
            bgAudio.volume = target;
          });
        } else {
          cancelAudioFade();
          bgAudio.volume = target;
        }
      }

      if (wasPlaying) runAudioFade(bgAudio.volume, 0, startNewTrack);
      else startNewTrack();
    }

    // ==========================================================
    // CHARAKTERLEISTE: welche Portraits sind in der aktuellen Szene aktiv
    // ==========================================================
    const charRailEl = document.getElementById('charRail');
    let charRailRef = null;      // aktuell aktiver Firebase-Ref (zum sauberen Abhängen)
    let charRailListener = null; // zugehöriger on('value')-Handler

    function renderCharacterRail(sceneId) {
      // Alten Live-Listener abhängen, falls Szene sich ändert - sonst
      // würden mehrere Listener gleichzeitig laufen und sich überlagern.
      if (charRailRef && charRailListener) {
        charRailRef.off('value', charRailListener);
      }
      charRailEl.innerHTML = '';

      if (typeof CHARACTERS === 'undefined' || !db) return;

      charRailRef = db.ref('sceneCharacters/' + fbKey(sceneId));
      charRailListener = charRailRef.on('value', function (snap) {
        const active = snap.val() || {};
        const activeChars = CHARACTERS.filter(function (ch) { return !!active[ch.id]; });

        charRailEl.innerHTML = '';
        activeChars.forEach(function (ch) {
          const card = document.createElement('div');
          card.className = 'char-card';
          card.innerHTML =
            '<img src="' + ch.img + '" alt="' + ch.name + '">' +
            '<div class="char-name">' + ch.name + '</div>';
          charRailEl.appendChild(card);
        });
      }, function () {
        charRailEl.innerHTML = '';
      });
    }

    /* ---------- Die Spieler links ----------
       Horcht auf pcLeiste, NICHT auf figuren: Dort stehen nur Name und
       Bild. Auf "figuren" zu horchen hiesse, jedem Spieler bei jeder
       Aenderung an irgendeiner Figur deren Steckbrief, Notizen und
       Ausruestung mitzuschicken - viel Datenverkehr fuer zwei Felder.

       Einmal eingehaengt und nie wieder abgehaengt: Die Leiste haengt
       nicht an der Szene (siehe Kommentar am Stil). */
    const pcRailEl = document.getElementById('pcRail');

    /* Wie viele Spieler hat diese Runde? Der Streifen oben haelt
       hoechstens so viele Ergebnisse. Gezaehlt wird JEDER Eintrag der
       Leiste, auch wer kein Bild hochgeladen hat - er wuerfelt ja
       trotzdem. Ohne jeden Eintrag bleibt es bei vier: eine Grenze von
       null hiesse, es stuende nie etwas da. */
    let pcAnzahl = 0;
    function wurfBandGrenze() { return Math.max(1, pcAnzahl || 4); }
    /* Wie lange ein Ergebnis oben stehen bleibt, bevor es ausblendet.
       Lang genug, um es vorzulesen und darueber zu reden; kurz genug,
       dass der Streifen zwischen zwei Szenen wieder leer ist. Eine
       Zahl an EINER Stelle, damit sie sich am Tisch nachstellen
       laesst. */
    const WB_STANDZEIT_MS = 12000;
    const WB_BLASS_MS = 900;

    function renderPcRail(stand) {
      pcAnzahl = Object.keys(stand || {}).length;
      if (!pcRailEl) return;
      const leute = Object.keys(stand || {}).map(function (pid) {
        const v = stand[pid] || {};
        return { pid: pid, name: v.name || '', bild: v.bild || '', aus: !!v.aus };
      }).filter(function (p) {
        // Ohne Bild gibt es nichts zu zeigen, und "aus" ist die
        // Entscheidung der Spielleitung.
        return p.bild && !p.aus;
      }).sort(function (a, b) {
        // Feste Reihenfolge, damit die Leiste nicht bei jeder Aenderung
        // springt - die Reihenfolge von Object.keys ist keine Zusage.
        return a.pid < b.pid ? -1 : (a.pid > b.pid ? 1 : 0);
      });

      pcRailEl.innerHTML = '';
      leute.forEach(function (p) {
        const card = document.createElement('div');
        card.className = 'char-card';
        /* Der Schluessel am Knoten: Kommt ein Wurf herein, wird darueber
           die richtige Karte gefunden. */
        card.dataset.pid = p.pid;
        const img = document.createElement('img');
        img.src = p.bild;
        img.alt = p.name || 'Spielerfigur';
        card.appendChild(img);
        if (p.name) {
          const n = document.createElement('div');
          n.className = 'char-name';
          // textContent, nicht innerHTML: Der Name kommt von einem
          // Spieler, nicht aus dem Code.
          n.textContent = p.name;
          card.appendChild(n);
        }
        pcRailEl.appendChild(card);
      });
    }

    /* ---------- Der Würfel rollt im Porträt ----------
       Ein Wurf trägt den SPIELERnamen ("Peter"), die Leiste den
       FIGURENnamen ("Kai") - verbunden werden sie über denselben
       Schlüssel, unter dem auch die Figur liegt:
       spielerKennung(Spielername). Ohne das läge die Zuordnung nur
       am Zufall gleicher Schreibweise. */
    function wuerfelAnzeige(roll) {
      // Eine Probe: Zahl gross, Band klein darunter.
      if (roll.probe && roll.band) {
        const gut = roll.band.indexOf('Erfolg') === 0;
        return { zahl: roll.ergebnis, text: roll.probe + ' — ' + roll.band,
                 klasse: gut ? 'gut' : 'schlecht' };
      }
      // Ein angeforderter Schadenswurf hat ein probe, aber kein band.
      if (roll.probe === 'Schaden') {
        return { zahl: roll.total, text: 'Schaden', klasse: '' };
      }
      // Freier Würfel.
      return { zahl: roll.total, text: (roll.count || 1) + '×d' + roll.sides, klasse: '' };
    }

    /* Welche Wuerfelform gehoert zu diesem Wurf? Seit dem 17.10.2026
       traegt jeder Wurf seine Groesse mit (seiten bei Probe und
       Schaden, sides beim freien Wuerfel). Ist keine dabei - ein alter
       Eintrag aus dem Feed -, wird der W6 genommen; eine Form muss es
       geben, sonst stuende dort ein Loch. */
    function wuerfelForm(roll) {
      const s = roll.seiten || roll.sides || 6;
      return (typeof DICE_FORMEN !== 'undefined' && DICE_FORMEN[s]) ? s : 6;
    }

    /* ---------- Der Würfelweg ----------
       Was hinter einem Ergebnis steckt: welcher Würfel fiel, ob er
       explodierte, ob der Wild Die gezählt hat. Alles rechnet
       js/regelwerk.js ohnehin aus; der Wurf trägt es seit heute als
       Feld `weg` mit. Ein alter Eintrag ohne das Feld sagt das
       ehrlich, statt etwas zu erfinden. */
    function wegKette(teile, seiten) {
      const t = (teile || []).map(Number);
      if (!t.length) return 'd' + seiten + ': –';
      const summe = t.reduce(function (a, b) { return a + b; }, 0);
      const kette = t.length > 1 ? t.join(' + ') + ' = ' + summe : String(summe);
      return 'd' + seiten + ': ' + kette +
        (t.length > 1 ? '  — explodiert bei ' + seiten : '');
    }

    function wurfWegZeilen(roll) {
      const z = [];
      const w = roll.weg;

      if (w && w.art === 'probe') {
        z.push({ t: 'Wert ' + wegKette(w.wert, w.wertSeiten), aus: w.zaehlt !== 'wert' });
        if (w.wild && w.wildSeiten) {
          /* "immer d6" steht fest da und nicht nur im Tooltip: Die
             Verwechslung mit dem eigenen Wert passiert genau beim
             Lesen des Ergebnisses. (Bibel 4.3.) */
          z.push({ t: 'Wild Die (immer d' + w.wildSeiten + ') ' +
                      wegKette(w.wild, w.wildSeiten), aus: w.zaehlt !== 'wild' });
        } else {
          z.push({ t: 'Kein Wild Die — nur Heldenfiguren haben einen.', aus: true });
        }
        if (w.mod) {
          z.push({ t: 'Erschwernis ' + (w.mod > 0 ? '+' : '') + w.mod +
                      ' — nötig war ' + w.ziel + ' statt 4.', aus: true });
        }
        let schluss = roll.band || '';
        if (w.steigerungen > 0) {
          schluss += ' — ' + (w.steigerungen > 1 ? w.steigerungen + ' Steigerungen' :
            'Steigerung') + ' (nötig war ' + w.zielSteigerung + ')';
        } else if (roll.band) {
          schluss += ' (nötig war ' + w.ziel + ')';
        }
        return { zeilen: z, schluss: schluss };
      }

      if (w && w.art === 'schaden') {
        (w.teile || []).forEach(function (t) {
          z.push({ t: (t.was || 'Würfel') + ' ' + wegKette(
            t.kette ? String(t.kette).split('+') : [t.summe], t.seiten), aus: false });
        });
        return { zeilen: z, schluss: 'Schaden gesamt: ' + roll.total +
          ' — kein Wild Die, Schadenswürfel sind keine Probe.' };
      }

      /* Freier Würfel: Er trägt seine Ketten schon lange mit. */
      if (roll.sides) {
        const k = roll.ketten || [];
        if (k.length) {
          k.forEach(function (eintrag, i) {
            z.push({ t: 'Würfel ' + (i + 1) + ' — d' + roll.sides + ': ' +
              String(eintrag).split('+').join(' + ') +
              (String(eintrag).indexOf('+') >= 0 ?
                '  — explodiert bei ' + roll.sides : ''), aus: false });
          });
        } else {
          z.push({ t: (roll.count || 1) + '×d' + roll.sides, aus: false });
        }
        return { zeilen: z, schluss: 'Summe: ' + roll.total };
      }

      return { zeilen: [{ t: 'Zu diesem Wurf liegt kein Weg vor.', aus: true }],
               schluss: '' };
    }

    let wegOffen = null;   // der Eintrag, dessen Weg gerade aufliegt

    function wurfWegZu() {
      const p = document.getElementById('wurfWeg');
      if (p) { p.hidden = true; p.innerHTML = ''; }
      if (wegOffen) {
        wegOffen.className = wegOffen.className.replace(' wb-offen', '');
        /* Die Standzeit laeuft erst jetzt weiter - solange jemand
           liest, soll ihm der Eintrag nicht unter den Augen
           ausblenden. */
        wurfBandStandzeit(wegOffen);
        wegOffen = null;
      }
    }

    function wurfWegAuf(e, roll) {
      const p = document.getElementById('wurfWeg');
      if (!p) return;
      if (wegOffen === e) { wurfWegZu(); return; }   // zweiter Klick schliesst
      wurfWegZu();

      const a = wurfWegAnzeige(roll);
      p.innerHTML = '';
      const kopf = document.createElement('div');
      kopf.className = 'ww-kopf';
      kopf.textContent = ((roll.figur || '').trim() || roll.name || '') +
        ' · ' + (roll.probe || ((roll.count || 1) + '×d' + roll.sides));
      p.appendChild(kopf);
      a.zeilen.forEach(function (zl) {
        const r = document.createElement('div');
        r.className = 'ww-zeile' + (zl.aus ? ' aus' : ' ww-zaehlt');
        r.textContent = zl.t;
        p.appendChild(r);
      });
      if (a.schluss) {
        const s = document.createElement('div');
        s.className = 'ww-schluss';
        s.textContent = a.schluss;
        p.appendChild(s);
      }
      p.hidden = false;

      e.className += ' wb-offen';
      wegOffen = e;
      // Solange der Weg aufliegt, blendet der Eintrag nicht aus.
      if (e._wbTimer) { clearTimeout(e._wbTimer); e._wbTimer = null; }
    }

    function wurfWegAnzeige(roll) { return wurfWegZeilen(roll); }

    /* Ein Klick irgendwo sonst schliesst - und Escape, fuer die
       Tastatur. */
    document.addEventListener('click', function (ev) {
      if (!wegOffen) return;
      const p = document.getElementById('wurfWeg');
      if (ev.target && (wegOffen.contains && wegOffen.contains(ev.target))) return;
      if (p && p.contains && p.contains(ev.target)) return;
      wurfWegZu();
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && wegOffen) wurfWegZu();
    });

    /* Die Standzeit eines Eintrags - an EINER Stelle, weil sie an drei
       gebraucht wird: beim Anlegen, nach dem Schliessen des Wegs und
       nirgends sonst. */
    function wurfBandStandzeit(e) {
      if (e._wbTimer) clearTimeout(e._wbTimer);
      e._wbTimer = setTimeout(function () {
        if (wegOffen === e) return;   // wer liest, verliert ihn nicht
        e.className += ' wb-blass';
        setTimeout(function () { e.remove(); }, WB_BLASS_MS);
      }, WB_STANDZEIT_MS);
    }

    /* Ein Ergebnis in den Streifen oben. Faellt der aelteste heraus,
       wird er SICHTBAR verdraengt (nach links hinaus) statt einfach zu
       verschwinden - sonst merkt niemand, dass etwas weg ist. */
    function wurfBandEintrag(roll) {
      const band = document.getElementById('wurfBand');
      if (!band) return;
      const a = wuerfelAnzeige(roll);

      const e = document.createElement('div');
      e.className = 'wb-wurf' + (a.klasse ? ' ' + a.klasse : '');
      const wer = document.createElement('div');
      wer.className = 'wb-wer';
      // Von einem Spieler, nicht aus dem Code - niemals als HTML.
      wer.textContent = (roll.figur || '').trim() || roll.name || '';
      const z = document.createElement('div');
      z.className = 'wb-zahl';
      z.textContent = (a.zahl === undefined || a.zahl === null) ? '?' : String(a.zahl);
      const was = document.createElement('div');
      was.className = 'wb-was';
      was.textContent = a.text || '';
      e.appendChild(wer); e.appendChild(z); e.appendChild(was);
      band.appendChild(e);

      /* Anklickbar: Der Klick zeigt den WEG des Wurfs. Mit Tastatur
         ebenso - auf dem Tablet am Tisch gibt es kein Hovern, und ein
         Knopf, der nur auf die Maus hoert, ist dort unerreichbar. */
      e.tabIndex = 0;
      e.setAttribute('role', 'button');
      e.title = 'Zeigt, wie dieses Ergebnis zustande kam';
      e.addEventListener('click', function () { wurfWegAuf(e, roll); });
      e.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault(); wurfWegAuf(e, roll);
        }
      });

      /* Nach der Standzeit von selbst ausblenden. Der Timer haengt AM
         EINTRAG, nicht in einer Liste daneben: Wird er vorher
         verdraengt, laesst er sich dort wieder abraeumen. */
      wurfBandStandzeit(e);

      /* Ueberzaehlige hinausschieben. Gezaehlt werden nur die, die
         nicht ohnehin schon gehen - sonst wuerde derselbe Eintrag bei
         jedem Wurf erneut verdraengt. */
      /* Wer schon geht - verdraengt ODER ausblendend -, zaehlt nicht
         mehr mit. Sonst wuerfe ein neuer Wurf Eintraege hinaus, die
         ohnehin gerade verschwinden. */
      const bleiben = [].slice.call(band.children).filter(function (k) {
        return k.className.indexOf('wb-weg') < 0 &&
               k.className.indexOf('wb-blass') < 0;
      });
      let zuviel = bleiben.length - wurfBandGrenze();
      for (let i = 0; i < zuviel; i++) {
        const alt = bleiben[i];
        // Er geht jetzt zur Seite - die Standzeit braucht er nicht mehr.
        if (alt._wbTimer) { clearTimeout(alt._wbTimer); alt._wbTimer = null; }
        // Lag sein Weg offen, geht der mit: ein Weg ohne Eintrag waere
        // eine Anzeige, zu der nichts mehr dasteht.
        if (wegOffen === alt) wurfWegZu();
        alt.className += ' wb-weg';
        /* Erst nach der Bewegung aus dem DOM - wer sofort entfernt,
           sieht keine Verdraengung, sondern ein Springen. */
        setTimeout(function () { alt.remove(); }, 340);
      }
    }

    function wuerfelImPortraet(roll) {
      if (!roll || !roll.name) return;
      /* Wer kein Bild hochgeladen hat, hat keine Karte - aber sein
         Ergebnis gehoert trotzdem in den Streifen. Deshalb bricht das
         Fehlen einer Karte hier NICHT mehr ab; es laesst nur die
         Animation aus. (Vorher ging so ein Wurf fuer die Anzeige
         verloren.) */
      const card = (pcRailEl && typeof spielerKennung === 'function')
        ? pcRailEl.querySelector('[data-pid="' + spielerKennung(roll.name) + '"]')
        : null;

      if (!card) {
        setTimeout(function () { wurfBandEintrag(roll); }, DICE_ANIM_MS);
        return;
      }

      // Läuft schon eine, wird sie ersetzt: Zwei Würfe kurz
      // hintereinander sollen nicht übereinanderliegen.
      const alt = card.querySelector('.wuerfel-ani');
      if (alt) alt.remove();
      if (card._waTimer) { clearTimeout(card._waTimer); card._waTimer = null; }
      if (card._waWeg) { clearTimeout(card._waWeg); card._waWeg = null; }

      const box = document.createElement('div');
      box.className = 'wuerfel-ani';
      const w = document.createElement('div');
      w.className = 'wa-wuerfel';
      const seiten = wuerfelForm(roll);
      /* Der echte Koerper: Tetraeder, Wuerfel, Oktaeder, Trapezoeder
         oder Dodekaeder, aus js/dice3d.js. Jede Flaeche liegt als
         eigene Ebene im Raum - kein Stapel flacher Kopien.
         Die Zahl steht DAVOR, nicht darauf: Bei 56 px waere eine
         mitgedrehte Ziffer auf einer Flaeche nicht zu lesen. */
      w.innerHTML = '<div class="wa-koerper">' + dice3dMarkup(seiten, 64) + '</div>' +
        '<div class="wa-zahl">?</div>';
      const zahl = w.querySelector('.wa-zahl');
      const t = document.createElement('div');
      t.className = 'wa-text';
      t.textContent = 'würfelt …';
      box.appendChild(w); box.appendChild(t);
      card.appendChild(box);

      // Während des Rollens wechselt die Zahl - sonst sieht es aus wie
      // ein Ladebalken, nicht wie ein Würfel.
      /* Geflackert wird im Zahlenraum DIESES Wuerfels - ein d4, der
         beim Rollen eine 11 zeigt, waere Unsinn. */
      const flackern = setInterval(function () {
        if (zahl) zahl.textContent = String(1 + Math.floor(Math.random() * seiten));
      }, 90);

      card._waTimer = setTimeout(function () {
        clearInterval(flackern);
        const a = wuerfelAnzeige(roll);
        if (zahl) zahl.textContent = (a.zahl === undefined || a.zahl === null) ? '?' : String(a.zahl);
        t.textContent = a.text || '';
        box.className = 'wuerfel-ani fertig' + (a.klasse ? ' ' + a.klasse : '');
        /* Im selben Augenblick oben in den Streifen - das Portraet
           sagt WER, der Streifen behaelt WAS. */
        wurfBandEintrag(roll);
        // Danach wieder abräumen, sonst klebt das Ergebnis den ganzen
        // Abend über dem Gesicht.
        card._waWeg = setTimeout(function () { box.remove(); }, 4000);
      }, DICE_ANIM_MS);
    }

    function attachWuerfelAni() {
      if (!db || !pcRailEl) return;
      db.ref('diceRolls').on('child_added', function (snap) {
        const roll = snap.val();
        if (!roll) return;
        /* Nur FRISCHE Würfe. Beim Laden der Seite reicht Firebase alle
           Einträge der letzten 90 Sekunden nach - ohne diese Schranke
           ruckelte beim Betreten der Karte die halbe Leiste los. */
        if (!roll.ts || (Date.now() - roll.ts) > 6000) return;
        wuerfelImPortraet(roll);
      }, function () { /* kein Feed, keine Animation */ });
    }

    function attachPcRail() {
      if (!db || !pcRailEl) return;
      db.ref('pcLeiste').on('value', function (snap) {
        renderPcRail(snap.val() || {});
      }, function () {
        pcRailEl.innerHTML = '';
      });
    }

    // ==========================================================
    // FIREBASE: live, ohne dass Spieler aktualisieren müssen
    // ==========================================================
    let db = null;
    // Die Vorschau der Spielleitung (regie.html laedt diese Seite als
    // ?preview=1) umgeht die Sperren bewusst: Sie schaut in ihre eigene
    // Sitzung, auch wenn die noch gar nicht gestartet ist.
    const istVorschau = /[?&]preview=1/.test(location.search);
    /* Gekapselt, weil hier mit "return" abgebrochen wird: Dieser
       <script>-Block laeuft auf oberster Ebene, und dort ist return im
       Browser ein Syntaxfehler, der die GANZE Datei lahmlegt - die Karte
       verbindet dann gar nicht mehr. "db" bleibt bewusst draussen, es
       wird weiter unten noch gebraucht. */
    (function verbinde() {
    try {
      if (!istVorschau && !hatSitzung()) {
        sitzungsSperre('Noch keine Sitzung',
          'Du bist noch in keiner Sitzung. Die Sitzungs-ID bekommst du von deiner Spielleitung.',
          'Zum Hub', 'index.html');
        return;
      }
      firebase.initializeApp(firebaseConfig);
      db = sitzungsDbJetzt(firebase.database());
      // Die Karte oeffnet erst, wenn die Spielleitung gestartet hat -
      // vorher gaebe es nichts zu sehen, und die Szene stuende auf dem
      // Stand einer fremden Runde.
      if (!istVorschau) {
        let gesperrt = false;
        beobachteFreigabe(db, function (frei) {
          if (frei) { if (gesperrt) location.reload(); return; }
          if (gesperrt) return;
          gesperrt = true;
          sitzungsSperre('Die Sitzung läuft noch nicht',
            'Deine Spielleitung hat die Sitzung noch nicht gestartet. ' +
            'Sobald es losgeht, öffnet sich die Karte von selbst.',
            'Zum Hub', 'index.html');
        });
      }
      wuerfelLeiste = initDiceRoller(db, {
        // Die Ergebnisse stehen oben mittig (#wurfBand) und im
        // Portraet - der Feed oben links waere die dritte Stelle.
        ohneFeed: true,
        holeFigur:   function () { return meineFigur; },
        holeKontext: function () { return { szene: aktuelleSzene, ort: aktuellerOrt }; }
      });
      beobachteEigeneWaren();
      beobachteFigur();
      attachPcRail();
      attachWuerfelAni();

      db.ref('currentScene').on('value', function (snapshot) {
        const sceneId = snapshot.val() || getFallbackDefaultScene();
        aktuelleSzene = sceneId;
        if (wuerfelLeiste) wuerfelLeiste.neuZeichnen();
        statusEl.textContent = 'Verbunden';
        statusEl.className = 'connected';
        setTimeout(function () { statusEl.classList.add('hidden'); }, 1200);
        renderScene(sceneId);
        attachSceneAudioListener(sceneId);
        renderCharacterRail(sceneId);
      }, function (err) {
        statusEl.textContent = 'Verbindungsfehler: ' + err.message;
        statusEl.className = 'error';
      });
    } catch (e) {
      statusEl.textContent = 'Firebase-Konfiguration fehlt oder ist fehlerhaft.';
      statusEl.className = 'error';
      renderScene(getFallbackDefaultScene());
      attachSceneAudioListener(getFallbackDefaultScene());
      renderCharacterRail(getFallbackDefaultScene());
    }
    })();
  </script>
