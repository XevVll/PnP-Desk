    // "variants" definiert, keine Firebase-Verbindung besteht, oder in
    // Firebase noch nichts gesetzt ist (markerVariant/<id>) - in all
    // diesen Fällen greifen die Basiswerte des Markers (img/desc)
    // unverändert wie bisher.
    function resolveActiveVariant(marker, callback) {
      if (!marker.variants || !db) { callback(null); return; }
      db.ref('markerVariant/' + fbKey(marker.id)).once('value').then(function (snap) {
        const activeKey = snap.val();
        callback(activeKey && marker.variants[activeKey] || null);
      }).catch(function () {
        callback(null);
      });
    }

    // ---------- Sub-Orte: Hotspots innerhalb eines Overlay-Bildes ----------
    // Sub-Orte sind normale Marker mit parentId - dieselbe flache Liste wie
    // currentSceneRawMarkers, nur mit Klick-Ziel "im Overlay" statt "auf der
    // Hauptkarte". Ermöglicht z.B. ein Dorfbild mit mehreren anklickbaren
    // Stellen (Dorfplatz/Markt/Heilerin/Tempel), ohne ein neues Nest-Konzept
    // im Datenmodell - ORTE/Vault-Baum/Export funktionieren dadurch bereits
    // unverändert, weil beide ohnehin flach über Marker-IDs iterieren.
    function clearSubMarkers() {
      overlayImgWrap.querySelectorAll('.sub-marker').forEach(function (el) { el.remove(); });
    }
    // Klick auf einen Sub-Ort-Pin öffnet KEIN neues Voll-Overlay (kein
    // Bildwechsel) - stattdessen ein kleiner Text-Callout direkt am Pin,
    // über demselben Bild. Nur ein Callout gleichzeitig offen: ein neuer
    // Klick schließt den vorherigen automatisch.
    function toggleSubMarkerCallout(pinEl) {
      const wasOpen = pinEl.classList.contains('open');
      overlayImgWrap.querySelectorAll('.sub-marker.open').forEach(function (el) { el.classList.remove('open'); });
      if (!wasOpen) pinEl.classList.add('open');
    }
    function renderSubMarkers(marker) {
      const children = currentSceneRawMarkers.filter(function (m) { return m.parentId === marker.id && !currentHiddenMarkerIds[m.id]; });
      children.forEach(function (child) {
        const el = document.createElement('div');
        // Pins nahe am Rand: Callout würde sonst vom umgebenden Bild
        // abgeschnitten - Öffnungsrichtung umkehren statt immer zentriert
        // nach oben (siehe .edge-*-Klassen im CSS).
        let cls = 'sub-marker';
        if (child.top < 45) cls += ' edge-bottom';
        if (child.left < 20) cls += ' edge-left';
        else if (child.left > 80) cls += ' edge-right';
        el.className = cls;
        el.style.top = child.top + '%';
        el.style.left = child.left + '%';
        el.innerHTML = '<div class="pin"></div><div class="label">' + child.title + '</div>' +
          '<div class="sub-marker-callout">' +
          '<button class="smc-close" aria-label="Schließen">✕</button>' +
          '<div class="smc-title">' + child.title + '</div>' +
          '<div class="smc-desc">' + (child.desc || '') + '</div>' +
          '</div>';
        el.querySelector('.pin').onclick = function (e) { e.stopPropagation(); toggleSubMarkerCallout(el); };
        el.querySelector('.smc-close').onclick = function (e) { e.stopPropagation(); el.classList.remove('open'); };
        overlayImgWrap.appendChild(el);
      });
    }

    let currentOverlayMarker = null;
    function openOverlay(marker) {
      overlayTitle.textContent = marker.title || '';
      overlayEl.classList.add('open');
      currentOverlayMarker = marker;
      setOpenMarker(currentRenderedScene, marker.id);

      resolveActiveVariant(marker, function (variant) {
        // Eine Variante kann "img" und/oder "desc" überschreiben. Fehlt
        // eines der beiden Felder bei der aktiven Variante (oder gibt es
        // gar keine aktive Variante), wird auf den Basiswert des Markers
        // zurückgefallen - siehe golden_lion_scenes.js für ein Beispiel
        // (Frachtraum: "standard" hat einen Zusatzsatz, "leer" nicht).
        const imgSrc = (variant && variant.img) || marker.img;
        const descText = (variant && variant.desc) || marker.desc || '';

        overlayDesc.textContent = descText;
        clearSubMarkers();

        if (imgSrc) {
          overlayImgWrap.classList.remove('empty');
          overlayImg.style.display = '';
          overlayImg.src = imgSrc;
          overlayImg.alt = marker.title || '';
          renderSubMarkers(marker);
        } else {
          overlayImgWrap.classList.add('empty');
          overlayImg.style.display = 'none';
          overlayImgWrap.textContent = 'Kein Bild hinterlegt.';
        }
      });
    }

    function closeOverlay() {
      overlayEl.classList.remove('open');
      currentOverlayMarker = null;
      clearOpenMarker();
    }
    document.getElementById('overlayClose').onclick = closeOverlay;
    overlayEl.addEventListener('click', function (e) {
      if (e.target === overlayEl) closeOverlay();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeOverlay();
    });

    let emptyStateEl = null;
    function showEmptyState(text) {
      if (!emptyStateEl) {
        emptyStateEl = document.createElement('div');
        emptyStateEl.className = 'empty-state';
        document.getElementById('stage').appendChild(emptyStateEl);
      }
      emptyStateEl.textContent = text;
      emptyStateEl.style.display = 'block';
    }
    function hideEmptyState() {
      if (emptyStateEl) emptyStateEl.style.display = 'none';
    }

    // ==========================================================
    // AUDIO: eigene Audiodatei pro Szene, per <audio>-Element
    // ==========================================================
    const bgAudio = document.getElementById('bgAudio');
    let currentAudioFile = null; // aktuell geladene Datei (Dateiname)
    let pendingAudioFile = undefined; // Szene kam, bevor das erste Mal reagiert werden konnte

    // Lautstärke/Stumm-Zustand pro Browser merken
    let savedVolume = parseInt(localStorage.getItem('korsaren_volume'), 10);
    if (isNaN(savedVolume)) savedVolume = 50;
    let isMuted = localStorage.getItem('korsaren_muted') !== 'false'; // Default: stumm, bis der Spieler selbst aktiviert

    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    volumeSlider.value = savedVolume;
    updateMuteBtnIcon();

    function updateMuteBtnIcon() {
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    }

    // Sanftes Ueberblenden beim Musikwechsel (statt hartem Schnitt) - die SL
    // wechselt jetzt auch mitten in einer laufenden Szene, siehe
    // attachSceneAudioListener(). Ein laufender Fade steuert die Lautstaerke
    // selbst; applyAudioState() darf ihm dann nicht dazwischenfunken.
    const AUDIO_FADE_MS = 1200;
    let audioFadeTimer = null;
    let audioSwapToken = 0; // siehe syncAudioForScene(): schuetzt vor verspaeteten play()-Promises

    function cancelAudioFade() {
      if (audioFadeTimer) { clearInterval(audioFadeTimer); audioFadeTimer = null; }
    }

    function clampVol(v) { return Math.max(0, Math.min(1, v)); }

    // Bewusst ZEITBASIERT (Date.now()) statt fester Schrittzahl: Browser
    // drosseln setInterval in nicht sichtbaren Tabs auf ca. 1x pro Sekunde.
    // Mit gezaehlten Schritten haette ein Fade dort ein Vielfaches gedauert
    // und der Titelwechsel waere erst viel spaeter angekommen - bei einem
    // Spieler mit der Karte im Hintergrund-Tab also faktisch kaputt. So
    // laeuft der Fade notfalls in wenigen groben Spruengen ab, ist aber nach
    // AUDIO_FADE_MS Wandzeit sicher fertig.
    function runAudioFade(from, to, done) {
      cancelAudioFade();
      const startedAt = Date.now();
      bgAudio.volume = clampVol(from);
      audioFadeTimer = setInterval(function () {
        const t = Math.min(1, (Date.now() - startedAt) / AUDIO_FADE_MS);
        bgAudio.volume = clampVol(from + (to - from) * t);
        if (t >= 1) {
          cancelAudioFade();
          bgAudio.volume = clampVol(to);
          if (done) done();
        }
      }, 40);
    }

    function applyAudioState() {
      if (!audioFadeTimer) bgAudio.volume = savedVolume / 100;
      bgAudio.muted = isMuted;
      // Manche Browser pausieren <audio>, wenn es (noch) stummgeschaltet
      // erstellt wurde - sicherheitshalber erneut abspielen versuchen.
      if (currentAudioFile && bgAudio.paused) {
        bgAudio.play().catch(function () { /* Autoplay evtl. weiterhin blockiert, ignorieren */ });
      }
    }

    muteBtn.addEventListener('click', function () {
      isMuted = !isMuted;
      localStorage.setItem('korsaren_muted', isMuted ? 'true' : 'false');
      updateMuteBtnIcon();
      applyAudioState();
    });
    volumeSlider.addEventListener('input', function (e) {
      savedVolume = parseInt(e.target.value, 10);
      localStorage.setItem('korsaren_volume', String(savedVolume));
      if (savedVolume > 0 && isMuted) {
        isMuted = false;
        localStorage.setItem('korsaren_muted', 'false');
        updateMuteBtnIcon();
      }
      applyAudioState();
    });

    // ---------- Charakterbogen-Drawer ----------
    // Eigenständige Seite (charakterbogen.html) im iframe statt inline
    // eingebettet - vermeidet CSS-Konflikte (die Datei definiert eigene
    // :root-Variablen mit denselben Namen wie hier, z.B. --gold/--line,
    // aber anderen Werten). iframe-src wird erst beim ersten Öffnen
    // gesetzt (lazy), damit die Seite nicht bei jedem Kartenaufruf
    // mitgeladen wird, auch wenn niemand den Bogen öffnet.
    (function () {
      const handle = document.getElementById('charSheetHandle');
      const backdrop = document.getElementById('charSheetBackdrop');
      const drawer = document.getElementById('charSheetDrawer');
      const iframe = document.getElementById('charSheetFrame');
      let loaded = false;

      function openDrawer() {
        if (!loaded) { iframe.src = 'charakterbogen.html'; loaded = true; }
        drawer.classList.add('open');
        backdrop.classList.add('open');
      }
      function closeDrawer() {
        drawer.classList.remove('open');
        backdrop.classList.remove('open');
      }
      window.toggleCharSheetDrawer = function () {
        if (drawer.classList.contains('open')) closeDrawer(); else openDrawer();
      };
      window.closeCharSheetDrawer = closeDrawer;
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeDrawer();
      });
    })();

    // Browser blockieren Autoplay MIT Ton grundsätzlich - das lässt sich
    // nicht umgehen. Um es so nah wie möglich an "startet direkt mit Ton"
    // heranzubringen: der allererste Klick/Tap irgendwo auf der Seite
    // schaltet automatisch frei, nicht erst ein gezielter Klick auf den
    // Lautsprecher-Button. Da Spieler ohnehin schnell auf einen Marker
    // klicken, fühlt sich das in der Praxis fast nahtlos an.
    // Wurde der Ton beim letzten Besuch bewusst stummgeschaltet
    // (localStorage), respektieren wir das und schalten NICHT automatisch frei.
    const wasExplicitlyMuted = localStorage.getItem('korsaren_muted') === 'true';
    if (!wasExplicitlyMuted) {
      const unlockOnFirstInteraction = function () {
        if (!isMuted) return;
        isMuted = false;
        localStorage.setItem('korsaren_muted', 'false');
        updateMuteBtnIcon();
        applyAudioState();
      };
      document.addEventListener('click', unlockOnFirstInteraction, { once: true });
      document.addEventListener('touchstart', unlockOnFirstInteraction, { once: true });
      document.addEventListener('keydown', unlockOnFirstInteraction, { once: true });
    }

    // Erwartet den Dateinamen der Audiodatei (oder null) - wird vom
    // Live-Listener attachSceneAudioListener() aufgerufen, sowohl beim
    // Szenenwechsel als auch wenn die SL mitten in der Szene einen anderen
    // Ton setzt. Laeuft schon etwas, wird ueberblendet statt hart geschnitten.
    function syncAudioForScene(audioFile) {
      if (audioFile === currentAudioFile) return; // schon richtig, nichts zu tun
      const wasPlaying = !!bgAudio.getAttribute('src') && !bgAudio.paused;
      currentAudioFile = audioFile;

      // Jeder Wechsel bekommt eine Nummer. Grund: bgAudio.play() liefert ein
      // Promise, das oft erst NACH dem naechsten Wechsel aufloest. Ohne diese
      // Pruefung startete der alte Titel dann seinen Einblend-Fade, loeschte
      // damit den laufenden Ausblend-Fade des neuen Wechsels UND dessen
      // Callback - der Titelwechsel fiel still unter den Tisch. Genau der
      // Fall, wenn die SL zuegig hintereinander umschaltet.
      const myToken = ++audioSwapToken;

      function startNewTrack() {
        if (myToken !== audioSwapToken) return; // laengst ueberholt
        if (!audioFile) {
          cancelAudioFade();
          bgAudio.pause();
          bgAudio.removeAttribute('src');
          bgAudio.volume = savedVolume / 100;
          return;
        }
        bgAudio.src = 'audio/' + audioFile;
        bgAudio.muted = isMuted;
        const target = savedVolume / 100;
        const playPromise = bgAudio.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.then(function () {
            if (myToken !== audioSwapToken) return; // inzwischen weitergeschaltet
            runAudioFade(0, target); // sanft einblenden
          }).catch(function () {
            if (myToken !== audioSwapToken) return;
            // Blockiertes Autoplay ist normal, solange isMuted=true nichts
            // Falsches signalisiert - sobald freigeschaltet wird, greift
            // applyAudioState() erneut und startet die Wiedergabe.
            cancelAudioFade();
            bgAudio.volume = target;
          });
        } else {
          cancelAudioFade();
          bgAudio.volume = target;
        }
      }

      if (wasPlaying) runAudioFade(bgAudio.volume, 0, startNewTrack);
      else startNewTrack();
    }

    // ==========================================================
    // CHARAKTERLEISTE: welche Portraits sind in der aktuellen Szene aktiv
    // ==========================================================
    const charRailEl = document.getElementById('charRail');
    let charRailRef = null;      // aktuell aktiver Firebase-Ref (zum sauberen Abhängen)
    let charRailListener = null; // zugehöriger on('value')-Handler

    function renderCharacterRail(sceneId) {
      // Alten Live-Listener abhängen, falls Szene sich ändert - sonst
      // würden mehrere Listener gleichzeitig laufen und sich überlagern.
      if (charRailRef && charRailListener) {
        charRailRef.off('value', charRailListener);
      }
      charRailEl.innerHTML = '';

      if (typeof CHARACTERS === 'undefined' || !db) return;

      charRailRef = db.ref('sceneCharacters/' + fbKey(sceneId));
      charRailListener = charRailRef.on('value', function (snap) {
        const active = snap.val() || {};
        const activeChars = CHARACTERS.filter(function (ch) { return !!active[ch.id]; });

        charRailEl.innerHTML = '';
        activeChars.forEach(function (ch) {
          const card = document.createElement('div');
          card.className = 'char-card';
          card.innerHTML =
            '<img src="' + ch.img + '" alt="' + ch.name + '">' +
            '<div class="char-name">' + ch.name + '</div>';
          charRailEl.appendChild(card);
        });
      }, function () {
        charRailEl.innerHTML = '';
      });
    }

    // ==========================================================
    // FIREBASE: live, ohne dass Spieler aktualisieren müssen
    // ==========================================================
    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      initDiceRoller(db);

      db.ref('currentScene').on('value', function (snapshot) {
        const sceneId = snapshot.val() || getFallbackDefaultScene();
        statusEl.textContent = 'Verbunden';
        statusEl.className = 'connected';
        setTimeout(function () { statusEl.classList.add('hidden'); }, 1200);
        renderScene(sceneId);
        attachSceneAudioListener(sceneId);
        renderCharacterRail(sceneId);
      }, function (err) {
        statusEl.textContent = 'Verbindungsfehler: ' + err.message;
        statusEl.className = 'error';
      });
    } catch (e) {
      statusEl.textContent = 'Firebase-Konfiguration fehlt oder ist fehlerhaft.';
      statusEl.className = 'error';
      renderScene(getFallbackDefaultScene());
      attachSceneAudioListener(getFallbackDefaultScene());
      renderCharacterRail(getFallbackDefaultScene());
    }
  </script>

</body>
</html>
