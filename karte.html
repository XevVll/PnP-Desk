<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korsaren – Karte</title>
<style>
  :root {
    --bg: #0f0c08;
    --ink: #e6ddc7;
    --ink-dim: #a89d81;
    --gold: #c9a24b;
    --line: #3a2a18;
    --panel: #1a130b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    overflow: hidden;
  }

  /* ---------- Status / Ladezustand ---------- */
  #status {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 50;
    font-size: 12px; color: var(--ink-dim);
    background: rgba(15,12,8,0.7);
    padding: 5px 14px; border-radius: 20px;
    border: 1px solid var(--line);
    letter-spacing: .04em;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  #status.connected { color: #7fa87f; }
  #status.error { color: #c76a5a; }
  #status.hidden { opacity: 0; }

  /* ---------- Bühne ---------- */
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #mapWrap {
    position: relative;
    max-width: 100%; max-height: 100%;
    line-height: 0;
  }
  #mapImage {
    display: block;
    max-width: 100vw; max-height: 100vh;
    width: auto; height: auto;
    opacity: 0;
    transition: opacity .6s ease;
    user-select: none; -webkit-user-drag: none;
  }
  #mapImage.loaded { opacity: 1; }

  /* ---------- Marker ---------- */
  .marker {
    position: absolute;
    width: 26px; height: 26px;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 10; /* unter #fogCanvas (20) - Marker sollen unter Nebel verschwinden koennen */
  }
  .marker .pin {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8c876, var(--gold) 60%, #8a6a2a 100%);
    border: 2px solid #1a1308;
    box-shadow: 0 0 0 3px rgba(201,162,75,0.25), 0 2px 6px rgba(0,0,0,0.5);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(201,162,75,0.25), 0 2px 6px rgba(0,0,0,0.5); }
    50%      { box-shadow: 0 0 0 7px rgba(201,162,75,0.08), 0 2px 6px rgba(0,0,0,0.5); }
  }
  .marker:hover .pin { transform: scale(1.15); }
  .marker .label {
    position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    background: rgba(15,12,8,0.9);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 16px;
    padding: 5px 13px;
    border-radius: 4px;
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease;
  }
  .marker:hover .label { opacity: 1; }

  /* ---------- Sub-Orte (Marker innerhalb eines Overlay-Bildes) ---------- */
  .sub-marker {
    position: absolute;
    width: 20px; height: 20px;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 5;
  }
  .sub-marker .pin {
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8c876, var(--gold) 60%, #8a6a2a 100%);
    border: 2px solid #1a1308;
    box-shadow: 0 0 0 2px rgba(201,162,75,0.3), 0 2px 5px rgba(0,0,0,0.6);
  }
  .sub-marker:hover .pin { transform: scale(1.15); }
  .sub-marker .label {
    position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    background: rgba(15,12,8,0.92);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 4px;
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease;
  }
  .sub-marker:hover .label { opacity: 1; }
  /* Offenes Callout muss ÜBER allen anderen Pins liegen, nicht nur über
     seinem eigenen - sonst kann ein benachbarter Pin (gleicher z-index,
     spätere DOM-Position) quer über den Text gerendert werden. */
  .sub-marker.open { z-index: 50; }
  .sub-marker-callout {
    display: none;
    position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    width: max-content; max-width: min(320px, 70vw);
    background: rgba(15,12,8,0.97);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 18px 12px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    z-index: 20;
    cursor: default;
  }
  .sub-marker.open .sub-marker-callout { display: block; }
  /* Pins nahe am Bildrand: Callout würde sonst vom umgebenden
     overflow:hidden abgeschnitten - Öffnungsrichtung je nach Pin-Position
     umkehren statt immer zentriert nach oben (siehe renderSubMarkers, wo
     diese Klassen anhand von top/left vergeben werden). */
  .sub-marker.edge-bottom .sub-marker-callout { bottom: auto; top: 130%; }
  .sub-marker.edge-left .sub-marker-callout { left: 0; transform: none; }
  .sub-marker.edge-right .sub-marker-callout { left: auto; right: 0; transform: none; }
  .smc-close {
    position: absolute; top: 5px; right: 7px;
    background: none; border: none; color: var(--ink-dim);
    font-size: 15px; cursor: pointer; line-height: 1; padding: 2px;
  }
  .smc-close:hover { color: var(--ink); }
  .smc-title { color: var(--gold); font-size: 17px; margin: 0 20px 6px 0; }
  .smc-desc { color: var(--ink); font-size: 14.5px; line-height: 1.55; white-space: normal; }

  /* ---------- Overlay / Modal ---------- */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(8,6,4,0.86);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 30px;
  }
  #overlay.open { display: flex; }
  #overlayCard {
    max-width: 720px; width: 100%;
    max-height: 88vh;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #overlayImgWrap {
    position: relative;
    width: 100%;
    background: #000;
    line-height: 0;
    max-height: 55vh;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #overlayImgWrap img {
    width: 100%; height: auto; display: block;
  }
  #overlayImgWrap.empty {
    padding: 40px; color: var(--ink-dim); font-style: italic; font-size: 13px;
    text-align: center;
  }
  #overlayBody { padding: 22px 26px 26px; overflow-y: auto; }
  #overlayTitle {
    font-size: 22px; color: var(--gold); margin: 0 0 10px; font-weight: 400;
  }
  #overlayDesc { font-size: 14.5px; line-height: 1.6; color: var(--ink); margin: 0; }
  #overlayClose {
    position: absolute; top: 14px; right: 18px; z-index: 10;
    background: none; border: none; color: var(--ink-dim);
    font-size: 22px; cursor: pointer; line-height: 1;
  }
  #overlayClose:hover { color: var(--ink); }

  .empty-state {
    color: var(--ink-dim); font-size: 14px; text-align: center; max-width: 400px;
  }

  /* ---------- Charakterleiste (rechter Rand) ---------- */
  #charRail {
    position: fixed; top: 0; right: 0; height: 100vh;
    display: flex; flex-direction: column; justify-content: center; align-items: stretch;
    gap: clamp(8px, 1vh, 16px); padding: clamp(12px, 1.5vw, 24px);
    z-index: 150;
    pointer-events: none; /* nur die Karten selbst sollen interaktiv wirken, nicht der Leerraum */
  }
  .char-card {
    position: relative;
    width: clamp(108px, 8vw, 220px);
    max-height: clamp(170px, 22vh, 340px);
    flex: 1 1 0;
    min-height: 0;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(201,162,75,0.35);
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    background: #000;
    pointer-events: auto;
  }
  .char-card img {
    width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;
  }
  .char-card .char-name {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    color: var(--ink);
    font-size: clamp(11px, 0.9vw, 15px);
    text-align: center;
    padding: 12px 4px 5px;
    line-height: 1.2;
  }

  /* ---------- Audio-Steuerung ---------- */
  #audioControl {
    position: fixed; bottom: 16px; right: 16px; z-index: 60;
    display: flex; align-items: center; gap: 10px;
    background: rgba(15,12,8,0.75);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 8px 14px 8px 10px;
    backdrop-filter: blur(2px);
  }
  /* Erkundungs-Graph, On-Map-Darstellung (js/exploration_graphs.js): statt
     einer Options-Liste als Panel zeigt eine Ring-Markierung die aktuelle
     Position der Gruppe direkt auf der Karte, umgeben von Pfeil-Buttons -
     einer pro Kante - die auf Klick eine Stimme abgeben. Positionierung
     im selben %-Koordinatenraum wie normale Marker (#mapWrap), siehe
     renderErkundungOnMap(). */
  .erk-pos {
    position: absolute; width: 30px; height: 30px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #b8453a, #7a1f18 70%);
    border: 3px solid #b060a8;
    box-shadow: 0 0 0 3px rgba(176,96,168,0.35), 0 2px 8px rgba(0,0,0,0.5);
    z-index: 30; pointer-events: none;
  }
  /* Flavor-Text an einem Ereignis-Knoten (z.B. "Ein Mückenschwarm") - anders
     als der Hinweistext an einem Pfeil (nur der Weg dorthin) beschreibt das
     die aktuelle Situation selbst. Bewusst NICHT klein direkt am Ring
     (ging im Kartenbild unter, Hendriks Feedback), sondern groß und fest
     am unteren Bildrand, wo genug Platz ist - unabhängig davon, wo der
     Ring gerade auf der Karte sitzt. Zeigt NUR node.text, nie
     erfolgText/misserfolgText - das bleibt SL-exklusiv (regie.html). */
  #erkFlavorText {
    display: none;
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    width: min(760px, calc(100vw - 48px));
    background: rgba(12,9,6,0.92); border: 1px solid var(--gold); color: var(--ink);
    font-size: 21px; line-height: 1.5; text-align: center;
    padding: 18px 28px; border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.65);
    z-index: 80; pointer-events: none;
  }
  #erkFlavorText.visible { display: block; }
  .erk-arrow {
    position: absolute; width: 48px; height: 48px;
    transform: translate(-50%, -50%);
    cursor: pointer; z-index: 31;
    display: flex; align-items: center; justify-content: center;
  }
  /* Kreisiger Untergrund hinter dem Pfeil, damit er sich gegen das
     detailreiche Karten-Artwork abhebt statt darin unterzugehen - dieselbe
     Pulsieren-Idee wie bei normalen Markern (.marker .pin). */
  .erk-arrow-bg {
    position: absolute; width: 100%; height: 100%; border-radius: 50%;
    background: rgba(15,12,8,0.55);
    border: 2px solid rgba(74,144,226,0.9);
    box-shadow: 0 0 0 3px rgba(74,144,226,0.25), 0 2px 6px rgba(0,0,0,0.6);
    animation: erkArrowPulse 2.2s ease-in-out infinite;
  }
  @keyframes erkArrowPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(74,144,226,0.25), 0 2px 6px rgba(0,0,0,0.6); }
    50% { box-shadow: 0 0 0 7px rgba(74,144,226,0.12), 0 2px 6px rgba(0,0,0,0.6); }
  }
  .erk-arrow-shape {
    position: relative;
    width: 0; height: 0;
    border-left: 13px solid transparent; border-right: 13px solid transparent;
    border-bottom: 24px solid #4a90e2;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7));
    transition: border-bottom-color .15s ease, transform .15s ease;
  }
  .erk-arrow:hover .erk-arrow-shape { border-bottom-color: var(--gold); transform: scale(1.12); }
  .erk-arrow.mine .erk-arrow-shape { border-bottom-color: var(--gold); }
  .erk-arrow.mine .erk-arrow-bg { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,75,0.3), 0 2px 6px rgba(0,0,0,0.6); }
  .erk-arrow.back .erk-arrow-shape { border-bottom-color: var(--ink-dim); opacity: .85; }
  .erk-arrow.back .erk-arrow-bg { border-color: rgba(168,157,129,0.7); animation: none; }
  .erk-arrow.back.mine .erk-arrow-shape { border-bottom-color: var(--gold); opacity: 1; }
  .erk-arrow.back.mine .erk-arrow-bg { border-color: var(--gold); }
  .erk-arrow-votes {
    position: absolute; top: -6px; right: -8px;
    background: rgba(15,12,8,0.95); border: 1px solid var(--gold); color: var(--ink);
    font-size: 12px; font-weight: 700; line-height: 1; padding: 2px 6px; border-radius: 9px;
    display: none;
  }
  .erk-arrow-votes.has-votes { display: block; }
  /* Debug-Overlay (nur mit ?erkundungDebug in der URL, siehe ERK_DEBUG):
     zeigt den kompletten Graphen inkl. Kanten/Ereignis-/Gabelungs-Knoten,
     die im echten Spiel bewusst verdeckt bleiben (Design-Regel: Wege nicht
     sichtbar). Reine Testhilfe, keine Spieler-Funktion. */
  /* Fog of War (nur in Szenen mit Erkundungs-Graph, siehe ERK_DEBUG/render-
     FogOfWar()): verdeckt die Karte bis auf den bereits erkundeten Pfad -
     verhindert, dass Spieler Fundstellen einfach im Kartenbild selbst sehen
     und gezielt hinlaufen, obwohl der Graph selbst schon verdeckt ist.
     Unter dem Debug-Overlay (25) und der Positions-Markierung/den Pfeilen
     (30/31), über normalen Markern (10). */
  #fogCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
  #fogCanvas.visible { display: block; }
  #erkDebugSvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; display: none; }
  #erkDebugSvg.visible { display: block; }
  .erk-debug-node {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    transform: translate(-50%, -50%); z-index: 26; pointer-events: none;
    border: 2px solid rgba(15,12,8,0.75);
  }
  .erk-debug-start { background: #b060a8; }
  .erk-debug-ort { background: #3a6ea5; }
  .erk-debug-gabelung { background: #d4b23c; }
  .erk-debug-ereignis { background: #4a9a4a; }
  .erk-debug-label {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    white-space: nowrap; font-size: 10px; color: var(--ink);
    background: rgba(15,12,8,0.75); padding: 1px 4px; border-radius: 3px; margin-top: 2px;
  }
  .erk-arrow-label {
    position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    white-space: nowrap; max-width: 220px; white-space: normal; width: 180px;
    background: rgba(15,12,8,0.92); border: 1px solid var(--line); color: var(--ink);
    font-size: 12.5px; line-height: 1.4; padding: 6px 10px; border-radius: 5px;
    opacity: 0; pointer-events: none; transition: opacity .15s ease; text-align: center;
  }
  .erk-arrow:hover .erk-arrow-label { opacity: 1; }
  #muteBtn {
    background: none; border: none; cursor: pointer;
    font-size: 18px; line-height: 1; color: var(--ink);
    padding: 2px; width: 24px; text-align: center;
  }
  #muteBtn:hover { color: var(--gold); }
  #volumeSlider {
    width: 90px; accent-color: var(--gold);
    cursor: pointer;
  }

  /* ---------- Würfel-Feed (szenenübergreifend) ---------- */
  /* z-index 350: bewusst ÜBER dem Charakterbogen-Drawer (300) und dessen
     Backdrop (290) - Würfeln muss auch möglich sein, während der Bogen
     ausgeklappt ist, sonst würde der Backdrop Klicks auf die Würfel-
     Steuerung abfangen (volle Bildschirmfläche, höherer z-index). */
  #diceControls {
    position: fixed; bottom: 16px; left: 16px; z-index: 350;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(15,12,8,0.75);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 8px 14px;
    backdrop-filter: blur(2px);
    font-size: 12.5px;
  }
  #diceNameLabel {
    color: var(--ink-dim); cursor: pointer; white-space: nowrap;
  }
  #diceNameLabel:hover { color: var(--gold); }
  #diceD100Btn, #diceForm button {
    font-family: inherit; font-size: 12.5px;
    background: transparent; border: 1px solid var(--line);
    color: var(--ink); border-radius: 3px;
    padding: 5px 10px; cursor: pointer;
  }
  #diceD100Btn:hover, #diceForm button:hover { border-color: var(--gold); color: var(--gold); }
  #diceForm { display: flex; align-items: center; gap: 6px; }
  #diceForm input {
    width: 42px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
    color: var(--ink); font-family: inherit; font-size: 12.5px; padding: 5px 6px;
    -moz-appearance: textfield;
  }
  #diceForm input::-webkit-outer-spin-button,
  #diceForm input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  #diceFeed {
    position: fixed; top: 16px; left: 16px; z-index: 350;
    display: flex; flex-direction: column; gap: 6px;
    max-width: 320px;
  }
  .dice-toast {
    background: rgba(15,12,8,0.85);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 12.5px; color: var(--ink);
    transition: opacity .4s ease;
  }
  .dice-toast.fade { opacity: 0; }
  .dice-toast.private { border-style: dashed; font-style: italic; }
  #dicePrivateLabel {
    display: flex; align-items: center; gap: 5px;
    color: var(--ink-dim); font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #dicePrivateLabel input { accent-color: var(--gold); cursor: pointer; }

  /* ---------- Charakterbogen-Drawer ---------- */
  #charSheetHandle {
    position: fixed; top: 50%; left: 0; transform: translateY(-50%);
    z-index: 300;
    writing-mode: vertical-rl;
    background: rgba(15,12,8,0.85);
    border: 1px solid var(--line); border-left: none;
    border-radius: 0 8px 8px 0;
    color: var(--ink-dim);
    padding: 14px 8px;
    cursor: pointer;
    font-size: 12.5px;
    letter-spacing: .04em;
    transition: color .15s, background .15s;
  }
  #charSheetHandle:hover { color: var(--gold); background: rgba(15,12,8,0.95); }
  #charSheetBackdrop {
    position: fixed; inset: 0;
    background: rgba(8,6,4,0.6);
    z-index: 290;
    display: none;
  }
  #charSheetBackdrop.open { display: block; }
  #charSheetDrawer {
    position: fixed; top: 0; left: 0; height: 100vh;
    width: 70vw; max-width: 900px;
    z-index: 300;
    background: var(--panel);
    border-right: 1px solid var(--line);
    box-shadow: 8px 0 30px rgba(0,0,0,0.5);
    transform: translateX(-100%);
    transition: transform .3s ease;
    display: flex; flex-direction: column;
  }
  #charSheetDrawer.open { transform: translateX(0); }
  #charSheetDrawer iframe {
    flex: 1; width: 100%; border: none;
  }
  #charSheetDrawerClose {
    position: absolute; top: 10px; right: 10px; z-index: 1;
    background: rgba(15,12,8,0.85); border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 50%;
    width: 30px; height: 30px;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #charSheetDrawerClose:hover { color: var(--gold); }
  @media (max-width: 700px) {
    #charSheetDrawer { width: 100vw; max-width: 100vw; }
  }

  /* ---------- Vorschau-Modus (?preview=1, siehe regie.html-Live-Vorschau) ---------- */
  .preview-mode #status,
  .preview-mode #audioControl,
  .preview-mode #diceControls,
  .preview-mode #diceFeed,
  .preview-mode #charSheetHandle,
  .preview-mode #charSheetDrawer,
  .preview-mode #charSheetBackdrop {
    display: none !important;
  }
</style>
</head>
<body>

  <div id="status">Verbinde …</div>

  <div id="stage">
    <div id="mapWrap">
      <img id="mapImage" alt="Karte">
      <!-- Marker werden hier per JS eingefügt -->
      <canvas id="fogCanvas"></canvas>
      <svg id="erkDebugSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div id="overlay">
    <div id="overlayCard" style="position:relative;">
      <button id="overlayClose" aria-label="Schließen">✕</button>
      <div id="overlayImgWrap"><img id="overlayImg" alt=""></div>
      <div id="overlayBody">
        <h2 id="overlayTitle"></h2>
        <p id="overlayDesc"></p>
      </div>
    </div>
  </div>

  <div id="audioControl">
    <button id="muteBtn" title="Ton an/aus">🔇</button>
    <input type="range" id="volumeSlider" min="0" max="100" value="50">
  </div>

  <div id="erkFlavorText"></div>
  <div id="charRail"></div>
  <audio id="bgAudio" loop preload="auto"></audio>

  <div id="charSheetHandle" onclick="toggleCharSheetDrawer()">📋 Charakterbogen</div>
  <div id="charSheetBackdrop" onclick="closeCharSheetDrawer()"></div>
  <div id="charSheetDrawer">
    <button id="charSheetDrawerClose" onclick="closeCharSheetDrawer()" aria-label="Schließen">✕</button>
    <iframe id="charSheetFrame" title="Charakterbogen" allow="clipboard-write"></iframe>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>

  <!--
    ALLE Karten-Dateien hier eintragen (scenes.js für Grimsgate-Stadt,
    golden_lion_scenes.js fürs Schiff, künftige Karten genauso anhängen).
    Diese Seite selbst muss dafür NICHT verändert werden - sie erkennt
    neue Karten automatisch über MAP_REGISTRY weiter unten, solange jede
    Datei dem bestehenden Muster folgt (SCENES-artiges Objekt + Zugriff
    auf label/background/markers, wahlweise über eine Marker-Funktion
    wie bei Golden Lion).
  -->
  <script src="js/scenes.js"></script>
  <script src="js/golden_lion_scenes.js"></script>
  <script src="js/schatzinsel_scenes.js"></script>
  <script src="js/spanischer_hafen_scenes.js"></script>
  <script src="js/schmugglernest_scenes.js"></script>
  <script src="js/artefakthandel_scenes.js"></script>
  <script src="js/riffinsel_scenes.js"></script>
<script src="js/grabesinsel_scenes.js"></script>
  <script src="js/exploration_graphs.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/dice.js"></script>

  <script>
    // Vorschau-Modus (nur wenn per ?preview=1 aufgerufen, z.B. im
    // schwebenden Live-Vorschau-Widget von regie.html): blendet die
    // interaktive UI-Chrome aus, die dort nur unnötig groß/überflüssig
    // wirkt (Würfel-Steuerung, Audio-Regler, Charakterbogen-Griff) -
    // betrifft nur diesen Aufruf, die normale Spieleransicht bleibt
    // unverändert, da kein Query-Parameter gesetzt ist.
    if (new URLSearchParams(location.search).has('preview')) {
      document.documentElement.classList.add('preview-mode');
    }

    // ==========================================================
    // KARTEN-REGISTER
    // ==========================================================
    // Jeder Eintrag beschreibt eine Karten-Datenquelle: eine Funktion,
    // die für eine Szenen-ID das rohe Szenen-Objekt liefert (für Label/
    // Hintergrundbild), und eine Funktion, die die fertige Marker-Liste
    // liefert - direkte Funktionsreferenzen statt String-Namen, damit es
    // unabhängig davon funktioniert, ob eine Datei ihre Daten mit "var"
    // oder "const" deklariert (const/let landen NICHT auf window, var
    // schon - direkte Referenzen umgehen dieses Problem komplett).
    //
    // Neue Karte hinzufügen: einfach einen weiteren Eintrag in dieses
    // Array aufnehmen, plus die passende <script src="..."> oben ergänzen.
    // Diese Datei selbst braucht sonst keine Änderung mehr.
    const MAP_REGISTRY = [
      {
        getScene: function (sceneId) {
          return (typeof SCENES !== 'undefined') ? SCENES[sceneId] : undefined;
        },
        getMarkers: function (sceneId) {
          return (typeof SCENES !== 'undefined' && SCENES[sceneId]) ? SCENES[sceneId].markers : null;
        }
      },
      {
        getScene: function (sceneId) {
          return (typeof GOLDEN_LION_SCENES !== 'undefined') ? GOLDEN_LION_SCENES[sceneId] : undefined;
        },
        getMarkers: function (sceneId) {
          if (typeof GOLDEN_LION_SCENES === 'undefined' || !GOLDEN_LION_SCENES[sceneId]) return null;
          return (typeof getGoldenLionMarkers === 'function') ? getGoldenLionMarkers(sceneId) : [];
        }
      },
      {
        getScene: function (sceneId) {
          return (typeof SCHATZINSEL_SCENES !== 'undefined') ? SCHATZINSEL_SCENES[sceneId] : undefined;
        },
        getMarkers: function (sceneId) {
          return (typeof SCHATZINSEL_SCENES !== 'undefined' && SCHATZINSEL_SCENES[sceneId]) ? SCHATZINSEL_SCENES[sceneId].markers : null;
        }
      },
      {
        getScene: function (sceneId) {
          return (typeof SPANISCHER_HAFEN_SCENES !== 'undefined') ? SPANISCHER_HAFEN_SCENES[sceneId] : undefined;
        },
        getMarkers: function (sceneId) {
          return (typeof SPANISCHER_HAFEN_SCENES !== 'undefined' && SPANISCHER_HAFEN_SCENES[sceneId]) ? SPANISCHER_HAFEN_SCENES[sceneId].markers : null;
        }
      },
      {
        getScene: function (sceneId) {
          return (typeof SCHMUGGLERNEST_SCENES !== 'undefined') ? SCHMUGGLERNEST_SCENES[sceneId] : undefined;
        },
        getMarkers: function (sceneId) {
          return (typeof SCHMUGGLERNEST_SCENES !== 'undefined' && SCHMUGGLERNEST_SCENES[sceneId]) ? SCHMUGGLERNEST_SCENES[sceneId].markers : null;
        }
      },
      {
        getScene: function (sceneId) {
          return (typeof ARTEFAKTHANDEL_SCENES !== 'undefined') ? ARTEFAKTHANDEL_SCENES[sceneId] : undefined;
        },
        getMarkers: function (sceneId) {
          return (typeof ARTEFAKTHANDEL_SCENES !== 'undefined' && ARTEFAKTHANDEL_SCENES[sceneId]) ? ARTEFAKTHANDEL_SCENES[sceneId].markers : null;
        }
      },
      {
        getScene: function (sceneId) {
          return (typeof RIFFINSEL_SCENES !== 'undefined') ? RIFFINSEL_SCENES[sceneId] : undefined;
        },
        getMarkers: function (sceneId) {
          return (typeof RIFFINSEL_SCENES !== 'undefined' && RIFFINSEL_SCENES[sceneId]) ? RIFFINSEL_SCENES[sceneId].markers : null;
        }
      },
      {
        getScene: function (sceneId) {
          return (typeof GRABESINSEL_SCENES !== 'undefined') ? GRABESINSEL_SCENES[sceneId] : undefined;
        },
        getMarkers: function (sceneId) {
          return (typeof GRABESINSEL_SCENES !== 'undefined' && GRABESINSEL_SCENES[sceneId]) ? GRABESINSEL_SCENES[sceneId].markers : null;
        }
      }
    ];

    function findSceneMeta(sceneId) {
      for (const entry of MAP_REGISTRY) {
        const raw = entry.getScene(sceneId);
        if (raw) return { raw: raw, registryEntry: entry };
      }
      return null;
    }

    function getMarkersForScene(sceneId) {
      const meta = findSceneMeta(sceneId);
      if (!meta) return [];
      const markers = meta.registryEntry.getMarkers(sceneId);
      return markers || [];
    }

    function getBackgroundForScene(sceneId) {
      const meta = findSceneMeta(sceneId);
      return meta && meta.raw.background ? meta.raw.background : null;
    }

    function getStaticSoundForScene(sceneId) {
      const meta = findSceneMeta(sceneId);
      return meta && meta.raw.soundFile ? meta.raw.soundFile : null;
    }

    // Liefert den Sound-Dateinamen für eine Szene per Callback, da der
    // Firebase-Wert (vom Admin-Panel gesetzt) Vorrang vor dem statischen
    // "soundFile"-Feld aus der jeweiligen *_scenes.js-Datei hat. Fällt
    // still auf das statische Feld zurück, falls Firebase nichts liefert
    // oder nicht erreichbar ist.
    function resolveSoundForScene(sceneId, callback) {
      const fallback = getStaticSoundForScene(sceneId);
      if (!db) { callback(fallback); return; }
      db.ref('sceneAudioFile/' + fbKey(sceneId)).once('value').then(function (snap) {
        const fromFirebase = snap.val();
        callback(fromFirebase || fallback);
      }).catch(function () {
        callback(fallback);
      });
    }

    // Firebase-Keys dürfen keinen Punkt enthalten (Szenen-IDs wie "1.1" tun
    // das) - gleiche Sanitisierung wie im Admin-Panel.
    function fbKey(str) {
      return String(str).replace(/[.#$\[\]]/g, '-');
    }

    function getFallbackDefaultScene() {
      // Erste verfügbare DEFAULT_*-Konstante nehmen, sonst "1.1"
      if (typeof DEFAULT_SCENE !== 'undefined') return DEFAULT_SCENE;
      if (typeof DEFAULT_GOLDEN_LION_SCENE !== 'undefined') return DEFAULT_GOLDEN_LION_SCENE;
      return '1.1';
    }

    // ==========================================================
    // RENDERING
    // ==========================================================
    const statusEl = document.getElementById('status');
    const mapImageEl = document.getElementById('mapImage');
    const mapWrapEl = document.getElementById('mapWrap');
    const overlayEl = document.getElementById('overlay');
    const overlayImgWrap = document.getElementById('overlayImgWrap');
    const overlayImg = document.getElementById('overlayImg');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');

    let currentRenderedScene = null;

    // ---------- Live-Präsenz: wer hat welchen Ort gerade offen ----------
    // Pro Tab (nicht pro Gerät) eine Session-ID, damit zwei offene Tabs auch
    // als zwei Betrachter zählen. regie.html liest openMarkers/{szene}/{ort}
    // und zeigt die Anzahl der Kinder als Badge (siehe KAMPAGNEN-BIBEL 13.9).
    let mySessionId = sessionStorage.getItem('korsaren_session_id');
    if (!mySessionId) {
      mySessionId = Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem('korsaren_session_id', mySessionId);
    }
    let openMarkerRef = null; // aktuell gesetzter Präsenz-Ref, zum sauberen Aufräumen

    function clearOpenMarker() {
      if (openMarkerRef) {
        openMarkerRef.onDisconnect().cancel();
        openMarkerRef.remove();
        openMarkerRef = null;
      }
    }

    function setOpenMarker(sceneId, markerId) {
      clearOpenMarker();
      // Im Admin-eigenen Vorschau-iframe (?preview=1) nicht mitzählen - sonst
      // würde ein Marker-Klick des Spielleiters in seiner eigenen Live-
      // Vorschau die Zählung für echte Spieler verfälschen.
      if (!db || !sceneId || document.documentElement.classList.contains('preview-mode')) return;
      openMarkerRef = db.ref('openMarkers/' + fbKey(sceneId) + '/' + markerId + '/' + mySessionId);
      openMarkerRef.set(true);
      openMarkerRef.onDisconnect().remove();
    }

    // ---------- Erkundungs-Graph (js/exploration_graphs.js) ----------
    // Zeigt Situationstext + Wahl-Buttons für Szenen mit einem hinterlegten
    // EXPLORATION_GRAPHS-Eintrag (aktuell nur "11.1", Riffinsel). Stimmen
    // werden unter derselben mySessionId geschrieben wie openMarkers, mit
    // demselben onDisconnect().remove()-Muster - Spieler stimmen live ab,
    // die eigentliche Bewegung (currentNode) setzt ausschließlich die SL
    // im Adminpanel (siehe js/regie_vault.js, graphAdvance). Eine Stimme
    // bewegt die Gruppe NIE von selbst: sie zeigt der SL nur, wohin dieser
    // Spieler will - freigegeben wird jede Bewegung dort von Hand.
    let graphStateRef = null;
    let graphStateListener = null;
    let graphStateScene = null;
    let graphStateSnapshot = {};
    let myVoteRef = null;

    function clearMyVote() {
      if (myVoteRef) { myVoteRef.onDisconnect().cancel(); myVoteRef.remove(); myVoteRef = null; }
    }

    // Zeigt den kompletten Erkundungs-Graphen (Kanten + alle Knoten, auch
    // Ereignis-/Gabelungs-Knoten) sichtbar auf der Karte - reine Testhilfe,
    // im echten Spiel soll der Pfad wie vorgesehen verdeckt bleiben (nur
    // die aktuelle Position + wählbare Optionen, siehe renderErkundungOnMap
    // und renderFogOfWar). War während der Testphase kurzzeitig standard-
    // mäßig an (Hendrik hatte den Parameter übersehen) - jetzt, wo
    // zusätzlich Fog of War existiert (verdeckt das Kartenbild selbst),
    // wieder zurück auf Opt-in per ?erkundungDebug, sonst würde das Debug-
    // Overlay den Fog-Zweck für echte Spieler sofort aushebeln.
    const ERK_DEBUG = new URLSearchParams(location.search).has('erkundungDebug');

    function clearErkundungDebugOverlay() {
      mapWrapEl.querySelectorAll('.erk-debug-node').forEach(function (el) { el.remove(); });
      const svg = document.getElementById('erkDebugSvg');
      if (svg) { svg.innerHTML = ''; svg.classList.remove('visible'); }
    }

    function renderErkundungDebugOverlay(sceneId) {
      clearErkundungDebugOverlay();
      if (!ERK_DEBUG) return;
      const graph = (typeof getExplorationGraph === 'function') ? getExplorationGraph(sceneId) : null;
      const svg = document.getElementById('erkDebugSvg');
      if (!graph || !svg) return;
      svg.classList.add('visible');

      Object.keys(graph.edges).forEach(function (edgeId) {
        const edge = graph.edges[edgeId];
        const fromPos = getGraphNodePosition(sceneId, edge.from, getMarkersForScene);
        const toPos = getGraphNodePosition(sceneId, edge.to, getMarkersForScene);
        if (!fromPos || !toPos) return;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', fromPos.left); line.setAttribute('y1', fromPos.top);
        line.setAttribute('x2', toPos.left); line.setAttribute('y2', toPos.top);
        line.setAttribute('stroke', 'rgba(230,80,60,0.55)');
        line.setAttribute('stroke-width', '0.4');
        svg.appendChild(line);
      });

      Object.keys(graph.nodes).forEach(function (nodeId) {
        const pos = getGraphNodePosition(sceneId, nodeId, getMarkersForScene);
        if (!pos) return;
        const node = graph.nodes[nodeId];
        const dot = document.createElement('div');
        dot.className = 'erk-debug-node erk-debug-' + node.type;
        dot.style.top = pos.top + '%';
        dot.style.left = pos.left + '%';
        dot.innerHTML = '<span class="erk-debug-label">' + nodeId + '</span>';
        mapWrapEl.appendChild(dot);
      });
    }

    function attachGraphStateListener(sceneId) {
      if (sceneId === graphStateScene) return;
      if (graphStateRef && graphStateListener) graphStateRef.off('value', graphStateListener);
      graphStateScene = sceneId; graphStateSnapshot = {};
      clearMyVote();
      renderErkundungDebugOverlay(sceneId);
      if (!db || !sceneId || typeof getExplorationGraph !== 'function' || !getExplorationGraph(sceneId)) {
        renderErkundungOnMap();
        return;
      }
      graphStateRef = db.ref('graphState/' + fbKey(sceneId));
      graphStateListener = graphStateRef.on('value', function (snap) {
        graphStateSnapshot = snap.val() || {};
        renderErkundungOnMap();
      });
    }

    function castVote(edgeId) {
      if (!db || !graphStateScene) return;
      clearMyVote();
      myVoteRef = db.ref('graphState/' + fbKey(graphStateScene) + '/votes/' + mySessionId);
      myVoteRef.set(edgeId);
      myVoteRef.onDisconnect().remove();
    }

    function clearErkundungOverlay() {
      mapWrapEl.querySelectorAll('.erk-pos, .erk-arrow').forEach(function (el) { el.remove(); });
    }

    // Fog of War: verdeckt das Kartenbild bis auf den bereits erkundeten
    // Pfad (Start + history + aktueller Knoten) - Hendriks Vorgabe, damit
    // Spieler Fundstellen nicht einfach im Kartenbild selbst sehen und
    // gezielt hinlaufen können, obwohl der Erkundungs-Graph selbst schon
    // verdeckt ist. Nur aktiv in Szenen mit einem definierten Graphen -
    // andere Karten (Grimsgate, Golden Lion, ...) bleiben unverändert
    // vollständig sichtbar. Weiche Kreis-Löcher per Radial-Gradient +
    // "destination-out", keine harten Kanten.
    // Faellt auf graph.startNode zurueck, wenn currentNode fehlt ODER auf
    // eine Knoten-ID zeigt, die es im (evtl. inzwischen neu gebauten)
    // Graphen gar nicht mehr gibt - sonst bleibt nach einem Graph-Wechsel
    // (z.B. Hendriks Neubau des Riffinsel-Graphen) alles unsichtbar, weil
    // die alte, in Firebase gespeicherte currentNode-ID nirgends mehr matcht.
    function resolveCurrentNodeId(graph) {
      const cur = graphStateSnapshot.currentNode;
      return (cur && graph.nodes[cur]) ? cur : graph.startNode;
    }

    const FOG_RADIUS_FRACTION = 0.1; // Anteil der Bildbreite pro aufgedecktem Punkt
    function renderFogOfWar() {
      const canvas = document.getElementById('fogCanvas');
      if (!canvas) return;
      const graph = (typeof getExplorationGraph === 'function') ? getExplorationGraph(graphStateScene) : null;
      if (!graph) { canvas.classList.remove('visible'); return; }
      const rect = mapWrapEl.getBoundingClientRect();
      if (!rect.width || !rect.height) { canvas.classList.remove('visible'); return; }
      canvas.width = rect.width;
      canvas.height = rect.height;
      canvas.classList.add('visible');

      const ctx = canvas.getContext('2d');
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(12, 9, 6, 0.93)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const currentNodeId = resolveCurrentNodeId(graph);
      const history = graphStateSnapshot.history || [];
      const revealedIds = [graph.startNode].concat(history).concat([currentNodeId]);
      const radiusPx = canvas.width * FOG_RADIUS_FRACTION;
      const seen = {};
      ctx.globalCompositeOperation = 'destination-out';
      revealedIds.forEach(function (nodeId) {
        if (!nodeId || seen[nodeId]) return;
        seen[nodeId] = true;
        const pos = (typeof getGraphNodePosition === 'function') ? getGraphNodePosition(graphStateScene, nodeId, getMarkersForScene) : null;
        if (!pos) return;
        const cx = pos.left / 100 * canvas.width;
        const cy = pos.top / 100 * canvas.height;
        const grad = ctx.createRadialGradient(cx, cy, radiusPx * 0.35, cx, cy, radiusPx);
        grad.addColorStop(0, 'rgba(0,0,0,1)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radiusPx, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalCompositeOperation = 'source-over';
    }
    window.addEventListener('resize', function () { renderFogOfWar(); });

    // Zeigt die aktuelle Position der Gruppe direkt auf der Karte (Ring)
    // statt einer Options-Liste, umgeben von Pfeil-Buttons - einer pro
    // Kante - die auf Klick eine Stimme abgeben (Hinweistext als Hover-
    // Label, gleiches Muster wie .marker .label). "ort"-Knoten holen ihre
    // Position vom verknüpften Marker (getGraphNodePosition), damit die
    // Ring-Markierung nach der Aufdeckung optisch an derselben Stelle
    // sitzt wie der dann erscheinende richtige Marker.
    function renderErkundungOnMap() {
      renderFogOfWar();
      clearErkundungOverlay();
      const flavorEl = document.getElementById('erkFlavorText');
      const graph = (typeof getExplorationGraph === 'function') ? getExplorationGraph(graphStateScene) : null;
      if (!graph) { if (flavorEl) flavorEl.classList.remove('visible'); return; }

      const currentNodeId = resolveCurrentNodeId(graph);
      const node = (typeof getGraphNode === 'function') ? getGraphNode(graphStateScene, currentNodeId) : null;
      const pos = (typeof getGraphNodePosition === 'function') ? getGraphNodePosition(graphStateScene, currentNodeId, getMarkersForScene) : null;
      if (!node || !pos) { if (flavorEl) flavorEl.classList.remove('visible'); return; }

      const posEl = document.createElement('div');
      posEl.className = 'erk-pos';
      posEl.style.top = pos.top + '%';
      posEl.style.left = pos.left + '%';
      mapWrapEl.appendChild(posEl);

      // Flavor-Text des aktuellen Ereignis-Knotens auch den Spielern zeigen
      // (Hendriks Wunsch) - nur node.text (Situationsbeschreibung), niemals
      // erfolgText/misserfolgText (SL-exklusiv, siehe regie.html). Fest am
      // Bildrand statt klein am Ring (ging im Kartenbild unter) - deshalb
      // ein eigenes, immer gleich positioniertes Element statt eines
      // Overlay-Kinds von #mapWrap.
      if (flavorEl) {
        if (node.type === 'ereignis' && node.text) {
          flavorEl.textContent = node.text;
          flavorEl.classList.add('visible');
        } else {
          flavorEl.classList.remove('visible');
        }
      }

      // Hendriks Vorgabe: Spieler sollen IMMER auch umkehren können -
      // getPlayableOptions() hängt dafür eine synthetische Zurück-Option an,
      // sobald graphState.history nicht leer ist (siehe exploration_graphs.js).
      // Ereignis-Knoten sind seit 2026-08-21 zugleich normale Entscheidungs-
      // punkte (kein separater "nur Zurück"-Sonderfall mehr) - die Probe
      // selbst läuft SL-seitig ab (regie.html), die Wahl des Weiters danach
      // ist wie überall Spieler-Sache.
      const history = graphStateSnapshot.history || [];
      const options = (typeof getPlayableOptions === 'function') ? getPlayableOptions(graphStateScene, currentNodeId, history) : [];
      if (!options.length) return;

      const votes = graphStateSnapshot.votes || {};
      const myVote = votes[mySessionId];
      const voteCounts = {};
      Object.keys(votes).forEach(function (sid) { const eid = votes[sid]; voteCounts[eid] = (voteCounts[eid] || 0) + 1; });

      const RADIUS = 68; // px, Abstand der Pfeile von der Positions-Markierung (groesser als die Pfeile selbst)
      const MIN_ARROW_SEP = 42; // Grad; ein Pfeil ist ~48px breit auf RADIUS 68 -> darunter ueberlappen sich zwei Pfeile
      // Jeder Pfeil bekommt die TATSÄCHLICHE Richtung zu seinem Zielknoten
      // (jetzt, wo alle Knoten echte, auf das Referenzbild abgestimmte
      // Koordinaten haben, siehe exploration_graphs.js seit 2026-08-21) -
      // kein Fächer/keine geratene Richtung mehr. Fallback -90° (gerade
      // nach oben) nur, falls für einen Knoten ausnahmsweise keine Position
      // ermittelbar ist.
      //
      // WICHTIG: das Kartenbild ist deutlich breiter als hoch (1920x1047),
      // top/left sind aber beide Prozentwerte - eine Richtung direkt aus den
      // Rohprozenten zeigt daher sichtbar daneben. Deshalb wird die
      // Horizontale vorher mit dem Seitenverhältnis skaliert.
      const rectA = mapWrapEl.getBoundingClientRect();
      const aspect = (rectA.width && rectA.height) ? (rectA.width / rectA.height) : 1;
      const wanted = options.map(function (e) {
        const targetPos = (typeof getGraphNodePosition === 'function') ? getGraphNodePosition(graphStateScene, e.to, getMarkersForScene) : null;
        let angleDeg = -90;
        if (targetPos && (targetPos.left !== pos.left || targetPos.top !== pos.top)) {
          angleDeg = Math.atan2(targetPos.top - pos.top, (targetPos.left - pos.left) * aspect) * 180 / Math.PI;
        }
        return { opt: e, deg: angleDeg };
      });
      spreadAngles(wanted, MIN_ARROW_SEP).forEach(function (a) { renderArrow(a.opt, a.deg); });

      // Zwei Wege können geografisch fast in dieselbe Richtung führen (auf
      // der Riffinsel z.B. Süßwasserquelle/Zirpen/Schlammboden) - ohne
      // Korrektur liegen deren Pfeile übereinander und der hintere ist
      // nicht mehr einzeln anklickbar. Diese Relaxation schiebt zu nah
      // beieinander liegende Pfeile so weit auseinander, bis jeder frei
      // klickbar ist, und hält sie dabei so nah wie möglich an ihrer
      // echten Richtung (Reihenfolge im Kreis bleibt erhalten, damit kein
      // Pfeil auf die falsche Seite springt).
      function spreadAngles(items, minSep) {
        if (items.length < 2) return items;
        const norm = function (d) { let x = d % 360; if (x < -180) x += 360; if (x > 180) x -= 360; return x; };
        const sorted = items.slice().sort(function (a, b) { return a.deg - b.deg; });
        // Vollkreis reicht nicht für alle? Dann gleichmäßig verteilen.
        if (sorted.length * minSep >= 360) {
          const step = 360 / sorted.length;
          return sorted.map(function (it, i) { return { opt: it.opt, deg: norm(sorted[0].deg + i * step) }; });
        }
        const cur = sorted.map(function (it) { return it.deg; });
        for (let pass = 0; pass < 60; pass++) {
          let moved = false;
          for (let i = 0; i < cur.length; i++) {
            const j = (i + 1) % cur.length;
            let gap = cur[j] - cur[i];
            if (j === 0) gap += 360; // Umlauf ueber den Kreis hinweg
            if (gap < minSep) {
              const push = (minSep - gap) / 2;
              cur[i] -= push;
              cur[j] += push;
              moved = true;
            }
          }
          if (!moved) break;
        }
        return sorted.map(function (it, i) { return { opt: it.opt, deg: norm(cur[i]) }; });
      }

      function renderArrow(e, angleDeg) {
        const angleRad = angleDeg * Math.PI / 180;
        const dx = Math.cos(angleRad) * RADIUS;
        const dy = Math.sin(angleRad) * RADIUS;
        const count = voteCounts[e.id] || 0;

        const arrowEl = document.createElement('div');
        arrowEl.className = 'erk-arrow' + (myVote === e.id ? ' mine' : '') + (e.isBack ? ' back' : '');
        arrowEl.style.top = pos.top + '%';
        arrowEl.style.left = pos.left + '%';
        arrowEl.style.transform = 'translate(-50%, -50%) translate(' + dx + 'px, ' + dy + 'px) rotate(' + (angleDeg + 90) + 'deg)';
        arrowEl.onclick = function () { castVote(e.id); };
        arrowEl.innerHTML =
          '<div class="erk-arrow-bg" style="transform: rotate(' + (-(angleDeg + 90)) + 'deg)"></div>' +
          '<div class="erk-arrow-shape"></div>' +
          '<div class="erk-arrow-votes' + (count ? ' has-votes' : '') + '" style="transform: rotate(' + (-(angleDeg + 90)) + 'deg)">' + count + '</div>' +
          // Kein "↩"-Präfix o.Ä. am Spieler-Label: der Hinweistext soll den
          // Weg nur beschreiben, nicht einordnen, ob er vorwärts oder
          // zurück führt (Hendriks Vorgabe, siehe Stilregel in
          // js/exploration_graphs.js). Die gedämpfte .back-Farbe bleibt.
          '<div class="erk-arrow-label" style="transform: translateX(-50%) rotate(' + (-(angleDeg + 90)) + 'deg)">' + e.hinweis + '</div>';
        mapWrapEl.appendChild(arrowEl);
      }
    }

    function renderScene(sceneId) {
      if (sceneId === currentRenderedScene) return; // nichts geändert, kein Neu-Rendern nötig
      currentRenderedScene = sceneId;
      // Szene wechselt - ein evtl. offenes Overlay bezieht sich sonst auf
      // einen Ort in der ALTEN Szene, dessen Präsenz-Eintrag sonst dort
      // hängen bliebe, bis die Verbindung getrennt wird.
      clearOpenMarker();
      attachGraphStateListener(sceneId);

      const background = getBackgroundForScene(sceneId);
      const markers = getMarkersForScene(sceneId);
      currentSceneRawMarkers = markers;

      if (!background) {
        // Unbekannte Szene - Kartendaten fehlen (z.B. Tippfehler in
        // Firebase oder eine Karte, deren Datei noch nicht eingebunden ist)
        mapImageEl.classList.remove('loaded');
        clearMarkers();
        showEmptyState('Für diese Szene liegt noch keine Karte vor.');
        return;
      }
      hideEmptyState();

      // Sanftes Überblenden: erst ausblenden, dann neues Bild laden
      mapImageEl.classList.remove('loaded');
      const nextImg = new Image();
      nextImg.onload = function () {
        mapImageEl.src = background;
        mapImageEl.classList.add('loaded');
        attachHiddenMarkersListener(sceneId);
        renderFogOfWar(); // erst jetzt hat #mapWrap seine endgueltige Groesse
      };
      nextImg.onerror = function () {
        showEmptyState('Kartenbild "' + background + '" konnte nicht geladen werden.');
      };
      nextImg.src = background;
    }

    function clearMarkers() {
      mapWrapEl.querySelectorAll('.marker').forEach(function (el) { el.remove(); });
    }

    function renderMarkers(markers) {
      clearMarkers();
      markers
        // Sub-Orte (parentId gesetzt) erscheinen nicht auf der Hauptkarte,
        // sondern nur als Hotspots im Overlay ihres Eltern-Markers (siehe
        // renderSubMarkers) - reduziert auf die Elternebene, kein Nest-Konzept.
        .filter(function (marker) { return !currentHiddenMarkerIds[marker.id] && !marker.parentId; })
        .forEach(function (marker) {
          const el = document.createElement('div');
          el.className = 'marker';
          el.style.top = marker.top + '%';
          el.style.left = marker.left + '%';
          el.innerHTML = '<div class="pin"></div><div class="label">' + marker.title + '</div>';
          el.onclick = function () { openOverlay(marker); };
          mapWrapEl.appendChild(el);
        });
    }

    // ---------- Live-Sichtbarkeit: welche Marker der SL gerade ausgeblendet hat ----------
    // Standardmäßig sind alle Marker einer Szene sichtbar. Setzt der SL im
    // Admin-Panel (regie.html) hiddenMarkersLive/{szene}/{markerId} = true,
    // verschwindet der Marker live bei allen Spielern, ohne Szenenwechsel
    // oder Codedeploy - ermöglicht schrittweises Aufdecken neuer Orte
    // innerhalb derselben Szene (siehe KAMPAGNEN-BIBEL 13.x).
    let currentSceneRawMarkers = [];
    let hiddenMarkersLiveRef = null;
    let hiddenMarkersLiveListener = null;
    let currentHiddenMarkerIds = {};

    function attachHiddenMarkersListener(sceneId) {
      if (hiddenMarkersLiveRef && hiddenMarkersLiveListener) {
        hiddenMarkersLiveRef.off('value', hiddenMarkersLiveListener);
      }
      currentHiddenMarkerIds = {};
      if (!db || !sceneId) { renderMarkers(currentSceneRawMarkers); return; }
      hiddenMarkersLiveRef = db.ref('hiddenMarkersLive/' + fbKey(sceneId));
      hiddenMarkersLiveListener = hiddenMarkersLiveRef.on('value', function (snap) {
        currentHiddenMarkerIds = snap.val() || {};
        renderMarkers(currentSceneRawMarkers);
        if (currentOverlayMarker) { clearSubMarkers(); renderSubMarkers(currentOverlayMarker); }
      }, function () {
        currentHiddenMarkerIds = {};
        renderMarkers(currentSceneRawMarkers);
        if (currentOverlayMarker) { clearSubMarkers(); renderSubMarkers(currentOverlayMarker); }
      });
    }

    // Liefert per Callback die aktive Variante (das ganze Objekt, nicht
    // nur das Bild) für einen Marker: null, falls der Marker keine
    // "variants" definiert, keine Firebase-Verbindung besteht, oder in
    // Firebase noch nichts gesetzt ist (markerVariant/<id>) - in all
    // diesen Fällen greifen die Basiswerte des Markers (img/desc)
    // unverändert wie bisher.
    function resolveActiveVariant(marker, callback) {
      if (!marker.variants || !db) { callback(null); return; }
      db.ref('markerVariant/' + fbKey(marker.id)).once('value').then(function (snap) {
        const activeKey = snap.val();
        callback(activeKey && marker.variants[activeKey] || null);
      }).catch(function () {
        callback(null);
      });
    }

    // ---------- Sub-Orte: Hotspots innerhalb eines Overlay-Bildes ----------
    // Sub-Orte sind normale Marker mit parentId - dieselbe flache Liste wie
    // currentSceneRawMarkers, nur mit Klick-Ziel "im Overlay" statt "auf der
    // Hauptkarte". Ermöglicht z.B. ein Dorfbild mit mehreren anklickbaren
    // Stellen (Dorfplatz/Markt/Heilerin/Tempel), ohne ein neues Nest-Konzept
    // im Datenmodell - ORTE/Vault-Baum/Export funktionieren dadurch bereits
    // unverändert, weil beide ohnehin flach über Marker-IDs iterieren.
    function clearSubMarkers() {
      overlayImgWrap.querySelectorAll('.sub-marker').forEach(function (el) { el.remove(); });
    }
    // Klick auf einen Sub-Ort-Pin öffnet KEIN neues Voll-Overlay (kein
    // Bildwechsel) - stattdessen ein kleiner Text-Callout direkt am Pin,
    // über demselben Bild. Nur ein Callout gleichzeitig offen: ein neuer
    // Klick schließt den vorherigen automatisch.
    function toggleSubMarkerCallout(pinEl) {
      const wasOpen = pinEl.classList.contains('open');
      overlayImgWrap.querySelectorAll('.sub-marker.open').forEach(function (el) { el.classList.remove('open'); });
      if (!wasOpen) pinEl.classList.add('open');
    }
    function renderSubMarkers(marker) {
      const children = currentSceneRawMarkers.filter(function (m) { return m.parentId === marker.id && !currentHiddenMarkerIds[m.id]; });
      children.forEach(function (child) {
        const el = document.createElement('div');
        // Pins nahe am Rand: Callout würde sonst vom umgebenden Bild
        // abgeschnitten - Öffnungsrichtung umkehren statt immer zentriert
        // nach oben (siehe .edge-*-Klassen im CSS).
        let cls = 'sub-marker';
        if (child.top < 45) cls += ' edge-bottom';
        if (child.left < 20) cls += ' edge-left';
        else if (child.left > 80) cls += ' edge-right';
        el.className = cls;
        el.style.top = child.top + '%';
        el.style.left = child.left + '%';
        el.innerHTML = '<div class="pin"></div><div class="label">' + child.title + '</div>' +
          '<div class="sub-marker-callout">' +
          '<button class="smc-close" aria-label="Schließen">✕</button>' +
          '<div class="smc-title">' + child.title + '</div>' +
          '<div class="smc-desc">' + (child.desc || '') + '</div>' +
          '</div>';
        el.querySelector('.pin').onclick = function (e) { e.stopPropagation(); toggleSubMarkerCallout(el); };
        el.querySelector('.smc-close').onclick = function (e) { e.stopPropagation(); el.classList.remove('open'); };
        overlayImgWrap.appendChild(el);
      });
    }

    let currentOverlayMarker = null;
    function openOverlay(marker) {
      overlayTitle.textContent = marker.title || '';
      overlayEl.classList.add('open');
      currentOverlayMarker = marker;
      setOpenMarker(currentRenderedScene, marker.id);

      resolveActiveVariant(marker, function (variant) {
        // Eine Variante kann "img" und/oder "desc" überschreiben. Fehlt
        // eines der beiden Felder bei der aktiven Variante (oder gibt es
        // gar keine aktive Variante), wird auf den Basiswert des Markers
        // zurückgefallen - siehe golden_lion_scenes.js für ein Beispiel
        // (Frachtraum: "standard" hat einen Zusatzsatz, "leer" nicht).
        const imgSrc = (variant && variant.img) || marker.img;
        const descText = (variant && variant.desc) || marker.desc || '';

        overlayDesc.textContent = descText;
        clearSubMarkers();

        if (imgSrc) {
          overlayImgWrap.classList.remove('empty');
          overlayImg.style.display = '';
          overlayImg.src = imgSrc;
          overlayImg.alt = marker.title || '';
          renderSubMarkers(marker);
        } else {
          overlayImgWrap.classList.add('empty');
          overlayImg.style.display = 'none';
          overlayImgWrap.textContent = 'Kein Bild hinterlegt.';
        }
      });
    }

    function closeOverlay() {
      overlayEl.classList.remove('open');
      currentOverlayMarker = null;
      clearOpenMarker();
    }
    document.getElementById('overlayClose').onclick = closeOverlay;
    overlayEl.addEventListener('click', function (e) {
      if (e.target === overlayEl) closeOverlay();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeOverlay();
    });

    let emptyStateEl = null;
    function showEmptyState(text) {
      if (!emptyStateEl) {
        emptyStateEl = document.createElement('div');
        emptyStateEl.className = 'empty-state';
        document.getElementById('stage').appendChild(emptyStateEl);
      }
      emptyStateEl.textContent = text;
      emptyStateEl.style.display = 'block';
    }
    function hideEmptyState() {
      if (emptyStateEl) emptyStateEl.style.display = 'none';
    }

    // ==========================================================
    // AUDIO: eigene Audiodatei pro Szene, per <audio>-Element
    // ==========================================================
    const bgAudio = document.getElementById('bgAudio');
    let currentAudioFile = null; // aktuell geladene Datei (Dateiname)
    let pendingAudioFile = undefined; // Szene kam, bevor das erste Mal reagiert werden konnte

    // Lautstärke/Stumm-Zustand pro Browser merken
    let savedVolume = parseInt(localStorage.getItem('korsaren_volume'), 10);
    if (isNaN(savedVolume)) savedVolume = 50;
    let isMuted = localStorage.getItem('korsaren_muted') !== 'false'; // Default: stumm, bis der Spieler selbst aktiviert

    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    volumeSlider.value = savedVolume;
    updateMuteBtnIcon();

    function updateMuteBtnIcon() {
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
    }

    function applyAudioState() {
      bgAudio.volume = savedVolume / 100;
      bgAudio.muted = isMuted;
      // Manche Browser pausieren <audio>, wenn es (noch) stummgeschaltet
      // erstellt wurde - sicherheitshalber erneut abspielen versuchen.
      if (currentAudioFile && bgAudio.paused) {
        bgAudio.play().catch(function () { /* Autoplay evtl. weiterhin blockiert, ignorieren */ });
      }
    }

    muteBtn.addEventListener('click', function () {
      isMuted = !isMuted;
      localStorage.setItem('korsaren_muted', isMuted ? 'true' : 'false');
      updateMuteBtnIcon();
      applyAudioState();
    });
    volumeSlider.addEventListener('input', function (e) {
      savedVolume = parseInt(e.target.value, 10);
      localStorage.setItem('korsaren_volume', String(savedVolume));
      if (savedVolume > 0 && isMuted) {
        isMuted = false;
        localStorage.setItem('korsaren_muted', 'false');
        updateMuteBtnIcon();
      }
      applyAudioState();
    });

    // ---------- Charakterbogen-Drawer ----------
    // Eigenständige Seite (charakterbogen.html) im iframe statt inline
    // eingebettet - vermeidet CSS-Konflikte (die Datei definiert eigene
    // :root-Variablen mit denselben Namen wie hier, z.B. --gold/--line,
    // aber anderen Werten). iframe-src wird erst beim ersten Öffnen
    // gesetzt (lazy), damit die Seite nicht bei jedem Kartenaufruf
    // mitgeladen wird, auch wenn niemand den Bogen öffnet.
    (function () {
      const handle = document.getElementById('charSheetHandle');
      const backdrop = document.getElementById('charSheetBackdrop');
      const drawer = document.getElementById('charSheetDrawer');
      const iframe = document.getElementById('charSheetFrame');
      let loaded = false;

      function openDrawer() {
        if (!loaded) { iframe.src = 'charakterbogen.html'; loaded = true; }
        drawer.classList.add('open');
        backdrop.classList.add('open');
      }
      function closeDrawer() {
        drawer.classList.remove('open');
        backdrop.classList.remove('open');
      }
      window.toggleCharSheetDrawer = function () {
        if (drawer.classList.contains('open')) closeDrawer(); else openDrawer();
      };
      window.closeCharSheetDrawer = closeDrawer;
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeDrawer();
      });
    })();

    // Browser blockieren Autoplay MIT Ton grundsätzlich - das lässt sich
    // nicht umgehen. Um es so nah wie möglich an "startet direkt mit Ton"
    // heranzubringen: der allererste Klick/Tap irgendwo auf der Seite
    // schaltet automatisch frei, nicht erst ein gezielter Klick auf den
    // Lautsprecher-Button. Da Spieler ohnehin schnell auf einen Marker
    // klicken, fühlt sich das in der Praxis fast nahtlos an.
    // Wurde der Ton beim letzten Besuch bewusst stummgeschaltet
    // (localStorage), respektieren wir das und schalten NICHT automatisch frei.
    const wasExplicitlyMuted = localStorage.getItem('korsaren_muted') === 'true';
    if (!wasExplicitlyMuted) {
      const unlockOnFirstInteraction = function () {
        if (!isMuted) return;
        isMuted = false;
        localStorage.setItem('korsaren_muted', 'false');
        updateMuteBtnIcon();
        applyAudioState();
      };
      document.addEventListener('click', unlockOnFirstInteraction, { once: true });
      document.addEventListener('touchstart', unlockOnFirstInteraction, { once: true });
      document.addEventListener('keydown', unlockOnFirstInteraction, { once: true });
    }

    // Erwartet den Dateinamen der Audiodatei (oder null) als Parameter -
    // wird als Callback an resolveSoundForScene(sceneId, ...) übergeben,
    // da die Auflösung (Firebase-Override vs. statisches Feld) asynchron läuft.
    function syncAudioForScene(audioFile) {
      if (audioFile === currentAudioFile) return; // schon richtig, nichts zu tun
      currentAudioFile = audioFile;

      if (!audioFile) {
        bgAudio.pause();
        bgAudio.removeAttribute('src');
        return;
      }
      bgAudio.src = 'audio/' + audioFile;
      applyAudioState();
      bgAudio.play().catch(function () {
        // Blockiertes Autoplay ist normal, solange isMuted=true nichts
        // Falsches signalisiert - sobald freigeschaltet wird, greift
        // applyAudioState() erneut und startet die Wiedergabe.
      });
    }

    // ==========================================================
    // CHARAKTERLEISTE: welche Portraits sind in der aktuellen Szene aktiv
    // ==========================================================
    const charRailEl = document.getElementById('charRail');
    let charRailRef = null;      // aktuell aktiver Firebase-Ref (zum sauberen Abhängen)
    let charRailListener = null; // zugehöriger on('value')-Handler

    function renderCharacterRail(sceneId) {
      // Alten Live-Listener abhängen, falls Szene sich ändert - sonst
      // würden mehrere Listener gleichzeitig laufen und sich überlagern.
      if (charRailRef && charRailListener) {
        charRailRef.off('value', charRailListener);
      }
      charRailEl.innerHTML = '';

      if (typeof CHARACTERS === 'undefined' || !db) return;

      charRailRef = db.ref('sceneCharacters/' + fbKey(sceneId));
      charRailListener = charRailRef.on('value', function (snap) {
        const active = snap.val() || {};
        const activeChars = CHARACTERS.filter(function (ch) { return !!active[ch.id]; });

        charRailEl.innerHTML = '';
        activeChars.forEach(function (ch) {
          const card = document.createElement('div');
          card.className = 'char-card';
          card.innerHTML =
            '<img src="' + ch.img + '" alt="' + ch.name + '">' +
            '<div class="char-name">' + ch.name + '</div>';
          charRailEl.appendChild(card);
        });
      }, function () {
        charRailEl.innerHTML = '';
      });
    }

    // ==========================================================
    // FIREBASE: live, ohne dass Spieler aktualisieren müssen
    // ==========================================================
    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      initDiceRoller(db);

      db.ref('currentScene').on('value', function (snapshot) {
        const sceneId = snapshot.val() || getFallbackDefaultScene();
        statusEl.textContent = 'Verbunden';
        statusEl.className = 'connected';
        setTimeout(function () { statusEl.classList.add('hidden'); }, 1200);
        renderScene(sceneId);
        resolveSoundForScene(sceneId, syncAudioForScene);
        renderCharacterRail(sceneId);
      }, function (err) {
        statusEl.textContent = 'Verbindungsfehler: ' + err.message;
        statusEl.className = 'error';
      });
    } catch (e) {
      statusEl.textContent = 'Firebase-Konfiguration fehlt oder ist fehlerhaft.';
      statusEl.className = 'error';
      renderScene(getFallbackDefaultScene());
      resolveSoundForScene(getFallbackDefaultScene(), syncAudioForScene);
      renderCharacterRail(getFallbackDefaultScene());
    }
  </script>

</body>
</html>
