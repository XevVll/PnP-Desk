<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Grimsgate – Admin</title>
<style>
  :root {
    --bg: #14100b; --panel: #1a130b; --panel-2: #221808; --line: #3a2a18;
    --ink: #cbb98f; --ink-dim: #8a7a5c; --ink-faint: #6b5d45;
    --gold: #c9a24b; --accent: #a8391e; --live: #7fa87f; --live-dim: #3a4a3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); font-family: 'Georgia', 'Times New Roman', serif; color: var(--ink); display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 14px 24px 10px; text-align: center; border-bottom: 1px solid var(--line); flex: none; }
  h1 { color: var(--gold); letter-spacing: 4px; text-transform: uppercase; font-size: 20px; margin: 0 0 4px 0; }
  .subtitle { color: var(--ink-dim); font-style: italic; font-size: 12px; margin-bottom: 8px; }
  .status { font-size: 12px; color: var(--ink-dim); }
  .status.connected { color: var(--live); }
  .status.error { color: #c76a5a; }

  #soundBar { display: flex; align-items: center; gap: 10px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; }
  #soundBarLabel { color: var(--gold); font-family: inherit; white-space: nowrap; }
  .soundBarIcon { color: var(--ink-faint); }
  #soundLinkInput { flex: 1; max-width: 480px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; color: var(--ink); font-family: inherit; font-size: 13px; padding: 6px 10px; }
  #soundLinkInput:focus { outline: none; border-color: var(--gold); }
  .save-hint { font-size: 11px; color: var(--ink-faint); min-width: 100px; }
  .save-hint.saved { color: var(--live); }
  .save-hint.error { color: #c76a5a; }

  #charBar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; }
  #charBarLabel { color: var(--gold); white-space: nowrap; }
  #charCheckboxes { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .char-toggle { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-dim); cursor: pointer; user-select: none; }
  .char-toggle input { accent-color: var(--gold); cursor: pointer; }
  .char-toggle.active { color: var(--ink); }
  .char-more-btn { font-family: inherit; font-size: 12px; background: transparent; border: 1px dashed var(--line); color: var(--ink-faint); border-radius: 3px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  .char-more-btn:hover { border-color: var(--gold); color: var(--ink); }

  #toolbarStrip { display: flex; align-items: center; gap: 16px; padding: 6px 24px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  #toolDrawerToggle { font-family: inherit; font-size: 12px; background: transparent; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 3px; padding: 4px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  #toolDrawerToggle:hover { border-color: var(--gold); color: var(--ink); }
  #toolDrawerToggle .chev { font-size: 10px; transition: transform .15s; }
  #toolDrawerToggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  #timerTicker { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  #timerTickerTime { font-family: 'Georgia', serif; font-size: 16px; letter-spacing: 1px; color: var(--gold); min-width: 74px; }
  #timerTickerAlert { display: none; font-size: 11px; color: #e0a08e; border: 1px solid var(--accent); border-radius: 12px; padding: 2px 9px; animation: markPulse 1.6s ease-in-out infinite; }
  #timerTickerAlert.on { display: inline-block; }
  #toolDrawer { display: none; border-bottom: 1px solid var(--line); flex: none; }
  #toolDrawer.open { display: block; }
  #toolDrawer #charBar { border-bottom: none; }

  #previewWidget { position: fixed; bottom: 16px; right: 16px; z-index: 250; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #previewToggle { background: rgba(15,12,8,0.85); border: 1px solid var(--line); color: var(--ink-dim); border-radius: 20px; padding: 6px 14px; font-size: 11.5px; backdrop-filter: blur(2px); }
  #previewToggle:hover { border-color: var(--gold); color: var(--ink); }
  #previewPanel { display: none; width: 380px; height: 300px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.55); background: #000; }
  #previewPanel.open { display: block; }
  #previewFrame { width: 100%; height: 100%; border: none; }
  @media (max-width: 500px) { #previewPanel { width: 88vw; height: 66vw; } }

  #exportToggle { font-family: inherit; font-size: 12px; background: transparent; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 3px; padding: 4px 12px; cursor: pointer; }
  #exportToggle:hover { border-color: var(--gold); color: var(--ink); }
  #exportOverlay { position: fixed; inset: 0; background: rgba(10,8,5,0.82); display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
  #exportOverlay.open { display: flex; }
  #exportModal { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-width: 720px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
  #exportHdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--gold); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; flex: none; }
  #exportClose { background: none; border: none; color: var(--ink-dim); font-size: 18px; cursor: pointer; line-height: 1; }
  #exportClose:hover { color: var(--ink); }
  #exportBody { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  #exportScopeRow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 13px; }
  .export-scope-opt { display: flex; align-items: center; gap: 5px; color: var(--ink-dim); cursor: pointer; }
  .export-scope-opt input { accent-color: var(--gold); cursor: pointer; }
  #exportRegen { font-family: inherit; font-size: 12px; background: transparent; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 3px; padding: 5px 12px; cursor: pointer; margin-left: auto; }
  #exportRegen:hover { border-color: var(--gold); color: var(--ink); }
  #exportPreview { width: 100%; min-height: 340px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); font-family: 'Consolas', 'Courier New', monospace; font-size: 12.5px; line-height: 1.5; padding: 12px; resize: vertical; }
  #exportPreview:focus { outline: none; border-color: var(--gold); }
  #exportActionsRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #exportCopyBtn, #exportDownloadBtn { font-family: inherit; font-size: 12px; background: transparent; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 3px; padding: 6px 12px; cursor: pointer; }
  #exportCopyBtn:hover, #exportDownloadBtn:hover { border-color: var(--gold); color: var(--ink); }
  @media (max-width: 560px) { #exportModal { max-width: 100%; } #exportPreview { min-height: 240px; } }

  #timerBar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13px; }
  #timerDisplay { font-family: 'Georgia', serif; font-size: 18px; letter-spacing: 1px; color: var(--gold); min-width: 78px; }
  .timer-btn { font-family: inherit; font-size: 11.5px; background: transparent; border: 1px solid var(--line); color: var(--ink-faint); border-radius: 3px; padding: 5px 10px; cursor: pointer; }
  .timer-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
  .timer-btn.running { border-color: var(--live); color: var(--live); }
  #timerMarkForm { display: flex; align-items: center; gap: 6px; }
  #timerMarkLabel { width: 150px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; color: var(--ink); font-family: inherit; font-size: 12.5px; padding: 5px 8px; }
  #timerMarkMinutes { width: 60px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; color: var(--ink); font-family: inherit; font-size: 12.5px; padding: 5px 8px; }
  #timerMarkLabel:focus, #timerMarkMinutes:focus { outline: none; border-color: var(--gold); }
  #timerMarks { display: flex; flex-wrap: wrap; gap: 6px; }
  .timer-mark { font-size: 11.5px; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .timer-mark:hover { border-color: var(--accent); color: #e0a08e; }
  .timer-mark.due { border-color: var(--accent); color: #e0a08e; background: rgba(168,57,30,0.15); animation: markPulse 1.6s ease-in-out infinite; }
  @keyframes markPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(168,57,30,0.4); } 50% { box-shadow: 0 0 0 5px rgba(168,57,30,0); } }

  #diceControls { position: fixed; bottom: 16px; left: 16px; z-index: 200; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: rgba(15,12,8,0.75); border: 1px solid var(--line); border-radius: 24px; padding: 8px 14px; backdrop-filter: blur(2px); font-size: 12.5px; }
  #diceNameLabel { color: var(--ink-dim); cursor: pointer; white-space: nowrap; }
  #diceNameLabel:hover { color: var(--gold); }
  #diceD100Btn, #diceForm button { font-family: inherit; font-size: 12.5px; background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 3px; padding: 5px 10px; cursor: pointer; }
  #diceD100Btn:hover, #diceForm button:hover { border-color: var(--gold); color: var(--gold); }
  #diceForm { display: flex; align-items: center; gap: 6px; }
  #diceForm input { width: 42px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; color: var(--ink); font-family: inherit; font-size: 12.5px; padding: 5px 6px; }
  #diceFeed { position: fixed; top: 16px; left: 16px; z-index: 200; display: flex; flex-direction: column; gap: 6px; max-width: 320px; }
  .dice-toast { background: rgba(15,12,8,0.85); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; font-size: 12.5px; color: var(--ink); transition: opacity .4s ease; }
  .dice-toast.fade { opacity: 0; }
  .dice-toast.private { border-style: dashed; font-style: italic; }
  #dicePrivateLabel { display: flex; align-items: center; gap: 5px; color: var(--ink-dim); font-size: 12px; cursor: pointer; white-space: nowrap; }
  #dicePrivateLabel input { accent-color: var(--gold); cursor: pointer; }

  /* ============================================================
     VAULT-BOARD — ersetzt die alte 3-Spalten-Ansicht (Szenen/Orte/
     Detail). Helles Pergament-Schema (bewusst anders als das dunkle
     App-Chrome oben), Schrift skaliert mit der Fensterbreite.
     ============================================================ */
  html { font-size: clamp(14px, 0.5vw + 7px, 19px); }
  .vault {
    --vbg: #e9ddc0; --vpanel: #f4ecda; --vpanel2: #f1e8cf; --vpanel3: #e6d9b0;
    --vline: #cdbb8e; --vline-soft: #dccfa8;
    --vink: #241a0e; --vink-dim: #5a4a2e; --vink-faint: #8a7550;
    --vgold: #8a5e12; --vgold-soft: rgba(138,94,18,.13);
    --vaccent: #9a3018; --vaccent-soft: rgba(154,48,24,.13);
    --vlive: #3d6b3d; --vlive-soft: rgba(61,107,61,.15);
    --vwarn: #a8661e; --vwarn-soft: rgba(168,102,30,.14);
    --vpaper: #fffaf0;
    display: grid; grid-template-columns: minmax(200px,15rem) 1.3fr 1fr minmax(175px,13.5rem);
    grid-template-rows: minmax(0,1fr) auto;
    flex: 1; min-height: 0;
    background: var(--vbg); color: var(--vink); font-size: 1rem;
  }
  #sceneHead {
    --vpanel2: #f1e8cf; --vline-soft: #dccfa8; --vink: #241a0e; --vink-dim: #5a4a2e;
    --vgold: #8a5e12; --vgold-soft: rgba(138,94,18,.13); --vpaper: #fffaf0;
    display: none; flex: none; padding: 0.6rem 1.2rem; background: var(--vpaper);
    border-bottom: 1px solid var(--vline-soft); font-size: 0.92rem; color: var(--vink);
  }
  #sceneHead.has-content { display: block; }
  .sh-goal, .sh-mood { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .sh-goal-label, .sh-mood-label, .sh-quests-label { font-size: 0.76rem; letter-spacing: .5px; text-transform: uppercase; font-weight: 700; color: var(--vgold); white-space: nowrap; }
  .sh-mood-label { color: var(--vink-dim); }
  .sh-mood-text { color: var(--vink-dim); font-size: 0.86rem; }
  .sh-quests { margin-top: 6px; }
  .sh-quests-label { display: block; margin-bottom: 4px; }
  .sh-quest { display: flex; align-items: flex-start; gap: 10px; background: var(--vpanel2); border-left: 3px solid var(--vgold); border-radius: 0 4px 4px 0; padding: 0.4rem 0.6rem; margin-bottom: 6px; }
  .sh-quest-body { flex: 1; min-width: 0; }
  .sh-quest-was, .sh-quest-warum { font-size: 0.86rem; line-height: 1.4; }
  .sh-quest-src { font-size: 0.74rem; color: var(--vink-dim); margin-top: 2px; }
  .sh-quest-done { flex: none; font-family: inherit; font-size: 0.76rem; background: transparent; border: 1px solid var(--vline-soft); color: var(--vink-dim); border-radius: 3px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  .sh-quest-done:hover { border-color: var(--vgold); color: var(--vgold); }
  /* Erkundungs-Graph-Panel (js/exploration_graphs.js) - SL-Sicht: aktueller
     Knoten, bei Ereignis-Knoten die Probe/den Text zum Vorlesen, bei
     Entscheidungsknoten die Live-Stimmverteilung + Direktwahl jeder Option. */
  .sh-graph { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--vline-soft); }
  .sh-graph-label { font-size: 0.76rem; letter-spacing: .5px; text-transform: uppercase; font-weight: 700; color: var(--vgold); margin-bottom: 4px; }
  .sh-graph-ereignis-text, .sh-graph-ort-text { font-size: 0.86rem; color: var(--vink-dim); margin-bottom: 6px; }
  .sh-graph-options { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
  .sh-graph-btn { font-family: inherit; font-size: 0.84rem; background: var(--vpanel2); border: 1px solid var(--vline-soft); color: var(--vink); border-radius: 5px; padding: 6px 10px; cursor: pointer; text-align: left; }
  .sh-graph-btn:hover { border-color: var(--vgold); }
  .sh-graph-option { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sh-graph-hinweis { flex: 1; }
  .sh-graph-votes { flex: none; font-size: 0.74rem; color: var(--vink-faint); white-space: nowrap; }
  .sh-graph-leader { border-color: var(--vlive); background: var(--vlive-soft); }
  .sh-graph-total { font-size: 0.74rem; color: var(--vink-faint); margin-top: 4px; }
  .sh-graph-ort-probe { background: var(--vwarn-soft); border: 1px solid var(--vwarn); border-radius: 6px; padding: 8px 10px; margin-top: 4px; }
  .sh-graph-ort-title { font-weight: 700; margin-bottom: 4px; }
  .sh-graph-probe { font-weight: 400; color: var(--vink-dim); }
  .sh-graph-ort-buttons { display: flex; gap: 8px; margin-top: 6px; }
  .sh-graph-btn-erfolg { border-color: var(--vlive); color: var(--vlive); }
  .sh-graph-btn-misserfolg { border-color: var(--vaccent); color: var(--vaccent); }
  .v-tree { grid-row: 1/2; background: var(--vpanel); border-right: 1px solid var(--vline); overflow-y: auto; padding-bottom: 0.8rem; }
  .v-tree-head { padding: 0.56rem 0.8rem 0.32rem; font-size: 0.76rem; letter-spacing: 1.2px; color: var(--vink-faint); }
  .v-pane { grid-row: 1/2; overflow: hidden; display: flex; flex-direction: column; border-right: 1px solid var(--vline); }
  .v-pane-tab { flex: none; padding: 0.4rem 0.96rem; font-size: 0.84rem; color: var(--vink-dim); background: var(--vpanel2); border-bottom: 1px solid var(--vline); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v-pane-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0.8rem 1.12rem; }
  /* rechtsbündig, damit der Text nicht unter dem fest positionierten
     Würfel-Widget (unten links, siehe #diceControls) verschwindet */
  .v-status { grid-column: 1/5; grid-row: 2/3; display: flex; align-items: center; justify-content: flex-end; gap: 0.8rem; padding: 0.32rem 0.8rem; font-size: 0.8rem; color: var(--vink-faint); background: var(--vpanel2); border-top: 1px solid var(--vline); }
  .v-rail { grid-row: 1/2; background: var(--vpanel); border-left: 1px solid var(--vline); overflow-y: auto; padding-bottom: 0.8rem; }
  .v-rail-head { padding: 0.56rem 0.8rem 0.32rem; font-size: 0.76rem; letter-spacing: 1.2px; color: var(--vink-faint); text-transform: uppercase; }
  .v-rail-sub { padding: 0.4rem 0.8rem 0.16rem; font-size: 0.68rem; letter-spacing: .6px; text-transform: uppercase; color: var(--vink-faint); opacity: .85; }
  /* flex:1 + min-width:0 nötig, damit lange Wörter (z.B. "SPIELERCHARAKTERE")
     im schmalen Rail-Feld umbrechen statt seitlich abgeschnitten zu werden -
     ohne min-width:0 verweigert ein Flex-Kind das Schrumpfen unter seine
     Inhaltsbreite. */
  .v-rail-sub-label { flex: 1; min-width: 0; overflow-wrap: break-word; }
  .v-rail-item { display: flex; align-items: center; gap: 0.4rem; width: 100%; text-align: left; background: none; border: none; border-left: 2px solid transparent; padding: 0.24rem 0.8rem; cursor: pointer; color: var(--vink-dim); font-size: 0.86rem; font-family: inherit; }
  .v-rail-item:hover { background: var(--vpanel3); color: var(--vink); }
  .v-rail-item.inA { border-left-color: var(--vgold); color: var(--vgold); background: var(--vgold-soft); }
  .v-rail-item.inB { border-left-color: var(--vlive); color: var(--vlive); }
  .v-rail-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .v-node { display: flex; align-items: center; gap: 0.4rem; padding: 0.24rem 0.8rem; cursor: pointer; color: var(--vink-dim); font-size: 0.88rem; border-left: 2px solid transparent; }
  .v-node.active { border-left-color: var(--vgold); color: var(--vgold); background: var(--vgold-soft); }
  .v-node:hover { background: var(--vpanel3); color: var(--vink); }
  .v-node.lvl1 { padding-left: 1.76rem; }
  .v-node.lvl2 { padding-left: 2.72rem; }
  .v-caret { flex: none; width: 0.8rem; font-size: 0.72rem; color: var(--vink-faint); }
  .v-file { display: flex; align-items: center; gap: 0.4rem; padding: 0.24rem 0.8rem; cursor: pointer; font-size: 0.88rem; color: var(--vink-dim); border-left: 2px solid transparent; white-space: nowrap; overflow: hidden; }
  .v-file:hover { background: var(--vpanel3); color: var(--vink); }
  .v-file.inA { border-left-color: var(--vgold); color: var(--vgold); background: var(--vgold-soft); }
  .v-file.inB { border-left-color: var(--vlive); color: var(--vlive); }
  .v-file.lvl3 { padding-left: 3.68rem; }
  .v-file-icon { flex: none; font-size: 0.8rem; opacity: .75; }
  .v-file-label { overflow: hidden; text-overflow: ellipsis; }
  .v-live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--vlive); flex: none; box-shadow: 0 0 4px var(--vlive); }

  .v-h1 { margin: 0 0 6px; color: var(--vgold); font-size: 1.2rem; line-height: 1.3; }
  .v-prop { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.88rem; margin: 0 0 8px; padding: 0.48rem 0.72rem; background: var(--vpanel2); border: 1px solid var(--vline-soft); border-radius: 4px; }
  .v-prop dt { color: var(--vink-faint); white-space: nowrap; }
  .v-prop dd { margin: 0; color: var(--vink); }
  .v-callout { border-left: 3px solid var(--vink-faint); background: var(--vpanel2); border-radius: 0 4px 4px 0; padding: 0.4rem 0.72rem 0.56rem; margin: 0 0 8px; font-size: 0.96rem; line-height: 1.5; }
  .v-callout-title { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; letter-spacing: .5px; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; color: var(--vink-dim); }
  .v-callout.readaloud { border-left-color: var(--vgold); background: var(--vpaper); color: var(--vink); white-space: pre-line; }
  .v-callout.readaloud .v-callout-title { color: var(--vgold); }
  .v-callout.hinweis { border-left-color: var(--vaccent); background: var(--vaccent-soft); white-space: pre-line; }
  .v-callout.hinweis .v-callout-title { color: var(--vaccent); }

  .v-chk { display: flex; align-items: flex-start; gap: 6px; padding: 4px 0; }
  .v-chk .box { flex: none; width: 0.96rem; height: 0.96rem; margin-top: 3px; border: 1.3px solid var(--vink-faint); border-radius: 2px; cursor: pointer; background: none; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 0.64rem; color: transparent; }
  .v-chk .box:hover { border-color: var(--vgold); }
  .v-chk .box.on { background: var(--vlive); border-color: var(--vlive); color: #f4ecda; }
  .v-chk-main { flex: 1; min-width: 0; }
  .v-chk-lbl-row { display: flex; align-items: baseline; gap: 6px; }
  .v-chk .lbl { display: block; flex: 1; min-width: 0; }
  .v-chk.on .lbl { color: var(--vink-dim); text-decoration: line-through; text-decoration-color: var(--vink-faint); }
  .v-chk .pencil { flex: none; background: none; border: none; color: var(--vink-faint); cursor: pointer; font-size: 0.8rem; padding: 0 2px; }
  .v-chk .pencil:hover, .v-chk .pencil.has { color: var(--vgold); }
  /* Story-Info direkt am Ablauf-Punkt, wie ein kleiner Lesetext-Ausschnitt */
  .v-chk-info { margin-top: 3px; padding: 0.32rem 0.56rem; background: var(--vpaper); border-left: 2px solid var(--vgold-soft); border-radius: 0 3px 3px 0; font-size: 0.84rem; line-height: 1.5; color: var(--vink-dim); white-space: pre-line; }
  .v-chk.on .v-chk-info { opacity: .6; }
  .v-chk-note { margin: 1px 0 5px 1.44rem; }
  .v-note-field { width: 100%; resize: vertical; min-height: 24px; background: var(--vbg); border: 1px solid var(--vline-soft); border-radius: 3px; color: var(--vink); font-family: 'Georgia', serif; font-size: 0.88rem; padding: 4px 6px; line-height: 1.35; }
  .v-note-field:focus { border-color: var(--vgold); outline: none; }
  .v-save-hint { font-size: 0.76rem; color: var(--vink-faint); min-height: 1em; }
  .v-save-hint.saved { color: var(--vlive); }
  .v-save-hint.error { color: var(--vaccent); }

  .v-tag { display: inline-block; font-family: ui-monospace, Consolas, monospace; font-size: 0.76rem; color: var(--vgold); background: var(--vgold-soft); padding: 1px 5px; border-radius: 3px; margin: 0 3px 3px 0; white-space: nowrap; }
  .v-sb { border: 1px solid var(--vline-soft); border-radius: 4px; padding: 0.4rem 0.64rem; margin-bottom: 0.4rem; background: var(--vpanel2); }
  .v-sb-head { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; }
  .v-sb-name { color: var(--vgold); font-weight: 700; }
  .v-sb-rolle { color: var(--vink-faint); font-size: 0.8rem; }
  .v-sb-line { font-size: 0.82rem; color: var(--vink-dim); margin-top: 2px; }
  .v-sb-line b { color: var(--vink-faint); font-weight: 600; }

  .v-vis-btn { font-family: inherit; font-size: 0.76rem; background: transparent; border: 1px solid var(--vlive); color: var(--vlive); border-radius: 3px; padding: 2px 7px; cursor: pointer; white-space: nowrap; margin-left: auto; }
  .v-vis-btn:hover { border-color: var(--vaccent); color: var(--vaccent); }
  .v-vis-btn.is-hidden { color: var(--vink-faint); border-color: var(--vline); }
  .v-variant-btn { font-family: inherit; font-size: 0.84rem; background: var(--vpanel); border: 1px solid var(--vline); color: var(--vink-dim); border-radius: 3px; padding: 5px 10px; cursor: pointer; margin: 0 6px 6px 0; }
  .v-variant-btn:hover { border-color: var(--vink-faint); color: var(--vink); }
  .v-variant-btn.active { border-color: var(--vgold); color: var(--vgold); background: var(--vgold-soft); }
  /* feste Breite + nowrap, damit "live" und "live setzen" gleich groß
     bleiben statt je nach Textlänge unterschiedlich breit zu sein oder
     (bei "live setzen") im schmalen Baum umzubrechen */
  .v-live-btn { flex: none; width: 5.4rem; white-space: nowrap; text-align: center; font-family: inherit; font-size: 0.72rem; background: transparent; border: 1px solid var(--vline); color: var(--vink-faint); border-radius: 3px; padding: 3px 4px; cursor: pointer; margin-left: 6px; }
  .v-live-btn:hover { border-color: var(--vaccent); color: var(--vaccent); }
  .v-live-btn.is-live { border-color: var(--vlive); color: var(--vlive); }

  .v-backlinks { margin-top: 10px; border-top: 1px solid var(--vline-soft); padding-top: 7px; }
  .v-backlinks h5 { margin: 0 0 5px; font-size: 0.76rem; letter-spacing: 1px; text-transform: uppercase; color: var(--vink-faint); }
  .v-backlink-item { display: block; width: 100%; text-align: left; background: var(--vpanel2); border: 1px solid var(--vline-soft); border-radius: 3px; padding: 4px 7px; margin-bottom: 3px; cursor: pointer; font-size: 0.84rem; color: var(--vink-dim); }
  .v-backlink-item b { color: var(--vgold); font-weight: 600; }
  .v-backlink-item span { color: var(--vink-faint); }
  .v-backlink-item:hover { border-color: var(--vgold); }

  .v-rede-teil { margin-bottom: 0.7rem; }
  .v-rede-teil:last-child { margin-bottom: 0; }
  .v-rede-teil-titel { font-size: 0.82rem; font-weight: 700; color: var(--vink-dim); margin-bottom: 4px; }
  .v-rede-stufe { border-radius: 3px; padding: 0.32rem 0.56rem; margin-bottom: 4px; border-left: 3px solid var(--vline-soft); background: var(--vpanel2); }
  .v-rede-stufe-head { display: flex; align-items: center; justify-content: space-between; font-size: 0.72rem; letter-spacing: .4px; text-transform: uppercase; font-weight: 700; margin-bottom: 3px; color: var(--vink-faint); }
  .v-rede-text { font-size: 0.86rem; line-height: 1.5; white-space: pre-line; }
  .v-rede-copy { flex: none; background: none; border: none; cursor: pointer; font-size: 0.8rem; color: var(--vink-faint); padding: 0 2px; }
  .v-rede-copy:hover { color: var(--vgold); }
  .v-rede-gut { border-left-color: var(--vlive); }
  .v-rede-gut .v-rede-stufe-head { color: var(--vlive); }
  .v-rede-normal { border-left-color: var(--vgold); }
  .v-rede-normal .v-rede-stufe-head { color: var(--vgold); }
  .v-rede-schlecht { border-left-color: var(--vwarn); }
  .v-rede-schlecht .v-rede-stufe-head { color: var(--vwarn); }
  .v-rede-miss { border-left-color: var(--vaccent); }
  .v-rede-miss .v-rede-stufe-head { color: var(--vaccent); }
  .v-empty { font-size: 0.8rem; color: var(--vink-faint); font-style: italic; padding: 0.24rem 0; }

  .v-ruf-track { display: inline-flex; gap: 2px; vertical-align: middle; }
  .v-ruf-seg { width: 0.88rem; height: 0.56rem; border-radius: 1px; background: var(--vline); cursor: pointer; border: 1px solid var(--vline-soft); padding: 0; }
  .v-ruf-seg.on { background: var(--vgold); border-color: var(--vgold); }
  .v-ruf-seg:hover { border-color: var(--vgold); }
  .v-ruf-row { display: flex; align-items: center; gap: 0.64rem; padding: 0.16rem 0; font-size: 0.88rem; }
  .v-ruf-name { flex: 1; min-width: 0; }
  .v-ruf-tier { color: var(--vink-faint); font-size: 0.8rem; white-space: nowrap; }

  .v-add-btn { flex: none; background: none; border: 1px solid var(--vline-soft); color: var(--vink-dim); border-radius: 3px; width: 1.28rem; height: 1.28rem; line-height: 1; cursor: pointer; font-size: 0.88rem; }
  .v-add-btn:hover { border-color: var(--vgold); color: var(--vgold); }
  .v-add-panel { margin: 0.32rem 0.8rem 0.8rem; padding: 0.64rem; background: var(--vpanel2); border: 1px solid var(--vline-soft); border-radius: 5px; }
  .v-add-sub { font-size: 0.76rem; letter-spacing: .4px; text-transform: uppercase; color: var(--vink-faint); margin: 0.48rem 0 0.32rem; }
  .v-add-sub:first-child { margin-top: 0; }
  .v-add-item { display: block; width: 100%; text-align: left; background: var(--vpanel); border: 1px solid var(--vline-soft); border-radius: 3px; padding: 0.32rem 0.56rem; margin-bottom: 0.24rem; cursor: pointer; font-size: 0.84rem; color: var(--vink-dim); }
  .v-add-item i { color: var(--vink-faint); font-style: italic; }
  .v-add-item:hover { border-color: var(--vgold); color: var(--vgold); }
  .v-form { display: flex; flex-direction: column; gap: 0.32rem; }
  .v-form input, .v-form select { background: var(--vbg); border: 1px solid var(--vline-soft); border-radius: 3px; color: var(--vink); font-family: inherit; font-size: 0.84rem; padding: 0.32rem 0.48rem; }
  .v-form button { margin-top: 0.16rem; background: var(--vgold-soft); border: 1px solid var(--vgold); color: var(--vgold); border-radius: 3px; padding: 0.32rem; font-size: 0.84rem; cursor: pointer; }
  .v-folder-row { display: flex; align-items: center; justify-content: space-between; padding-right: 0.64rem; }

  @media (max-width: 980px) {
    .vault { grid-template-columns: minmax(150px,11rem) 1.3fr 1fr minmax(120px,9rem); }
  }
</style>
</head>
<body>

<header>
  <h1>Grimsgate – Admin</h1>
  <div class="subtitle">Baum links: Szene → Orte → Ort → Interaktion · Charaktere rechts · Panes in der Mitte (nur hier sichtbar)</div>
  <div class="status" id="status">Verbinde mit Firebase…</div>
</header>

<div id="toolbarStrip">
  <button id="toolDrawerToggle" aria-expanded="false">⚙ Werkzeuge <span class="chev">▾</span></button>
  <button id="exportToggle">📤 Export</button>
  <div id="timerTicker" title="Stoppuhr (Details im Werkzeug-Fach)">
    <span id="timerTickerTime">00:00:00</span>
    <span id="timerTickerAlert" title="Ein Zeit-Merker ist fällig">⏰ Merker fällig</span>
  </div>
</div>

<div id="toolDrawer">
  <div id="soundBar">
    <span id="soundBarLabel">Szene: –</span>
    <span class="soundBarIcon">🎵</span>
    <input type="text" id="soundLinkInput" placeholder="Dateiname der Audiodatei einfügen (z.B. storm1.ogg)…">
    <span class="save-hint" id="soundLinkHint"></span>
  </div>

  <div id="timerBar">
    <span id="timerDisplay">00:00:00</span>
    <button class="timer-btn" id="timerStartPause">Start</button>
    <button class="timer-btn" id="timerReset">Reset</button>
    <form id="timerMarkForm">
      <input type="text" id="timerMarkLabel" placeholder="Label, z.B. Junge/Wat">
      <input type="number" id="timerMarkMinutes" placeholder="Min" min="0">
      <button type="submit" class="timer-btn">+ Merker</button>
    </form>
    <div id="timerMarks"></div>
  </div>

  <div id="charBar">
    <span id="charBarLabel">Portraits in dieser Szene:</span>
    <div id="charCheckboxes"></div>
  </div>
</div>

<div id="previewWidget">
  <div id="previewPanel">
    <iframe id="previewFrame" title="Live-Vorschau Spieleransicht"></iframe>
  </div>
  <button id="previewToggle">▶ Live-Vorschau</button>
</div>

<div id="exportOverlay">
  <div id="exportModal">
    <div id="exportHdr">
      <span>Session-Export</span>
      <button id="exportClose" aria-label="Schließen">✕</button>
    </div>
    <div id="exportBody">
      <div id="exportScopeRow">
        <label class="export-scope-opt"><input type="radio" name="exportScope" value="scene" checked> Aktuelle Szene</label>
        <label class="export-scope-opt"><input type="radio" name="exportScope" value="all"> Ganze Kampagne</label>
        <button id="exportRegen">🔄 Neu generieren</button>
      </div>
      <textarea id="exportPreview" readonly placeholder="„Neu generieren“ klicken, um den aktuellen Stand als Markdown aufzubereiten…"></textarea>
      <div id="exportActionsRow">
        <button id="exportCopyBtn">📋 In Zwischenablage kopieren</button>
        <button id="exportDownloadBtn">⬇ Als Datei herunterladen</button>
        <span class="save-hint" id="exportMsg"></span>
      </div>
    </div>
  </div>
</div>

<div id="sceneHead"></div>

<div class="vault" id="vault">
  <div class="v-tree" id="v-tree"></div>
  <div class="v-pane" id="v-paneA"></div>
  <div class="v-pane" id="v-paneB"></div>
  <div class="v-rail" id="v-rail"></div>
  <div class="v-status" id="v-status"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/scenes.js"></script>
<script src="js/golden_lion_scenes.js"></script>
<script src="js/schatzinsel_scenes.js"></script>
<script src="js/spanischer_hafen_scenes.js"></script>
<script src="js/schmugglernest_scenes.js"></script>
<script src="js/artefakthandel_scenes.js"></script>
<script src="js/riffinsel_scenes.js"></script>
<script src="js/exploration_graphs.js"></script>
<script src="js/characters.js"></script>
<script src="js/npc_roster.js"></script>
<script src="js/dice.js"></script>
<script src="js/regie.js"></script>

<script src="js/regie_vault.js"></script>
</body>
</html>
